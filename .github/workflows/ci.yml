# Automatische Prüfung bei jedem Push (Beta und live): Linter, Rechenlogik-Tests, Abgleich
# JS <-> SQL auf einer frischen Wegwerf-Datenbank aus allen Migrationen, Typprüfung der Edge
# Functions. Schlägt etwas fehl, zeigt GitHub den Push rot (Reiter "Actions") und schickt eine
# Mail. Die Seite selbst wird trotzdem veröffentlicht - die CI ist das Warnsignal, nicht die Sperre.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Linter, Tests, Migrationen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Vorschau-Server starten
        run: |
          node dev/server.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:5180/ > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Tests der Rechenlogik
        run: node dev/tests.mjs
      # Bedienabläufe: Registrieren, Onboarding, Tutorial, App - scheitern, wenn ein Knopf fehlt
      # oder die Seite dabei einen Fehler wirft.
      - name: Rundgänge (Handy)
        run: node dev/rundgang.mjs alle
      - name: Rundgang App (PC, dunkel, große Schrift)
        run: node dev/rundgang.mjs app --device=pc --theme=dark --size=xlarge
      - name: Screenshots bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dev/screenshots/
          retention-days: 7
      - name: Wegwerf-Datenbank aus allen Migrationen
        run: npx supabase db start
      - name: Abgleich JS <-> SQL
        run: node dev/sync-tests.mjs

  functions:
    name: Edge Functions (Typprüfung)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # node_modules-Ordner automatisch: sonst sucht Deno wegen package.json im Projektstamm die
      # npm:-Pakete dort statt sie selbst zu laden.
      - run: deno check --node-modules-dir=auto supabase/functions/*/index.ts
