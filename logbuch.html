<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<!-- interactive-widget=resizes-content: die Bildschirmtastatur verkleinert auf Android den
     Layout-Viewport statt ihn nur zu überdecken - dadurch halten Browser und
     ensureNoteEditorVisible() Eingabefelder zuverlässig über der Tastatur (iOS ignoriert
     das Attribut, dort bleibt die visualViewport-Rechnung zuständig). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<title>Logbuch</title>
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<meta name="theme-color" content="#eae7df" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Logbuch" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --paper: #eae7df;
    --ink: #24261f;
    --line: #c7c1b2;
    --moss: #4b6b4f;
    --rust: #a2503a;
    --sand: #8c8371;
    --surface: #eae7df;
    --popover-bg: #f4f1e9;
    --input-bg: #ffffff;
    --shadow: rgba(0, 0, 0, 0.15);
    --scrim: rgba(0, 0, 0, 0.45);
    --rust-rgb: 162, 80, 58;
    --moss-rgb: 75, 107, 79;
    /* scoreColor() liefert theme-unabhängig immer dieselben Mittelton-Farben (siehe
       JS) – Text darauf braucht deshalb eine feste, helle Farbe statt --ink/--paper,
       die sich sonst im Dark Mode mitverdunkeln und unlesbar würden. */
    --on-score: #f5f3ee;
  }
  /* Dunkles Farbschema: folgt automatisch prefers-color-scheme, außer ein
     manueller Override (data-theme) sagt etwas anderes. Beide Regeln setzen
     exakt dieselben Werte, nur der Auslöser unterscheidet sich. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1e1c17;
      --ink: #ece7da;
      --line: #4a453a;
      --moss: #7fa583;
      --rust: #d3785d;
      --sand: #a89f8c;
      --surface: #29261f;
      --popover-bg: #343025;
      --input-bg: #2c2920;
      --rust-rgb: 211, 120, 93;
      --moss-rgb: 127, 165, 131;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1e1c17;
    --ink: #ece7da;
    --line: #4a453a;
    --moss: #7fa583;
    --rust: #d3785d;
    --sand: #a89f8c;
    --surface: #29261f;
    --popover-bg: #343025;
    --input-bg: #2c2920;
    --rust-rgb: 211, 120, 93;
    --moss-rgb: 127, 165, 131;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Für Screenreader vorhandener, aber visuell ausgeblendeter Text (z.B. die
     Graph-Zusammenfassung) — Standard-Clip-Technik statt display:none, damit der
     Inhalt weiterhin vorgelesen wird. */
  /* Safari auf iOS/iPadOS zoomt beim Antippen jedes Eingabefelds mit weniger als 16px
     Schrift automatisch heran - und danach nie wieder heraus. Deshalb dort alle
     Eingabefelder auf 16px (@supports -webkit-touch-callout trifft nur Apples WebKit auf
     Touch-Geräten, Android/Desktop behalten die kleinere Schrift). Bewusst NICHT über
     maximum-scale=1 im Viewport gelöst: das sperrt auf Android auch das Zoomen mit zwei
     Fingern, für Menschen mit Sehschwäche ein echter Rückschritt. !important, weil die
     einzelnen Felder ihre Schriftgröße über spezifischere Selektoren setzen. */
  @supports (-webkit-touch-callout: none) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea {
      font-size: 16px !important;
    }
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden; /* Sicherheitsnetz: nichts soll je die ganze Seite breiter machen */
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .header h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 22px; margin: 0; }
  .subpage-header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  /* line-height/padding großzügig, da "overflow: hidden" (für die "…"-Kürzung bei
     langen Titeln) sonst die Oberlängen der kursiven Fraunces-Schrift abschneidet
     (z.B. die Ü-Punkte bei "Über Logbuch"). */
  .subpage-header-title h1 { font-size: 19px; line-height: 1.5; padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; outline: none; }
  /* Trennlinie + etwas mehr Innenabstand unten, da hier (anders als bei den Tabs, die
     ihre eigene Trennlinie mitbringen) nichts anderes den unteren Rand der Fläche
     markiert. Die SVG-Chevron statt eines "←"-Zeichens zentriert sich unabhängig von
     Font-Metriken zuverlässig exakt. */
  .subpage-header { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px; }
  .back-btn {
    background: var(--ink); border: none; border-radius: 50%; width: 32px; height: 32px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--paper);
    cursor: pointer;
  }

  /* Header + Tab-Leiste bzw. Unterseiten-Header bleiben beim Scrollen oben fixiert
     (Menü/Zurück/Tab-Wechsel immer erreichbar) und bekommen dieselbe abgesetzte Fläche
     (eigene Hintergrundfarbe, full-bleed über die seitliche #app-Polsterung hinweg via
     negativer Margins) statt nur die Unterseiten - einheitlicher als "nur manche
     Ansichten sehen anders aus". Die Trennlinie am unteren Rand kommt je nach Kontext
     von .tabs oder .subpage-header selbst (siehe dort), .sticky-top braucht keine
     eigene - Kindelement-Margins kollabieren sonst nicht sauber nach außen. */
  .sticky-top {
    position: sticky; top: 0; z-index: 6; background: var(--surface);
    margin: -20px -18px 0; padding: 14px 18px 0;
  }

  .header-menu-wrap { position: relative; }
  .menu-btn {
    background: none; border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .menu-panel {
    position: absolute; top: 38px; right: 0; z-index: 10; width: 250px;
    max-height: calc(100vh - 54px); overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--popover-bg); border: 1px solid var(--ink); border-radius: 4px; padding: 14px;
    box-shadow: 0 12px 32px var(--shadow);
  }
  .menu-panel .push-row { margin-bottom: 0; }
  .menu-group { display: flex; flex-direction: column; gap: 9px; }
  .menu-group-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--sand); margin: 0;
  }
  .menu-group-divider { border-top: 1px solid var(--line); margin: 2px 0; }
  .menu-row { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sand); }
  .menu-row-note { font-size: 11px; color: var(--sand); margin: 0; }
  .menu-row select {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink);
  }
  .menu-item-btn {
    font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink); cursor: pointer; text-align: left;
  }
  .menu-item-btn:hover, .menu-item-btn:focus-visible { background: rgba(var(--moss-rgb), 0.14); border-color: var(--moss); }
  .menu-item-btn--danger { color: var(--rust); border-color: rgba(var(--rust-rgb), 0.4); }
  .menu-item-btn--danger:hover, .menu-item-btn--danger:focus-visible { background: rgba(var(--rust-rgb), 0.12); border-color: var(--rust); }
  /* Wie .manage-btn--warn: reversibel (z.B. Archivieren), daher dezenter als --danger. */
  .menu-item-btn--warn { color: var(--rust); border-color: rgba(var(--rust-rgb), 0.25); }
  .menu-item-btn--warn:hover, .menu-item-btn--warn:focus-visible { background: rgba(var(--rust-rgb), 0.08); border-color: rgba(var(--rust-rgb), 0.6); }

  .modal-overlay {
    position: fixed; inset: 0; background: var(--scrim); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px; max-width: 340px; width: 100%;
  }
  .modal-box h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 17px; margin: 0 0 10px; }
  .modal-box p { font-size: 13px; line-height: 1.45; margin: 0 0 14px; }

  .push-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink); background: rgba(var(--moss-rgb), 0.08); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; margin-bottom: 16px; }
  .push-row--muted { color: var(--sand); background: transparent; }
  .push-toggle { background: none; border: none; color: var(--moss); font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .push-toggle--prominent {
    background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600;
    padding: 7px 12px; border-radius: 3px;
  }

  .install-hint {
    display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.4; color: var(--ink);
    background: rgba(var(--rust-rgb), 0.08); border: 1px solid rgba(var(--rust-rgb), 0.3); border-radius: 3px;
    padding: 8px 10px; margin-bottom: 16px;
  }
  .install-hint span { flex: 1; }
  .install-hint-close {
    background: none; border: none; color: var(--sand); font-size: 16px; line-height: 1; cursor: pointer;
    padding: 0 2px; flex-shrink: 0;
  }

  .tabs {
    display: flex; gap: 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; padding: 6px 0 10px; font-family: inherit; font-size: 14px;
    color: var(--sand); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab--active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

  .day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .nav-btn {
    background: none; border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .day-label { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .day-weekday { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; }
  .day-date { font-size: 12px; color: var(--sand); }

  .today-jump {
    display: block; margin: 0 auto 14px; background: none; border: none; color: var(--moss);
    font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0;
  }

  .habit-list { display: flex; flex-direction: column; }
  .habit-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .habit-row:first-child { border-top: 1px solid var(--line); }
  .habit-name { font-size: 13px; line-height: 1.35; flex: 1; min-width: 0; }
  .habit-options {
    display: flex; gap: 6px; flex-shrink: 1; min-width: 0; max-width: 60%;
    overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .habit-options::-webkit-scrollbar { display: none; }
  /* Button-Zeilen in "Heute": Buttons neben dem Namen, solange Name (mind. 40 %) und
     Buttons nebeneinander passen - sonst rutschen die Buttons rechtsbündig in eine eigene
     Zeile darunter, statt teilweise unsichtbar seitlich zu scrollen (auf 360 px breiten
     Handys passten vorher nur 5 nummerierte Buttons neben den Namen). Seitlich gescrollt
     wird nur noch, was selbst in der vollen Breite nicht passt (lange Bezeichnungen). */
  .habit-row--buttons > .row-head { flex: 1 1 40%; }
  .habit-row--buttons > .habit-options { flex: 0 0 auto; max-width: 100%; margin-left: auto; }

  .opt-btn {
    font-family: inherit; font-size: 12px; width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .opt-btn--text {
    width: auto; min-width: 28px; height: 28px; border-radius: 14px; padding: 0 10px;
    white-space: nowrap;
  }
  .opt-btn--selected { color: var(--on-score); }

  /* "Noch offen" (siehe isOpenToday): Punkt hinter dem Namen, Form statt Farbe als
     Unterscheidung (Punkt da oder nicht). Moos wie die übrigen Akzente, nicht Rost -
     soll nicht nach Fehler/Warnung aussehen. */
  .open-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--moss);
    margin-left: 6px; vertical-align: middle;
  }
  .today-complete { margin: 14px 0 0; text-align: center; font-size: 13px; font-style: italic; color: var(--moss); }
  .today-new-field-btn {
    display: block; margin: 14px auto 0; background: none; border: none; color: var(--moss);
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 10px;
  }
  .today-new-field-btn:hover, .today-new-field-btn:focus-visible { text-decoration: underline; }
  .reset-btn {
    display: block; margin: 18px auto 0; background: none; border: none; color: var(--sand);
    font-family: inherit; font-size: 12px; cursor: pointer; text-decoration: underline;
  }

  .number-box {
    border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .number-box .number-last { display: block; font-size: 11px; color: var(--sand); margin-top: 2px; }
  .number-input {
    width: 72px; font-family: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink);
  }

  .habit-row--slider { flex-direction: column; align-items: stretch; gap: 6px; }
  .slider-row { display: flex; align-items: center; gap: 10px; width: 100%; }
  /* Feste statt min-width, sonst wird der Regler bei langen Bezeichnungen als Wert
     sichtbar schmaler (der Wertetext wächst, .value-slider hat flex:1 und muss dafür
     Platz abgeben) - fühlte sich beim Ziehen wie eine Verzerrung an. Lange Texte werden
     stattdessen abgeschnitten (…), der volle Text bleibt im Datenmodell erhalten. */
  .slider-value {
    font-size: 12px; color: var(--sand); width: 70px; text-align: right; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slider-clear {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--sand); font-size: 13px; line-height: 1; cursor: pointer;
  }
  /* Ohne Wert: unsichtbarer Platzhalter in exakt derselben Größe statt gar nichts - sonst
     würde der Regler beim ersten Eintragen um die Breite des × schmaler (gleicher Grund
     wie die feste Breite von .slider-value oben). */
  .slider-clear--placeholder { visibility: hidden; }

  /* Eigens gestylter Regler statt native OS-Optik (wirkte "klobig") — die farbige
     Füllung kommt über einen Gradient auf dem Track, gesteuert durch --slider-color/
     --slider-pct (siehe renderHabitSlider/input-Listener in logbuch.html). Bewusst
     NICHT über accent-color, das bei jedem Live-Update in manchen Browsern kurz
     glitchte, statt sauber mitzuziehen. */
  .value-slider {
    flex: 1; -webkit-appearance: none; appearance: none; background: transparent;
    height: 22px; cursor: pointer; --slider-color: var(--moss); --slider-pct: 50%;
  }
  .value-slider--unset { --slider-color: var(--sand); }
  .value-slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--slider-color) 0%, var(--slider-color) var(--slider-pct), var(--line) var(--slider-pct), var(--line) 100%);
  }
  .value-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .value-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--slider-color); }
  .value-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -6px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }
  .value-slider::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }

  .habit-row--computed .computed-readout {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; color: var(--on-score);
  }
  .habit-row--computed { flex-wrap: wrap; }
  .habit-row--computed .manage-meta { flex-basis: 100%; }

  /* Zeilen-Menü in "Heute" (siehe renderRowMenuButton). touch-callout/user-select
     verhindern, dass iOS/Android beim Long-Press auf die Zeile stattdessen Textauswahl
     oder ein eigenes Kontextmenü zeigen. */
  .habit-row, .number-box, .section-head { position: relative; -webkit-touch-callout: none; }
  .row-head, .section-head { -webkit-user-select: none; user-select: none; }
  /* Kopf einer Zeile: ⋮-Button + Name (bei Zahlenwert-Feldern darunter der letzte Wert).
     Der Button ragt etwas nach links in den Rand, damit die Namen nur wenig einrücken. */
  .row-head { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; margin-left: -8px; }
  .row-head-text { flex: 1; min-width: 0; }
  /* In untereinander gestapelten Zeilen (Schieberegler, Text) keine Höhe verteilen. */
  .habit-row--slider > .row-head, .text-box > .row-head { flex: none; }
  .row-menu-btn {
    flex-shrink: 0; width: 24px; height: 32px; display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0; background: none; border: none; border-radius: 3px; color: var(--sand); cursor: pointer;
  }
  .row-menu-btn svg { fill: currentColor; }
  .row-menu-btn:hover, .row-menu-btn[aria-expanded="true"] { color: var(--ink); }
  /* Der Name öffnet per Zeige-Gerät dasselbe Menü (Abkürzung, kein eigenes
     Bedienelement für Tastatur/Screenreader). Offen: dezent unterstrichen, damit
     sichtbar bleibt, zu welcher Zeile das Menü gehört. */
  .row-menu-name { cursor: pointer; }
  .row-menu-name--open { text-decoration: underline; text-decoration-color: var(--sand); text-underline-offset: 3px; }
  .row-menu {
    position: absolute; top: calc(100% - 4px); left: 0; z-index: 5; min-width: 170px;
    display: flex; flex-direction: column; gap: 6px; padding: 10px;
    background: var(--popover-bg); border: 1px solid var(--ink); border-radius: 4px;
    box-shadow: 0 12px 32px var(--shadow);
  }

  /* Notizen (siehe renderNote). flex-wrap + width: 100% lassen Notiz/Editor in eine
     eigene Zeile unter Name und Eingabe umbrechen - Name (flex-basis 0) und Buttons
     (max-width 60%) bzw. Zahlen-Eingabe passen weiterhin zusammen in die erste Zeile. */
  .habit-row, .number-box { flex-wrap: wrap; }
  .row-note {
    width: 100%; text-align: left; font: inherit; font-size: 12px; font-style: italic; line-height: 1.45;
    color: var(--ink); background: none; border: none; border-left: 2px solid var(--line);
    padding: 1px 0 1px 8px; margin: 0; cursor: pointer; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .row-note:hover, .row-note:focus-visible { border-left-color: var(--moss); }
  .note-editor { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .note-input {
    box-sizing: border-box; width: 100%; font-family: inherit; font-size: 14px; line-height: 1.45;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--input-bg); color: var(--ink); resize: vertical;
  }
  .note-editor-actions { display: flex; gap: 8px; }
  .note-save-btn {
    flex: 1; font-family: inherit; font-size: 13px; font-weight: 600; padding: 10px;
    border: none; border-radius: 3px; background: var(--moss); color: var(--paper); cursor: pointer;
  }
  .day-note { margin-top: 16px; }
  .day-note-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 14px; margin: 0 0 6px; }
  .day-note-add {
    display: block; width: 100%; box-sizing: border-box; text-align: left; font-family: inherit; font-size: 13px;
    color: var(--sand); padding: 10px 12px; background: none; border: 1px dashed var(--line); border-radius: 4px; cursor: pointer;
  }
  .day-note-add:hover, .day-note-add:focus-visible { border-color: var(--moss); color: var(--ink); }
  /* Punkt für "hier gibt es eine Notiz" in Woche (Feld-Zelle bzw. Wochentag = irgendeine
     Notiz an dem Tag) und Monat. Ink mit Papier-Ring, damit er auf jeder Zellfarbe inkl.
     Streifenmuster sichtbar bleibt. Im Monat unten statt oben, dort steht die Tageszahl. */
  .grid-cell.has-note, .month-cell.has-note, .grid-col-header.has-note { position: relative; }
  .has-note::after {
    content: ''; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 0 1.5px var(--paper);
  }
  .month-cell.has-note::after { top: auto; bottom: 3px; right: 3px; }

  .member-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .member-check { font-size: 13px; }
  .member-check--blocked { opacity: 0.45; }
  /* Berechnetes Zahlen-Feld: Wert ohne Bewertung - neutral statt eingefärbt. */
  .habit-row--computed .computed-readout--number { color: var(--ink); border: 1px solid var(--line); background: transparent; }

  .number-chart-box { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .number-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .number-chart-meta { font-size: 11px; color: var(--sand); flex-shrink: 0; white-space: nowrap; }
  .number-chart-svg { display: block; width: 100%; height: 56px; }
  .number-chart-plot { position: relative; }

  /* Wiederholung: eingeklappter Bereich "Heute nicht geplant" (renderToday), Zellen an
     nicht geplanten Tagen in der Woche (schraffiert statt leer, damit "nicht dran"
     nicht wie "vergessen" aussieht), Formular-Bausteine. */
  .unplanned { margin-top: 14px; }
  .unplanned > summary { font-size: 12px; color: var(--sand); cursor: pointer; padding: 6px 0; }
  .unplanned > .habit-list { margin-top: 6px; }
  /* Die Zellfarbe kommt inline als background-color (bewusst NICHT die Kurzschreibweise
     "background:", die setzte auch diese Schraffur wieder zurück). */
  .grid-cell--unplanned {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, var(--sand) 0, var(--sand) 1px, transparent 1px, transparent 5px);
  }
  /* Runde Buttons wie die Stufen-Buttons in "Heute", verteilt über höchstens 310px -
     bleibt auch auf schmalen Handys einzeilig (Abstände schrumpfen dann), ohne sich auf
     breiten Bildschirmen übertrieben weit zu verteilen. */
  .weekday-group { display: flex; justify-content: space-between; gap: 0; width: min(100%, 310px); margin-top: 6px; }
  .weekday-group .weekday-toggle {
    width: 34px; height: 34px; padding: 0; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .schedule-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .auth-field .schedule-inline select, .auth-field .schedule-inline input:not([type="checkbox"]) { width: auto; }
  .auth-field .schedule-inline input[type="number"] { width: 72px; }
  .schedule-inline label, .schedule-inline span { font-size: 13px; color: var(--ink); }
  /* Kurzes Aufleuchten des Feldes nach einem Sprung aus der Auswertung (focusTodayField). */
  /* Hervorhebung nach einem Sprung (Feld in "Heute", Eintrag im Menü): erst eine Weile
     voll sichtbar, dann ausblenden - sonst ging sie leicht unter. */
  @keyframes field-highlight {
    0%, 45% { background-color: rgba(var(--moss-rgb), 0.35); }
    100% { background-color: transparent; }
  }
  .field-highlight { animation: field-highlight 2.8s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .field-highlight { animation-duration: 0.01s; animation-delay: 2.4s; background-color: rgba(var(--moss-rgb), 0.35); }
  }

  /* Text-Felder (kind='text', siehe renderTextBox): Textfeld unter dem Namen statt
     daneben wie bei der Zahlen-Eingabe. field-sizing: content lässt es mit dem Text
     mitwachsen (wo unterstützt, sonst rows="2" + manuell vergrößerbar). */
  .text-box { flex-direction: column; align-items: stretch; gap: 8px; }
  .text-field-input {
    box-sizing: border-box; width: 100%; font-family: inherit; font-size: 14px; line-height: 1.45;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--input-bg); color: var(--ink); resize: vertical;
    field-sizing: content; min-height: 3.6em; max-height: 50vh;
  }
  /* Rückblick-Listen (siehe renderTextReviews) - gleiche Abstände wie die Zahlen-Graphen. */
  .text-review { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .text-review-title { font-size: 13px; font-weight: 400; line-height: 1.35; margin: 0; }
  summary.text-review-title { cursor: pointer; }
  .text-review-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .text-review-entry {
    display: flex; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink);
    background: none; border: none; border-radius: 3px; padding: 6px 4px; cursor: pointer;
  }
  .text-review-entry:hover, .text-review-entry:focus-visible { background: rgba(var(--moss-rgb), 0.10); }
  .text-review-date { flex-shrink: 0; width: 78px; font-size: 11px; color: var(--sand); padding-top: 2px; }
  .text-review-text { font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Ring um Datenpunkte mit Notiz (siehe renderNumberChart) - gleiche Idee wie der
     Notiz-Punkt in Woche/Monat. */
  .number-chart-note {
    position: absolute; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%);
    border: 1.5px solid var(--ink); box-sizing: border-box; pointer-events: none;
  }
  .number-chart-hit {
    position: absolute; top: 0; bottom: 0; cursor: pointer; border-radius: 2px;
  }
  .number-chart-hit:hover, .number-chart-hit:active { background: rgba(var(--moss-rgb), 0.14); }

  .grid-scroll { overflow-x: auto; }
  .grid-row { display: grid; grid-template-columns: minmax(58px, 80px) repeat(7, 1fr) minmax(30px, 38px); align-items: center; gap: 1px; }
  .grid-row--header { padding-bottom: 6px; }
  .grid-label { font-size: 10px; padding-right: 3px; line-height: 1.2; overflow-wrap: anywhere; }
  .grid-col-header { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: var(--sand); cursor: pointer; }
  .grid-col-date { font-size: 10px; color: var(--ink); }
  .grid-col-header--avg { font-family: 'Fraunces', serif; font-style: italic; color: var(--ink); cursor: default; }
  .grid-cell { height: 22px; margin: 1px; border-radius: 2px; border: 1px solid var(--line); cursor: pointer; }
  .grid-cell--blank { border-color: transparent; }
  .grid-cell--avg { display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--on-score); font-weight: 600; cursor: default; }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
  .month-weekday { font-size: 10px; color: var(--sand); text-align: center; padding-bottom: 4px; }
  .month-cell { aspect-ratio: 1; border-radius: 3px; border: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px; cursor: pointer; }
  .month-cell--empty { border: none; cursor: default; }
  /* mix-blend-mode:multiply setzt auf einen hellen Seitenhintergrund, damit die
     Zahl unabhängig vom farbcodierten Zell-Hintergrund lesbar bleibt – funktioniert
     im Dark Mode nicht mehr (verdunkelt statt abzuheben), dort auf reine Ink-Farbe
     ohne Blend-Mode zurückfallen. */
  .month-cell-num { font-size: 10px; color: var(--ink); mix-blend-mode: multiply; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .month-cell-num { mix-blend-mode: normal; }
  }
  :root[data-theme="dark"] .month-cell-num { mix-blend-mode: normal; }

  .month-stats { border-top: 1px solid var(--line); padding-top: 8px; }
  .month-stat-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .month-stat-value { font-weight: 600; }
  .month-stat-count { font-weight: 400; color: var(--sand); }

  .year-grid { display: flex; flex-direction: column; gap: 3px; margin-bottom: 20px; }
  .year-month { display: flex; align-items: center; gap: 6px; }
  .year-month-label { width: 24px; font-size: 9px; color: var(--sand); flex-shrink: 0; }
  .year-month-grid { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; flex: 1; }
  .year-day-cell { aspect-ratio: 1; border-radius: 1px; min-width: 0; cursor: pointer; }

  .notice {
    font-size: 12px; padding: 8px 10px; border-radius: 3px; margin-bottom: 14px;
    background: rgba(var(--rust-rgb), 0.12); color: var(--rust); border: 1px solid rgba(var(--rust-rgb), 0.3);
  }
  .notice--ok { background: rgba(var(--moss-rgb), 0.12); color: var(--moss); border-color: rgba(var(--moss-rgb), 0.3); }
  .loading { font-size: 13px; color: var(--sand); padding: 40px 0; text-align: center; }

  .auth-box { max-width: 320px; margin: 60px auto; }
  .auth-box h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 24px; margin: 0 0 4px; text-align: center; }
  .auth-box p.sub { font-size: 12px; color: var(--sand); text-align: center; margin: 0 0 24px; }
  .tutorial-text { font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
  /* Tutorial-Bausteine (siehe tutorialScreen): Punkte statt "Schritt X von Y", der
     aktuelle Punkt länger (Form statt nur Farbe); "Warum?"-Kasten als wiedererkennbares
     Element für Begründungen. */
  .onb-dots { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 0 0 20px; }
  .onb-dot { width: 8px; height: 8px; border-radius: 4px; border: 1.5px solid var(--sand); box-sizing: border-box; }
  .onb-dot--done { background: var(--sand); }
  .onb-dot--current { width: 22px; background: var(--moss); border-color: var(--moss); }
  .onb-icon { font-size: 40px; line-height: 1; text-align: center; margin: 0 0 10px; }
  .onb h1 { margin-bottom: 16px; outline: none; }
  .onb .tutorial-text strong { font-weight: 600; }
  .onb-center { text-align: center; }
  /* Kurze Hinweise im Tutorial: bewusst normale Schriftfarbe statt des blassen Sandtons
     der Formular-Hinweise - hier stehen Dinge, die man wirklich lesen soll. */
  .onb-hint { font-size: 12px; line-height: 1.45; color: var(--ink); margin: 0 0 10px; }
  .onb-hint--after { margin: 6px 0 0; }
  .why-box {
    margin: 0 0 18px; padding: 10px 12px; border-left: 3px solid var(--moss); border-radius: 4px;
    background: rgba(var(--moss-rgb), 0.09); font-size: 13px; line-height: 1.5;
  }
  .why-box p { margin: 0; }
  .why-box .why-box-title { font-weight: 600; margin-bottom: 2px; }
  .onb-more { margin: 0 0 16px; font-size: 13px; line-height: 1.5; }
  .onb-more summary { cursor: pointer; color: var(--moss); font-weight: 600; }
  .onb-more p { margin: 6px 0 0; }
  .onb .recovery-key-code { margin-top: 4px; }
  .onb .habit-form-actions { margin-bottom: 18px; }
  .onb-steps { margin: 0 0 18px; padding-left: 22px; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; }
  .onb-inline-icon { vertical-align: -4px; color: var(--ink); }
  .onb-promises { list-style: none; padding: 0; margin: 0 0 24px; display: flex; flex-direction: column; gap: 12px; }
  .onb-promises li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
  .onb-promise-icon { font-size: 18px; line-height: 1.3; flex-shrink: 0; }
  .onb-examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 18px; }
  .onb-chip {
    font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 16px; cursor: pointer;
    border: 1px solid var(--line); background: var(--input-bg); color: var(--ink);
  }
  .onb-chip:hover, .onb-chip:focus-visible { border-color: var(--moss); }
  .auth-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .auth-field label { font-size: 12px; color: var(--sand); }
  .auth-field input:not([type="checkbox"]), .auth-field select {
    font-family: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink); width: 100%;
  }
  .auth-field-label-row { display: flex; align-items: center; justify-content: space-between; }
  .input-clear-wrap { position: relative; }
  .input-clear-wrap input { padding-right: 30px; }
  .input-clear-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--sand); font-size: 17px; line-height: 1;
    cursor: pointer; padding: 6px;
  }
  .auth-submit {
    width: 100%; padding: 10px; margin-top: 8px; font-family: inherit; font-size: 14px; font-weight: 600;
    background: var(--ink); color: var(--paper); border: none; border-radius: 3px; cursor: pointer;
  }
  .auth-submit:disabled { background: var(--sand); cursor: default; }
  .auth-toggle { display: block; margin: 14px auto 0; background: none; border: none; color: var(--moss); font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; text-align: center; width: 100%; }

  .manage-list { display: flex; flex-direction: column; margin-bottom: 18px; }
  .manage-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .manage-row:first-child { border-top: 1px solid var(--line); }
  .manage-row--archived { opacity: 0.55; }
  .manage-row--confirm-delete { opacity: 1; flex-wrap: wrap; }
  .manage-row--dragging { position: relative; z-index: 5; background: var(--surface); box-shadow: 0 4px 10px var(--shadow); }
  .manage-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .manage-name { font-size: 13px; }
  .manage-meta { font-size: 11px; color: var(--sand); }
  .manage-delete-warning { font-size: 11px; color: var(--rust); }
  .manage-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .drag-handle {
    position: relative; display: flex; flex-direction: column; justify-content: center; gap: 3px; width: 16px; height: 22px;
    flex-shrink: 0; cursor: grab; touch-action: none;
  }
  /* Unsichtbar größere Tippfläche - der sichtbare Griff ist für einen Finger zu klein
     (verfehlt = gar nichts passiert, da er das Scrollen bewusst blockiert). Vor allem
     nach oben/unten und links in den Seitenrand; rechts nur knapp, damit sie nicht mit
     den ↑↓-Buttons daneben (eigene erweiterte Fläche, siehe .move-btn::after)
     überlappt. */
  .drag-handle::after { content: ''; position: absolute; top: -8px; bottom: -8px; left: -14px; right: -4px; }
  .drag-handle span { display: block; width: 12px; height: 2px; background: var(--sand); border-radius: 1px; }
  /* Tastatur-/Tipp-Alternative zum Drag-Handle (der rein per Pointer-Events
     funktioniert) — nebeneinander statt gestapelt, damit sie nicht die
     Zeilenhöhe treiben; mit spürbarem Abstand zueinander und einem unsichtbar
     über den sichtbaren Rand hinausragenden Treffer-Bereich (::after), damit
     auch ungenaues Antippen zuverlässig den richtigen der beiden Buttons
     trifft statt zu "verzugestopft" zu wirken. */
  .move-buttons { display: flex; flex-direction: row; gap: 5px; flex-shrink: 0; }
  .move-btn {
    position: relative; font-family: inherit; font-size: 11px; line-height: 1; width: 22px; height: 22px;
    border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer;
  }
  .move-btn::after { content: ''; position: absolute; inset: -4px; }
  .move-btn:disabled { opacity: 0.3; cursor: default; }
  .manage-btn {
    font-family: inherit; font-size: 11px; padding: 5px 9px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .manage-btn--danger { color: var(--rust); border-color: rgba(var(--rust-rgb), 0.4); }
  .manage-btn--warn { color: var(--rust); border-color: rgba(var(--rust-rgb), 0.25); background: rgba(var(--rust-rgb), 0.06); }
  .manage-new-btn {
    display: block; width: 100%; margin-top: 4px; padding: 11px; font-family: inherit; font-size: 14px; font-weight: 600;
    border: none; border-radius: 4px; background: var(--moss); color: var(--paper); cursor: pointer;
  }
  /* "+ Neues Feld" bleibt die primäre Aktion, "+ Neue Gruppe" daneben als zweite. */
  .manage-new-row { display: flex; gap: 8px; margin-top: 4px; }
  /* Gruppen (intern "sections", siehe layoutBlocks): Verwaltung - Kopfzeile + eingerückte Felder. */
  .manage-section { border-bottom: 1px solid var(--line); }
  .manage-section-head { border-bottom: none; }
  .manage-section-name { font-weight: 600; }
  .manage-section-children { margin: 0 0 8px 20px; }
  .manage-section-children .manage-row:last-child { border-bottom: none; }
  .manage-section-empty { margin: 4px 0 6px; }
  .manage-inline-check { font-size: 12px; margin-top: 4px; }
  .manage-section--drag-collapsed .manage-section-children { display: none; }
  /* Einklappbare Gruppen-Überschrift ("Heute" und Auswertung). */
  .section-toggle {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; cursor: pointer;
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 15px; color: var(--ink);
    background: none; border: none; border-bottom: 1px solid var(--line); padding: 12px 0 6px;
  }
  .section-chevron { flex-shrink: 0; color: var(--sand); transition: transform 0.15s ease; }
  .section-toggle[aria-expanded="true"] .section-chevron { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .section-chevron { transition: none; } }
  .section-block--stats > .section-toggle { font-size: 13px; padding-top: 10px; }
  /* "Heute": ⋮-Button links neben der Überschrift, die Linie trägt dann der Kopf. */
  .section-head { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-top: 6px; }
  .section-head > .row-menu-btn { margin-left: -8px; }
  /* Notiz zur Gruppe (bzw. ihr Editor) direkt unter der Überschrift, auf Höhe des Pfeils. */
  .section-block > .row-note, .section-block > .note-editor { margin: 8px 0 6px 16px; width: calc(100% - 16px); }
  .section-head .section-toggle { flex: 1; min-width: 0; border-bottom: none; padding: 6px 0; }
  /* Inhalt einer aufgeklappten Gruppe eingerückt (wie in der Verwaltung), damit sichtbar
     ist, was dazugehört - bewusst ohne senkrechte Linie links, die wirkte überladen. Im
     Wochen-Raster nur der Feldname: eine eingerückte ganze Zeile würde die Tageskästchen
     gegen die Wochentag-Köpfe verschieben. */
  .section-content { padding-left: 19px; }
  .grid-scroll .section-content { padding-left: 0; }
  /* Die Gruppen-Überschrift hat schon eine Linie unten - sonst doppelt mit der oberen Linie der ersten Zeile. */
  .section-content > .habit-row:first-child { border-top: none; }
  .grid-scroll .section-content .grid-label { padding-left: 17px; }
  .manage-new-row .manage-new-btn { flex: 1; }
  .manage-new-btn--secondary { background: transparent; color: var(--moss); border: 1px solid var(--moss); }
  .manage-tag {
    display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--sand);
  }
  .feedback-form textarea {
    font-family: inherit; font-size: 14px; line-height: 1.5; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink); width: 100%; min-height: 180px; resize: vertical;
  }
  .feedback-intro { margin-bottom: 14px; }
  .feedback-form .habit-form-lock-note { margin: 0 0 14px; }
  .link-btn {
    font-family: inherit; font-size: inherit; padding: 0; border: none; background: none; color: var(--moss);
    text-decoration: underline; cursor: pointer; font-style: normal; font-weight: 600;
  }
  .tip-link { font-size: 12px; margin-top: 4px; }
  .manage-section-divider { border-top: 1px solid var(--line); margin: 22px 0 14px; }
  .manage-section-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 15px; margin: 0 0 4px; }
  .about-status { font-size: 13px; line-height: 1.5; color: var(--ink); font-weight: 600; margin: 0 0 10px; }
  .about-status--secondary { font-weight: 400; color: var(--sand); margin: 0 0 10px; }
  .about-intro { font-size: 13px; line-height: 1.5; color: var(--sand); margin: 0 0 22px; }
  .tip-group summary.manage-section-title { cursor: pointer; margin-bottom: 0; }
  .tip-group[open] summary.manage-section-title { margin-bottom: 12px; }
  .tip { margin-bottom: 16px; }
  .tip:last-child { margin-bottom: 0; }
  .tip-title { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .tip-body { font-size: 13px; line-height: 1.5; color: var(--sand); margin: 0; }
  .a11y-highlight {
    background: rgba(var(--moss-rgb), 0.08); border: 1px solid rgba(var(--moss-rgb), 0.3);
    border-radius: 6px; padding: 16px;
  }
  .a11y-highlight summary.manage-section-title,
  .mental-health-highlight summary.manage-section-title { cursor: pointer; }
  .a11y-highlight[open] summary.manage-section-title,
  .mental-health-highlight[open] summary.manage-section-title { margin-bottom: 8px; }
  .a11y-highlight .manage-section-title { margin-bottom: 8px; }
  .a11y-highlight > .tip-body { margin-bottom: 14px; }
  .a11y-highlight .tip:last-child { margin-bottom: 0; }
  .a11y-feedback { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(var(--moss-rgb), 0.3); font-style: italic; }

const JWT_FUTURE_RETRY_DELAYS_MS = [1000, 2000];
async function fetchWithJwtFutureRetry(input, init) {
  let res = await fetch(input, init);
  const isRest = String(input instanceof Request ? input.url : input).includes('/rest/v1/');
  for (const delay of isRest ? JWT_FUTURE_RETRY_DELAYS_MS : []) {
    if (res.status !== 401) break;
    const body = await res.clone().json().catch(() => null);
    if (body?.code !== 'PGRST303') break;
    await new Promise((resolve) => setTimeout(resolve, delay));
    res = await fetch(input, init);

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));

// Zweistufiger Schlüssel: ein zufälliger DEK (Data Encryption Key) verschlüsselt die
// eigentlichen Werte in habit_entries.data. Der DEK selbst wird zweifach "verpackt"
// (wrapped) serverseitig abgelegt — einmal mit einem aus dem Passwort abgeleiteten KEK
// (Key Encryption Key), einmal mit einem zufälligen Recovery-Key, den nur der Nutzer
// kennt (einmalig angezeigt, siehe renderRecoveryKeyDisplay). Der DEK selbst ändert
// sich dadurch nie — ein Passwort-Reset mit Recovery-Key "vererbt" ihn einfach ins neu
// verpackte Feld weiter, ohne dass irgendwelche Bestandsdaten neu verschlüsselt werden
// müssten. Alles über die native Web Crypto API, keine externe Library nötig.

function bufToBase64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function base64ToBuf(b64) {
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
}
function bufToHex(buf) {
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function hexToBuf(hex) {
  const clean = hex.replace(/[^0-9a-fA-F]/g, '');
  const bytes = new Uint8Array(clean.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(clean.substr(i * 2, 2), 16);
  return bytes.buffer;
}
// Recovery-Key fürs Anzeigen in Fünferblöcken gruppieren, z.B. "a1b2c-d3e4f-...".
function formatRecoveryKey(hex) {
  return hex.match(/.{1,5}/g).join('-');
}

const PBKDF2_ITERATIONS = 250000;

async function deriveKek(password, saltBuf, iterations) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBuf, iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['wrapKey', 'unwrapKey']
  );
}

async function generateDek() {
  return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}

function generateRecoveryKeyBytes() {
  return crypto.getRandomValues(new Uint8Array(32));
}

async function importRecoveryKeyAsCryptoKey(bytesBuf) {
  return crypto.subtle.importKey('raw', bytesBuf, 'AES-GCM', false, ['wrapKey', 'unwrapKey']);

  const iv = crypto.getRandomValues(new Uint8Array(12));
  const wrapped = await crypto.subtle.wrapKey('raw', dek, wrappingKey, { name: 'AES-GCM', iv });
  return { iv: bufToBase64(iv), wrapped: bufToBase64(wrapped) };

async function unwrapDek(wrappedB64, ivB64, wrappingKey) {

    'raw',
    base64ToBuf(wrappedB64),
    wrappingKey,
    { name: 'AES-GCM', iv: new Uint8Array(base64ToBuf(ivB64)) },
    { name: 'AES-GCM', length: 256 },
    true,
    ['encrypt', 'decrypt']
  );

// Klartext vor dem Verschlüsseln mit Leerzeichen auf ein Vielfaches von 256 Byte
// auffüllen: die Länge des Chiffretexts verriet sonst grob, wie viel jemand an einem Tag
// eingetragen/geschrieben hat (z.B. lange Notizen). JSON.parse ignoriert Leerzeichen am
// Ende, decryptData braucht deshalb keine Änderung und liest alte, ungepolsterte Daten
// genauso.
const ENCRYPT_PAD_BLOCK = 256;
async function encryptData(dek, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const padded = new Uint8Array(Math.ceil((bytes.length + 1) / ENCRYPT_PAD_BLOCK) * ENCRYPT_PAD_BLOCK).fill(0x20);
  padded.set(bytes);
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dek, padded);
  return { iv: bufToBase64(iv), ciphertext: bufToBase64(ciphertext) };

async function decryptData(dek, enc) {
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(base64ToBuf(enc.iv)) }, dek, base64ToBuf(enc.ciphertext));

// (user_encryption.dek_id), damit sich ein veralteter Cache erkennen lässt (siehe
// usableCachedDek). Einträge von vor dieser Kennung sind ein reiner base64-String.
function openKeyDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('logbuch-keys', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('deks');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  const raw = await crypto.subtle.exportKey('raw', dek);

  await new Promise((resolve, reject) => {
    const tx = db.transaction('deks', 'readwrite');
    tx.objectStore('deks').put({ key: bufToBase64(raw), dekId }, userId);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);

  const db = await openKeyDb();
  const stored = await new Promise((resolve, reject) => {
    const tx = db.transaction('deks', 'readonly');
    const req = tx.objectStore('deks').get(userId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);

  const dek = await crypto.subtle.importKey('raw', base64ToBuf(legacy ? stored : stored.key), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);

  try {
    const db = await openKeyDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('deks', 'readwrite');
      tx.objectStore('deks').delete(userId);

// --- Habit-Definitionen ----------------------------------------------------

function habitFromParts(row, payload) {
  return {
    id: payload.key,
    defId: row.id,
    name: payload.name,
    kind: row.kind,          // 'scale' | 'number' | 'computed' | 'text'

    aggregate: payload.aggregate ?? null, // nur bei berechneten Feldern aus Zahlen: 'sum'|'avg'|'min'|'max' (null = aus Skalen)
    hideInStats: !!payload.hideInStats,   // in Woche/Monat/Jahr/Gesamt ausgeblendet (nur Anzeige, siehe inStats)
    archivedInStats: !!payload.archivedInStats, // archiviert, aber trotzdem in der Auswertung (siehe inStats)

// Noch nicht umgestellte Zeile (Klartext-Spalten) -> dieselbe payload-Form.
function defPayloadFromPlainRow(row) {
  return {
    key: row.slug,
    name: row.name,
    unit: row.unit ?? null,
    min: row.min ?? null,
    max: row.max ?? null,
    labels: row.labels ?? null,
    good: row.good ?? null,

const DEF_PLAINTEXT_CLEARED = {
  slug: null, name: null, min: null, max: null, labels: null, good: null, unit: null,
  goal_threshold: null, group_members: null, display_style: 'buttons', slider_show_value: true,
};

  const existing = new Set(state.habits.map((h) => h.id));
  let key;

    key = 'f' + Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => (b % 36).toString(36)).join('');

async function migrateHabitDefinitions(rows) {
  for (const row of rows) {
    try {
      const payload = defPayloadFromPlainRow(row);
      const enc = await encryptData(currentDek, payload);
      const check = await decryptData(currentDek, enc);
      if (JSON.stringify(check) !== JSON.stringify(payload)) {
        console.error('[Logbuch] Kontroll-Entschlüsselung weicht ab, Feld bleibt vorerst unverschlüsselt', row.id);
        continue;

      const { error } = await supabase.from('habit_definitions')
        .update({ enc, ...DEF_PLAINTEXT_CLEARED })
        .eq('id', row.id)
        .is('enc', null);
      if (error) console.error('[Logbuch] Feld-Umstellung fehlgeschlagen, nächster Versuch beim nächsten Laden', row.id, error.message);
    } catch (err) {
      console.error('[Logbuch] Feld-Umstellung fehlgeschlagen', row.id, err);
    }

// verwechseln mit berechneten Feldern (kind='computed'), die bis 2026-09-27 "Gruppen"
// hießen. Oberste Ebene: Felder ohne Gruppe und Gruppen gemeinsam nach sort_order (frei

  const sectionIds = new Set(state.sections.map((sec) => sec.id));

      <svg class="section-chevron" width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

// Rendert Felder nach Gruppen geordnet, in der Reihenfolge der Verwaltung:

// mit einklappbarer Überschrift. renderList bekommt jeweils ein Array von Feldern.
function renderBySection(habits, scope, renderList) {
  const out = [];
  let run = [];
  const flush = () => { if (run.length) { out.push(renderList(run)); run = []; } };
  for (const block of layoutBlocks(habits)) {
    if (block.type === 'habit') { run.push(block.habit); continue; }
    if (!block.habits.length) continue;

// Ob ein Feld in den Auswertungs-Ansichten (Woche/Monat/Jahr/Gesamt) auftaucht - pro Feld

// Vorgeschichte eines abgelösten Felds zu sehen (Skala ändern = archivieren + neu anlegen).

// day:1..31|-1 (letzter Tag)}, {type:'yearly', month:1..12, day}, {type:'interval',
// every, unit:'day'|'week', start:'YYYY-MM-DD'}. Gegenstück zur SQL-Funktion
// public.habit_scheduled_on (Erinnerungen) - beide müssen dieselben Regeln umsetzen:
// ein Tag, den es im Monat nicht gibt (31.4., 29.2. außerhalb von Schaltjahren), fällt
// auf den Monatsletzten; unbekannte Pläne gelten als "dran".

    case 'yearly': return month + 1 === schedule.month && day === Math.min(schedule.day, lastDayOfMonth(year, month));
    case 'interval': {

      const diff = Math.round((startOfDay(date) - parseDateKey(schedule.start)) / 86400000);

// --- Datum-Helfer ----------------------------------------------------------
function formatKey(date) {
  const y = date.getFullYear();

  const d = String(date.getDate()).padStart(2, '0');

}
function startOfDay(date) { const d = new Date(date); d.setHours(0, 0, 0, 0); return d; }

// interpretiert und je nach Zeitzone einen Tag daneben liegen kann).
function parseDateKey(key) {

}

// --- Erinnerungszeit-Helfer (Minuten seit Mitternacht <-> "HH:MM") ---------
// Erinnerungszeiten werden seit dem Onboarding-Tutorial in 15-Minuten-Schritten
// statt nur zur vollen Stunde gespeichert (siehe CLAUDE.md), als Minuten seit
// Mitternacht (0-1439) statt Stunde (0-23).
function minutesToTimeStr(min) {

}

// Bewusst ein <select> mit ausschließlich gültigen 15-Minuten-Werten statt eines
// nativen <input type="time" step="900">: das step-Attribut wird von vielen Browsern/
// Betriebssystemen (v.a. mobil) schlicht ignoriert, sodass sich trotzdem jede beliebige
// Minute auswählen ließ, obwohl das System ohnehin nur im 15-Minuten-Raster zustellen
// kann (unnötige Verwirrung: man konnte etwas einstellen, das stillschweigend gerundet
// wurde). Ein <select> kann von vornherein gar nichts anderes anbieten.
function reminderTimeInputHtml(id, minutes, dataAction, disabled, describedBy) {
  const options = Array.from({ length: (24 * 60) / REMINDER_TIME_STEP }, (_, i) => i * REMINDER_TIME_STEP)

// 0 = schlechtester, 1 = bester Wert
function normalize(habit, value) {
  if (value === undefined || value === null) return null;
  const raw = (value - habit.min) / (habit.max - habit.min);
  return habit.good === 'low' ? 1 - raw : raw;
}

// Normalisierter Score (0-1) eines Feldes an einem bestimmten Tag. Bei normalen
// Skala-Feldern der direkt eingetragene Wert; bei berechneten Feldern (kind='computed')
// der Durchschnitt der normalisierten Werte seiner Mitglieder an dem Tag (null, wenn
// an dem Tag kein Mitglied befüllt ist — ein berechnetes Feld hält nie einen eigenen Eintrag,
// ihr Slug taucht nie als Key in state.entries auf). Ändert man die Mitgliederliste
// eines berechneten Felds, wirkt sich das rückwirkend auf die gesamte Historie aus, da hier bei
// jedem Aufruf live neu gerechnet wird — beabsichtigt, siehe CLAUDE.md.
function habitScore(h, dateKey) {
  const day = state.entries[dateKey];
  if (!day) return null;
  if (isNumberComputed(h)) return null; // keine Bewertung, siehe isNumberComputed
  if (h.kind === 'computed') {
    const memberScores = (h.members || [])
      .map((slug) => state.habits.find((x) => x.id === slug))
      .filter((m) => m && !isNeutralScale(m)) // unbewertete Mitglieder haben kein Gut/Schlecht zum Mitteln
      .map((m) => normalize(m, day[m.id]))
      .filter((s) => s !== null);
    if (!memberScores.length) return null;
    return memberScores.reduce((a, b) => a + b, 0) / memberScores.length;
  }
  return normalize(h, day[h.id]);

// Ob ein Feld irgendwo in den übergebenen Datums-Keys einen (ggf. errechneten) Score
// hat — für archivierte Felder in Auswertungs-Ansichten: normale Felder prüfen direkt
// state.entries, berechnete Felder (die nie selbst einen Entry-Key haben) über habitScore.
function habitVisibleInRange(h, dateKeys) {
  if (isNumberComputed(h)) return dateKeys.some((k) => numberComputedDay(h, k).value !== null);
  if (h.kind === 'computed') return dateKeys.some((k) => habitScore(h, k) !== null);
  return dateKeys.some((k) => state.entries[k]?.[h.id] !== undefined);

function scoreColor(score) {
  if (score === null || score === undefined) return 'transparent';
  const rust = [162, 80, 58], sand = [150, 142, 124], moss = [75, 107, 79];
  let c;
  if (score < 0.5) { const t = score / 0.5; c = rust.map((v, i) => Math.round(v + (sand[i] - v) * t)); }
  else { const t = (score - 0.5) / 0.5; c = sand.map((v, i) => Math.round(v + (moss[i] - v) * t)); }
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}

// war auf den hellen Stufen kaum lesbar (Sandton in der Mitte der Skala ~3:1). Bewusst
// reines Weiß/Schwarz statt der warmen App-Töne: die Mittelstufen liegen genau im
// ungünstigsten Helligkeitsbereich, nur damit erreicht jede Stufe mind. 4,5:1

  const channel = (c) => { const s = c / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; };

  return contrast(lum, 1) >= contrast(lum, 0) ? ON_SCORE_LIGHT : ON_SCORE_DARK;

// Verlauf visuelles Rauschen, diskrete Stufen sind als "Sprosse auf einer Leiter"

  const opacity = coarse ? [0.15, 0.25, 0.35] : [0, 0.12, 0.2, 0.28, 0.35];
  const buckets = spacing.length;

// Beschreibung für Kalenderzellen (Woche/Monat/Jahr), die nur per Hintergrundfarbe

// habitName optional: Wochen-Grid-Zellen gehören zu einem konkreten Feld, Monats-/

function dayCellAriaLabel(date, score, habitName) {

    ? t('ariaLabel.dayCellForHabit', { name: habitName, date: formatDMY(date), score: scoreText })

// "Heute"-Ansicht verwendet (siehe renderHabitOptions). Bei Standard-Ziel (1) exakter

function applyGoal(habit, score) {
  if (score === null || score === undefined) return null;
  const threshold = habit.goalThreshold ?? 1;

  return Math.min(1, score / threshold);

  const scores = state.habits.filter((h) => h.kind === 'scale' && !isNeutralScale(h))
    .map((h) => applyGoal(h, habitScore(h, dateKey)))
    .filter((s) => s !== null);
  if (!scores.length) return null;
  return scores.reduce((a, b) => a + b, 0) / scores.length;

// Durchschnitt + Anzahl je Skala-/berechnetem Feld über eine Menge von Datums-Keys
// ('YYYY-MM-DD').
function computeHabitStats(habits, dateKeys) {
  return habits.map((h) => {
    let sum = 0, count = 0;
    for (const k of dateKeys) {
      const s = habitScore(h, k);
      if (s !== null) { sum += s; count++; }
    }
    return { habit: h, avg: count ? sum / count : null, count };
  });
}

// Werte-Reihe + Kennzahlen eines Zahlenwert-Felds bzw. berechneten Zahlen-Felds über eine
// Menge von Datums-Keys.
function numberFieldStats(habit, dateKeys) {
  const series = dateKeys
    .map((k) => ({ key: k, value: habitNumericValue(habit, k) }))
    .filter((p) => p.value !== undefined && p.value !== null);
  if (!series.length) return null;
  const values = series.map((p) => p.value);
  return {
    series,
    count: series.length,
    min: Math.min(...values),
    max: Math.max(...values),
    avg: values.reduce((a, b) => a + b, 0) / values.length,
    last: series[series.length - 1].value,
  };
}

// Merkt sich einen CSS-Selektor für das Element, das ein Modal (Konto löschen/
// Tutorial überspringen) geöffnet hat, damit der Fokus beim Schließen
// (Abbrechen/Escape) dorthin zurückspringt. Bewusst ein Selektor statt einer
// direkten Element-Referenz: render() ersetzt bei jedem Aufruf das komplette
// innerHTML, jede zuvor gemerkte Node wäre beim Schließen längst verwaist —
// der Selektor wird erst beim tatsächlichen Zurückspringen neu aufgelöst.
let modalTriggerSelector = null;
function restoreModalFocus() {
  if (!modalTriggerSelector) return;
  document.querySelector(modalTriggerSelector)?.focus();
  modalTriggerSelector = null;
}
// Gemeinsamer Schließ-Weg aller Bestätigungs-Modals (Abbrechen-Button, Escape,
// Android-Zurück) - rendert NICHT selbst, der Aufrufer muss danach render() und
// restoreModalFocus() aufrufen (closeTopLayer läuft z.B. vor einem eigenen render()).
function closeModals() {
  state.deleteConfirm = null;
  state.tutorialSkipConfirm = false;
  state.resetConfirm = null;
}

// --- Android-Zurück-Taste schließt offene Overlays/Unterseiten statt die App zu
// verlassen -------------------------------------------------------------------
// Ohne eigene History-Einträge hat die native/Gesten-Zurück-Taste nichts, wohin sie
// "zurückgehen" könnte, und beendet stattdessen sofort die App (bzw. den Tab) -
// unabhängig davon, was gerade offen ist. Bewusst nur für Overlays (Menü,
// Feld-Formular, Lösch-Bestätigungen) und Unterseiten (Verwalten/Über Logbuch), NICHT
// für reine Tab-Wechsel (Heute/Woche/...) - das entspricht dem üblichen Verhalten von
// Android-Apps mit Tab-Leiste. state.recoveryKeyToShow bleibt bewusst ausgenommen: das
// ist schon jetzt absichtlich nur über die Bestätigungs-Checkbox schließbar (auch
// Escape greift dort nicht), das soll die Zurück-Taste nicht aushebeln.
//
// Overlay und Unterseite können gleichzeitig offen sein (z.B. "Neues Feld" innerhalb
// von "Verwalten") - deshalb ein Layer-Zähler statt einer reinen Boolean-Prüfung, mit
// je einem History-Eintrag pro Layer, damit zwei Zurück-Drücke auch zwei Ebenen
// nacheinander schließen.
function isSubpageView(view) { return view === 'manage' || view === 'about' || view === 'feedback'; }
// Merkt sich den Tab, von dem aus eine Unterseite betreten wurde (nicht überschreiben,
// wenn man z.B. innerhalb von "Verwalten" übers Menü direkt zu "Über Logbuch"
// wechselt - sonst würde "Zurück" dann fälschlich zu "Verwalten" statt zum
// ursprünglichen Tab führen).
function enterSubpage(view) {
  if (!isSubpageView(state.view)) state.previousTabView = state.view;
  if (view === 'about') openAboutSections = new Set(); // bei jedem Öffnen alles zugeklappt
  if (view !== 'manage') closeManageOverlays();
  state.view = view;
  state.menuOpen = false;
}
// Feld-Formular und Feld-Lösch-Bestätigung gehören zur Verwaltungsseite - wer sie
// verlässt (←-Button, Wischen, Menü-Wechsel zu einer anderen Unterseite), schließt
// sie mit. Sonst blieben sie unsichtbar im State offen und zählten weiter als
// History-Ebene (ein wirkungsloser Android-Zurück-Druck auf der nächsten Seite).
function closeManageOverlays() {
  state.habitForm = null;
  habitFormReturnScrollY = null;
  state.habitDeleteConfirm = null;
  state.sectionForm = null;
  state.sectionDeleteConfirm = null;
}
function leaveSubpage() {
  closeManageOverlays();
  state.view = state.previousTabView || 'today';
}
function isOverlayOpen() {
  return state.menuOpen || !!state.rowMenu || isNoteEditorOpen() || !!state.sectionForm || !!state.resetConfirm || !!state.deleteConfirm || state.tutorialSkipConfirm || !!state.habitForm || !!state.habitDeleteConfirm;
}
// Der Notiz-Editor gehört zu einem bestimmten Tag in "Heute" und ist nur offen, solange
// er dort auch sichtbar ist - wechselt man Tag/Tab, speichert render() den Entwurf und
// schließt ihn (siehe commitPendingNoteDraft).
// Zusätzlich muss das Feld selbst noch in "Heute" stehen - wird es z.B. über das
// Zeilen-Menü archiviert, während seine Notiz offen ist, wäre der Editor sonst
// unsichtbar, zählte aber weiter als offene Ebene.
function isNoteEditorOpen() {
  const ed = state.noteEditor;
  if (!ed || state.view !== 'today' || ed.dateKey !== formatKey(state.currentDate)) return false;
  if (ed.key === DAY_NOTE_KEY) return true;
  if (ed.key.startsWith(SECTION_NOTE_PREFIX)) return sectionShownToday(ed.key.slice(SECTION_NOTE_PREFIX.length));
  return activeHabits().some((h) => h.id === ed.key && !isTextKind(h));
}
function currentLayerCount() {
  return (isSubpageView(state.view) ? 1 : 0) + (isOverlayOpen() ? 1 : 0);
}
// Das Feld-Formular ist eine eigene Ebene innerhalb der Verwaltung: solange es offen
// ist, zeigt die Verwaltung NUR das Formular (kein Weiterscrollen zu den anderen
// Feldern, Titel im Seitenkopf, siehe renderManage/renderApp). Geöffnet wird es immer
// über openHabitForm, das sich die Scroll-Position merkt - closeHabitForm (einziger
// Schließ-Weg: Speichern, Abbrechen, ←-Button, Wischen, Android-Zurück) bringt einen
// genau dorthin zurück (per pendingScrollRestore, eingelöst am Ende von render()).
// Wurde es über einen Shortcut aus "Heute" geöffnet (returnToTab, lebt bewusst im
// Formular-Zustand und verschwindet so automatisch mit ihm), geht es danach direkt
// zurück zum Tab statt in der Verwaltung zu bleiben - die Absicht war dort "jetzt
// tracken", nicht "verwalten".
let habitFormReturnScrollY = null;
let pendingScrollRestore = null;
function openHabitForm(form) {
  habitFormReturnScrollY = window.scrollY;
  state.habitForm = form;
  render();
  window.scrollTo(0, 0);
  // Nur beim Neuanlegen direkt den Namen fokussieren (öffnet auf dem Handy gleich die
  // Tastatur, funktioniert nur zuverlässig synchron aus einem Klick-Handler) - ohne
  // Namen geht es dort nicht weiter. Beim Bearbeiten will man meist etwas anderes
  // ändern; dort bleibt der Fokus auf der Seitenüberschrift (siehe renderApp).
  if (!form.defId) requestAnimationFrame(() => document.getElementById('habit-form-name')?.focus());
}
function closeHabitForm() {
  const returnToTab = state.habitForm?.returnToTab;
  state.habitForm = null;
  if (returnToTab && state.view === 'manage') state.view = state.previousTabView || 'today';
  pendingScrollRestore = habitFormReturnScrollY;
  habitFormReturnScrollY = null;
}
// ←-Button und Wischen auf einer Unterseite: bei offenem Feld-Formular zurück zur
// Liste (bzw. zum Tab, siehe returnToTab), sonst die Unterseite verlassen.
function subpageBack() {
  if (state.view === 'manage' && state.habitForm) closeHabitForm();
  else if (state.view === 'manage' && state.sectionForm) closeSectionForm();
  else leaveSubpage();
}
// Schließt jeweils nur die "oberste" Ebene (analog zur bestehenden Escape-Logik) -
// Overlays vor der Unterseite, da sie darüber liegen. In der Praxis nie mehrere
// Overlays gleichzeitig offen, da z.B. die Menü-Aktionen state.menuOpen beim Öffnen
// eines anderen Overlays bereits selbst auf false setzen.
function closeTopLayer() {
  if (state.deleteConfirm || state.tutorialSkipConfirm || state.resetConfirm) {
    closeModals();
    restoreModalFocus();
  } else if (state.menuOpen) {
    state.menuOpen = false;
  } else if (state.rowMenu) {
    state.rowMenu = null;
  } else if (isNoteEditorOpen()) {
    discardNoteDraft(); // wie "Abbrechen"
  } else if (state.sectionForm) {
    closeSectionForm();
  } else if (state.habitForm) {
    closeHabitForm();
  } else if (state.habitDeleteConfirm) {
    state.habitDeleteConfirm = null;
  } else if (isSubpageView(state.view)) {
    leaveSubpage();
  }
}
let openLayerCount = 0;
// true zwischen einem SELBST ausgelösten history.go() (siehe syncLayerHistory) und
// dem dadurch erst asynchron ausgelösten popstate - unterscheidet "wir korrigieren nur
// die History-Position, der State stimmt schon" von einem echten Zurück-Druck. Ohne das
// hätte z.B. ein direkter Wechsel zwischen zwei Unterseiten übers Menü (schließt dabei
// nebenbei das Menü-Overlay, die Layer-Zahl sinkt also auch ohne echten Zurück-Druck)
// fälschlich die Unterseite selbst mit geschlossen, weil das eigene Korrektur-go()
// ebenfalls ein popstate auslöst.
let closingLayerViaPopstate = false;
window.addEventListener('popstate', () => {
  if (closingLayerViaPopstate) { closingLayerViaPopstate = false; return; }
  if (currentLayerCount() === 0) return; // nichts (mehr) zu schließen - Browser navigiert normal weiter
  openLayerCount = Math.max(0, openLayerCount - 1); // History-Position ist durch den Pop bereits korrekt
  closeTopLayer();
  // Schließt closeTopLayer dabei mehr als eine Ebene (z.B. Feld-Formular aus dem
  // "Heute"-Shortcut: Formular UND Verwaltung), räumt syncLayerHistory in render() den
  // übrigen History-Eintrag selbst weg.
  render();
});
// Von render() aufgerufen: hält die History mit der Layer-Anzahl synchron, damit pro
// geöffneter Ebene genau ein Zurück-Druck sie wieder schließt - auch wenn sie
// stattdessen ganz normal über die App (Abbrechen-Button, ←-Button o.ä.) geschlossen
// wird (sonst blieben "tote" History-Einträge stehen, die zusätzliche, wirkungslose
// Zurück-Drücke vor dem eigentlichen Verlassen der App erfordert hätten).
function syncLayerHistory() {
  if (closingLayerViaPopstate) return;
  const n = currentLayerCount();
  if (n > openLayerCount) {
    // Ein Eintrag PRO neuer Ebene - öffnen sich zwei auf einmal (z.B. "+ Neues Feld" in
    // "Heute": Verwaltung + Formular), muss es auch zwei geben, sonst ginge das
    // go(-2) beim gemeinsamen Schließen unten einen Schritt zu weit (App verlassen).
    for (let i = openLayerCount; i < n; i++) history.pushState({ logbuchLayer: true }, '');
    openLayerCount = n;
  } else if (n < openLayerCount) {
    // go(-Differenz) statt back(): schließt eine Aktion zwei Ebenen auf einmal (z.B.
    // Deep-Link aus einer Benachrichtigung, oder Speichern im "Heute"-Shortcut-
    // Formular), bliebe mit back() ein toter Eintrag stehen, der einen wirkungslosen
    // Zurück-Druck kosten würde. Eine Traversierung = genau ein popstate, egal wie weit.
    const steps = openLayerCount - n;
    openLayerCount = n;
    closingLayerViaPopstate = true; // siehe Kommentar an der Deklaration oben
    history.go(-steps);
  }
}
// Scrollen NEBEN dem Menü (Hintergrund/Fenster) soll das Menü schließen, Scrollen AUF
// dem Menü selbst (falls dessen Inhalt bei Zoom o.ä. nicht mehr auf den Bildschirm
// passt) dagegen nicht - und darf dabei auch nicht den Hintergrund mitscrollen. Löst
// sich rein über 'scroll' am WINDOW statt einer Body-Scroll-Sperre: 'scroll'-Events
// bubbeln nicht, ein Scroll innerhalb von .menu-panel (eigenes overflow-y: auto, siehe
// CSS) feuert nur dort, nie am window - dieser Listener sieht deshalb nur echte
// Hintergrund-Scrolls. .menu-panel hat zusätzlich overscroll-behavior: contain, damit
// ein Scroll, der dort an sein Ende kommt (z.B. durchgescrollt bis ganz unten), nicht
// ins darunterliegende Fenster "durchreicht" und dort doch noch scrollt.
// Das Zeilen-Menü in "Heute" schließt beim Scrollen ebenso - es hängt zwar an seiner
// Zeile (scrollt mit), bleibt aber sonst beim Weiterscrollen unbemerkt offen und würde
// den nächsten Tipp als Light-Dismiss verschlucken.
window.addEventListener('scroll', () => {
  if (state.menuOpen) { state.menuOpen = false; render(); }
  if (state.rowMenu) closeRowMenu();
}, { passive: true });

function activeHabits() {
  return state.habits.filter((h) => !h.archivedAt);
}

function habitHasData(habitId) {
  return Object.values(state.entries).some((day) => day[habitId] !== undefined);
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
