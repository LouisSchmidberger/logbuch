<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logbuch</title>
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<meta name="theme-color" content="#eae7df" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Logbuch" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --paper: #eae7df;
    --ink: #24261f;
    --line: #c7c1b2;
    --moss: #4b6b4f;
    --rust: #a2503a;
    --sand: #8c8371;
    --surface: #eae7df;
    --input-bg: #ffffff;
    --shadow: rgba(0, 0, 0, 0.15);
    --scrim: rgba(0, 0, 0, 0.45);
    --rust-rgb: 162, 80, 58;
    --moss-rgb: 75, 107, 79;
    /* scoreColor() liefert theme-unabhängig immer dieselben Mittelton-Farben (siehe
       JS) – Text darauf braucht deshalb eine feste, helle Farbe statt --ink/--paper,
       die sich sonst im Dark Mode mitverdunkeln und unlesbar würden. */
    --on-score: #f5f3ee;
  }
  /* Dunkles Farbschema: folgt automatisch prefers-color-scheme, außer ein
     manueller Override (data-theme) sagt etwas anderes. Beide Regeln setzen
     exakt dieselben Werte, nur der Auslöser unterscheidet sich. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1e1c17;
      --ink: #ece7da;
      --line: #4a453a;
      --moss: #7fa583;
      --rust: #d3785d;
      --sand: #a89f8c;
      --surface: #29261f;
      --input-bg: #2c2920;
      --rust-rgb: 211, 120, 93;
      --moss-rgb: 127, 165, 131;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1e1c17;
    --ink: #ece7da;
    --line: #4a453a;
    --moss: #7fa583;
    --rust: #d3785d;
    --sand: #a89f8c;
    --surface: #29261f;
    --input-bg: #2c2920;
    --rust-rgb: 211, 120, 93;
    --moss-rgb: 127, 165, 131;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Für Screenreader vorhandener, aber visuell ausgeblendeter Text (z.B. die
     Graph-Zusammenfassung) — Standard-Clip-Technik statt display:none, damit der
     Inhalt weiterhin vorgelesen wird. */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden; /* Sicherheitsnetz: nichts soll je die ganze Seite breiter machen */
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .header h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 22px; margin: 0; }

  .header-menu-wrap { position: relative; }
  .menu-btn {
    background: none; border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .menu-panel {
    position: absolute; top: 38px; right: 0; z-index: 10; width: 230px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .menu-panel .push-row { margin-bottom: 0; }
  .menu-row { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sand); }
  .menu-row select {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink);
  }
  .menu-item-btn {
    font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: transparent; color: var(--ink); cursor: pointer; text-align: left;
  }
  .menu-item-btn--danger { color: var(--rust); border-color: rgba(var(--rust-rgb), 0.4); }

  .modal-overlay {
    position: fixed; inset: 0; background: var(--scrim); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px; max-width: 340px; width: 100%;
  }
  .modal-box h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 17px; margin: 0 0 10px; }
  .modal-box p { font-size: 13px; line-height: 1.45; margin: 0 0 14px; }

  .push-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink); background: rgba(var(--moss-rgb), 0.08); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; margin-bottom: 16px; }
  .push-row--muted { color: var(--sand); background: transparent; }
  .push-toggle { background: none; border: none; color: var(--moss); font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .push-toggle--prominent {
    background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600;
    padding: 7px 12px; border-radius: 3px;
  }

  .install-hint {
    display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.4; color: var(--ink);
    background: rgba(var(--rust-rgb), 0.08); border: 1px solid rgba(var(--rust-rgb), 0.3); border-radius: 3px;
    padding: 8px 10px; margin-bottom: 16px;
  }
  .install-hint span { flex: 1; }
  .install-hint-close {
    background: none; border: none; color: var(--sand); font-size: 16px; line-height: 1; cursor: pointer;
    padding: 0 2px; flex-shrink: 0;
  }

  .tabs {
    display: flex; gap: 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; padding: 6px 0 10px; font-family: inherit; font-size: 14px;
    color: var(--sand); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab--active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

  .day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .nav-btn {
    background: none; border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .day-label { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .day-weekday { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; }
  .day-date { font-size: 12px; color: var(--sand); }

  .today-jump {
    display: block; margin: 0 auto 14px; background: none; border: none; color: var(--moss);
    font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0;
  }

  .habit-list { display: flex; flex-direction: column; }
  .habit-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .habit-row:first-child { border-top: 1px solid var(--line); }
  .habit-name { font-size: 13px; line-height: 1.35; flex: 1; min-width: 0; }
  .habit-options {
    display: flex; gap: 6px; flex-shrink: 1; min-width: 0; max-width: 60%;
    overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .habit-options::-webkit-scrollbar { display: none; }

  .opt-btn {
    font-family: inherit; font-size: 12px; width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .opt-btn--text {
    width: auto; min-width: 28px; height: 28px; border-radius: 14px; padding: 0 10px;
    white-space: nowrap;
  }
  .opt-btn--selected { color: var(--on-score); }

  .reset-btn {
    display: block; margin: 18px auto 0; background: none; border: none; color: var(--sand);
    font-family: inherit; font-size: 12px; cursor: pointer; text-decoration: underline;
  }

  .number-box {
    border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .number-box label { font-size: 13px; flex: 1; }
  .number-box .number-last { display: block; font-size: 11px; color: var(--sand); margin-top: 2px; }
  .number-input {
    width: 72px; font-family: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink);
  }

  .habit-row--slider { flex-direction: column; align-items: stretch; gap: 6px; }
  .slider-row { display: flex; align-items: center; gap: 10px; width: 100%; }
  .slider-value { font-size: 12px; color: var(--sand); min-width: 2em; text-align: right; flex-shrink: 0; }
  .slider-clear {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--sand); font-size: 13px; line-height: 1; cursor: pointer;
  }

  /* Eigens gestylter Regler statt native OS-Optik (wirkte "klobig") — die farbige
     Füllung kommt über einen Gradient auf dem Track, gesteuert durch --slider-color/
     --slider-pct (siehe renderHabitSlider/input-Listener in logbuch.html). Bewusst
     NICHT über accent-color, das bei jedem Live-Update in manchen Browsern kurz
     glitchte, statt sauber mitzuziehen. */
  .value-slider {
    flex: 1; -webkit-appearance: none; appearance: none; background: transparent;
    height: 22px; cursor: pointer; --slider-color: var(--moss); --slider-pct: 50%;
  }
  .value-slider--unset { --slider-color: var(--sand); }
  .value-slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--slider-color) 0%, var(--slider-color) var(--slider-pct), var(--line) var(--slider-pct), var(--line) 100%);
  }
  .value-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .value-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--slider-color); }
  .value-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -6px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }
  .value-slider::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }

  .habit-row--group .group-readout {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; color: var(--on-score);
  }
  .habit-row--group { flex-wrap: wrap; }
  .habit-row--group .manage-meta { flex-basis: 100%; }

  .group-member-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .group-member-check { font-size: 13px; }

  .number-chart-box { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .number-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .number-chart-meta { font-size: 11px; color: var(--sand); flex-shrink: 0; white-space: nowrap; }
  .number-chart-svg { display: block; width: 100%; height: 56px; }

  .grid-scroll { overflow-x: auto; }
  .grid-row { display: grid; grid-template-columns: minmax(58px, 80px) repeat(7, 1fr) minmax(30px, 38px); align-items: center; gap: 1px; }
  .grid-row--header { padding-bottom: 6px; }
  .grid-label { font-size: 10px; padding-right: 3px; line-height: 1.2; }
  .grid-col-header { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: var(--sand); cursor: pointer; }
  .grid-col-date { font-size: 10px; color: var(--ink); }
  .grid-col-header--avg { font-family: 'Fraunces', serif; font-style: italic; color: var(--ink); cursor: default; }
  .grid-cell { height: 22px; margin: 1px; border-radius: 2px; border: 1px solid var(--line); cursor: pointer; }
  .grid-cell--avg { display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--on-score); font-weight: 600; cursor: default; }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
  .month-weekday { font-size: 10px; color: var(--sand); text-align: center; padding-bottom: 4px; }
  .month-cell { aspect-ratio: 1; border-radius: 3px; border: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px; cursor: pointer; }
  .month-cell--empty { border: none; cursor: default; }
  /* mix-blend-mode:multiply setzt auf einen hellen Seitenhintergrund, damit die
     Zahl unabhängig vom farbcodierten Zell-Hintergrund lesbar bleibt – funktioniert
     im Dark Mode nicht mehr (verdunkelt statt abzuheben), dort auf reine Ink-Farbe
     ohne Blend-Mode zurückfallen. */
  .month-cell-num { font-size: 10px; color: var(--ink); mix-blend-mode: multiply; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .month-cell-num { mix-blend-mode: normal; }
  }
  :root[data-theme="dark"] .month-cell-num { mix-blend-mode: normal; }

  .month-stats { border-top: 1px solid var(--line); padding-top: 8px; }
  .month-stat-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .month-stat-value { font-weight: 600; }
  .month-stat-count { font-weight: 400; color: var(--sand); }

  .year-grid { display: flex; flex-direction: column; gap: 3px; margin-bottom: 20px; }
  .year-month { display: flex; align-items: center; gap: 6px; }
  .year-month-label { width: 24px; font-size: 9px; color: var(--sand); flex-shrink: 0; }
  .year-month-grid { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; flex: 1; }
  .year-day-cell { aspect-ratio: 1; border-radius: 1px; min-width: 0; cursor: pointer; }

  .notice {
    font-size: 12px; padding: 8px 10px; border-radius: 3px; margin-bottom: 14px;
    background: rgba(var(--rust-rgb), 0.12); color: var(--rust); border: 1px solid rgba(var(--rust-rgb), 0.3);
  }
  .notice--ok { background: rgba(var(--moss-rgb), 0.12); color: var(--moss); border-color: rgba(var(--moss-rgb), 0.3); }
  .loading { font-size: 13px; color: var(--sand); padding: 40px 0; text-align: center; }

  .auth-box { max-width: 320px; margin: 60px auto; }
  .auth-box h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 24px; margin: 0 0 4px; text-align: center; }
  .auth-box p.sub { font-size: 12px; color: var(--sand); text-align: center; margin: 0 0 24px; }
  .tutorial-text { font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
  .tutorial-step-label { font-size: 12px; color: var(--sand); text-align: center; margin: 4px 0 14px; }
  .auth-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .auth-field label { font-size: 12px; color: var(--sand); }
  .auth-field input:not([type="checkbox"]), .auth-field select {
    font-family: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink); width: 100%;
  }
  .auth-field-label-row { display: flex; align-items: center; justify-content: space-between; }
  .input-clear-wrap { position: relative; }
  .input-clear-wrap input { padding-right: 30px; }
  .input-clear-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--sand); font-size: 17px; line-height: 1;
    cursor: pointer; padding: 6px;
  }
  .auth-submit {
    width: 100%; padding: 10px; margin-top: 8px; font-family: inherit; font-size: 14px; font-weight: 600;
    background: var(--ink); color: var(--paper); border: none; border-radius: 3px; cursor: pointer;
  }
  .auth-submit:disabled { background: var(--sand); cursor: default; }
  .auth-toggle { display: block; margin: 14px auto 0; background: none; border: none; color: var(--moss); font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; text-align: center; width: 100%; }

  .manage-list { display: flex; flex-direction: column; margin-bottom: 18px; }
  .manage-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .manage-row:first-child { border-top: 1px solid var(--line); }
  .manage-row--archived { opacity: 0.55; }
  .manage-row--confirm-delete { opacity: 1; flex-wrap: wrap; }
  .manage-row--dragging { position: relative; z-index: 5; background: var(--surface); box-shadow: 0 4px 10px var(--shadow); }
  .manage-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .manage-name { font-size: 13px; }
  .manage-meta { font-size: 11px; color: var(--sand); }
  .manage-delete-warning { font-size: 11px; color: var(--rust); }
  .manage-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .drag-handle {
    display: flex; flex-direction: column; justify-content: center; gap: 3px; width: 20px; height: 28px;
    flex-shrink: 0; cursor: grab; touch-action: none;
  }
  .drag-handle span { display: block; width: 14px; height: 2px; background: var(--sand); border-radius: 1px; }
  /* Tastatur-/Tipp-Alternative zum Drag-Handle (der rein per Pointer-Events
     funktioniert) — sichtbar kompakt gehalten, aber mit spürbarem Abstand
     zueinander und einem unsichtbar über den sichtbaren Rand hinausragenden
     Treffer-Bereich (::after), damit auch ungenaues Antippen zuverlässig den
     richtigen der beiden Buttons trifft statt zu "verzugestopft" zu wirken. */
  .move-buttons { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .move-btn {
    position: relative; font-family: inherit; font-size: 11px; line-height: 1; width: 26px; height: 22px;
    border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer;
  }
  .move-btn::after { content: ''; position: absolute; inset: -6px; }
  .move-btn:disabled { opacity: 0.3; cursor: default; }
  .manage-btn {
    font-family: inherit; font-size: 11px; padding: 5px 9px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .manage-btn--danger { color: var(--rust); border-color: rgba(var(--rust-rgb), 0.4); }
  .manage-new-btn {
    display: block; width: 100%; margin-top: 4px; padding: 10px; font-family: inherit; font-size: 13px;
    border: 1px dashed var(--line); border-radius: 4px; background: transparent; color: var(--moss); cursor: pointer;
  }
  .manage-section-divider { border-top: 1px solid var(--line); margin: 22px 0 14px; }
  .manage-section-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 15px; margin: 0 0 4px; }
  .about-intro { font-size: 13px; line-height: 1.5; color: var(--sand); margin: -8px 0 22px; }
  .tip-group .manage-section-title { margin-bottom: 12px; }
  .tip { margin-bottom: 16px; }
  .tip:last-child { margin-bottom: 0; }
  .tip-title { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .tip-body { font-size: 13px; line-height: 1.5; color: var(--sand); margin: 0; }
  .a11y-highlight {
    background: rgba(var(--moss-rgb), 0.08); border: 1px solid rgba(var(--moss-rgb), 0.3);
    border-radius: 6px; padding: 16px;
  }
  .a11y-highlight .manage-section-title { margin-bottom: 8px; }
  .a11y-highlight > .tip-body { margin-bottom: 14px; }
  .a11y-highlight .tip:last-child { margin-bottom: 0; }
  .a11y-feedback { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(var(--moss-rgb), 0.3); font-style: italic; }

  .habit-form { border: 1px solid var(--line); border-radius: 4px; padding: 14px; margin-bottom: 18px; }
  .habit-form h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 16px; margin: 0 0 12px; }
  .habit-form .auth-field { margin-bottom: 10px; }
  .habit-form-lock-note { font-size: 11px; color: var(--sand); margin: -4px 0 12px; }
  .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill-toggle {
    font-family: inherit; font-size: 12px; padding: 7px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .pill-toggle--active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .pill-toggle:disabled { opacity: 0.4; cursor: default; }

  .stepper-row { display: flex; align-items: center; gap: 8px; }
  .stepper-row input[type="number"] {
    width: 60px; text-align: center; font-family: inherit; font-size: 14px; padding: 6px 4px;

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// --- Konfiguration -----------------------------------------------------
const SUPABASE_URL = 'https://qdadoqcnqmrauhshvcts.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_c8VJ-dqy-WD_y01aQy1Dzw_LJE-Ornr';
const VAPID_PUBLIC_KEY = 'BDsrR2NV5vEE4Ati-Dda7tNom6GTtWmKvzytspTc7x1LP6ur1np90oAPphhIAoCtnaw3nGELgBXxYNyiSkLVEEY';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

// --- Verschlüsselung (Zero-Access: der Server sieht nur Chiffretext) --------
// Zweistufiger Schlüssel: ein zufälliger DEK (Data Encryption Key) verschlüsselt die
// eigentlichen Werte in habit_entries.data. Der DEK selbst wird zweifach "verpackt"
// (wrapped) serverseitig abgelegt — einmal mit einem aus dem Passwort abgeleiteten KEK
// (Key Encryption Key), einmal mit einem zufälligen Recovery-Key, den nur der Nutzer
// kennt (einmalig angezeigt, siehe renderRecoveryKeyDisplay). Der DEK selbst ändert
// sich dadurch nie — ein Passwort-Reset mit Recovery-Key "vererbt" ihn einfach ins neu
// verpackte Feld weiter, ohne dass irgendwelche Bestandsdaten neu verschlüsselt werden
// müssten. Alles über die native Web Crypto API, keine externe Library nötig.

function bufToBase64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function base64ToBuf(b64) {
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
}
function bufToHex(buf) {
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function hexToBuf(hex) {
  const clean = hex.replace(/[^0-9a-fA-F]/g, '');
  const bytes = new Uint8Array(clean.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(clean.substr(i * 2, 2), 16);
  return bytes.buffer;
}
// Recovery-Key fürs Anzeigen in Fünferblöcken gruppieren, z.B. "a1b2c-d3e4f-...".
function formatRecoveryKey(hex) {
  return hex.match(/.{1,5}/g).join('-');
}

const PBKDF2_ITERATIONS = 250000;

async function deriveKek(password, saltBuf, iterations) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBuf, iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['wrapKey', 'unwrapKey']
  );
}

async function generateDek() {
  return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}

function generateRecoveryKeyBytes() {
  return crypto.getRandomValues(new Uint8Array(32));
}

async function importRecoveryKeyAsCryptoKey(bytesBuf) {
  return crypto.subtle.importKey('raw', bytesBuf, 'AES-GCM', false, ['wrapKey', 'unwrapKey']);
}

async function wrapDek(dek, wrappingKey) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const wrapped = await crypto.subtle.wrapKey('raw', dek, wrappingKey, { name: 'AES-GCM', iv });
  return { iv: bufToBase64(iv), wrapped: bufToBase64(wrapped) };
}

async function unwrapDek(wrappedB64, ivB64, wrappingKey) {
  return crypto.subtle.unwrapKey(
    'raw',
    base64ToBuf(wrappedB64),
    wrappingKey,
    { name: 'AES-GCM', iv: new Uint8Array(base64ToBuf(ivB64)) },
    { name: 'AES-GCM', length: 256 },
    true,
    ['encrypt', 'decrypt']
  );
}

async function encryptData(dek, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dek, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: bufToBase64(iv), ciphertext: bufToBase64(ciphertext) };
}

async function decryptData(dek, enc) {
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(base64ToBuf(enc.iv)) }, dek, base64ToBuf(enc.ciphertext));
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// --- Lokaler DEK-Cache (IndexedDB) -------------------------------------------
// Rohbytes des entpackten DEK, ausschließlich auf diesem Gerät — geht nie an den
// Server. Erspart bei jedem App-Start auf demselben Gerät die erneute Passworteingabe
// (und die PBKDF2-Ableitung). Vergleichbares Sicherheitsniveau wie die ohnehin schon
// lokal gespeicherte Supabase-Session.
function openKeyDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('logbuch-keys', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('deks');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function cacheDek(userId, dek) {
  const raw = await crypto.subtle.exportKey('raw', dek);
  const db = await openKeyDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction('deks', 'readwrite');
    tx.objectStore('deks').put(bufToBase64(raw), userId);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function loadCachedDek(userId) {
  const db = await openKeyDb();
  const rawB64 = await new Promise((resolve, reject) => {
    const tx = db.transaction('deks', 'readonly');
    const req = tx.objectStore('deks').get(userId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
  if (!rawB64) return null;
  return crypto.subtle.importKey('raw', base64ToBuf(rawB64), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
}
async function clearCachedDek(userId) {
  try {
    const db = await openKeyDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('deks', 'readwrite');
      tx.objectStore('deks').delete(userId);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch { /* IndexedDB evtl. nicht verfügbar (privater Modus etc.) - egal, nur Cache */ }
}

// --- Habit-Definitionen ----------------------------------------------------
// Kommen jetzt aus der Tabelle habit_definitions (pro Nutzer frei verwaltbar, siehe
// renderManage weiter unten), nicht mehr aus einer festen Konstante hier im Code.
// `id` bleibt (wie vorher bei der festen Liste) der Schlüssel in habit_entries.data
// (= slug in der DB); `defId` ist die UUID der Definitions-Zeile, nur für Verwaltungs-
// Aktionen (bearbeiten/archivieren/löschen) gebraucht.
// - labels === null  → Zahlenwerte (0, 1, 2, ...)
// - labels === [...] → eigene Bezeichnungen, Länge muss max-min+1 entsprechen
function habitFromRow(row) {
  return {
    id: row.slug,
    defId: row.id,
    name: row.name,
    kind: row.kind,          // 'scale' | 'number' | 'group'
    unit: row.unit,          // nur bei kind === 'number', z.B. 'kg'
    min: row.min,
    max: row.max,
    labels: row.labels,
    good: row.good,
    displayStyle: row.display_style,   // 'buttons' | 'slider', nur bei kind === 'scale' + Zahlenwerte relevant
    sliderShowValue: row.slider_show_value,
    groupMembers: row.group_members,   // nur bei kind === 'group': Array von Slugs
    reminderMinute: row.reminder_minute, // Minuten seit Mitternacht (0-1439) oder null (= Standardzeit)
    goalThreshold: row.goal_threshold, // nur bei kind === 'scale'/'group', 0-1 oder null (= 1 = 100%)
    sortOrder: row.sort_order,
    archivedAt: row.archived_at,
  };
}

function isNumberKind(h) { return h.kind === 'number'; }

// --- Datum-Helfer ----------------------------------------------------------
function formatKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function startOfDay(date) { const d = new Date(date); d.setHours(0, 0, 0, 0); return d; }
// Parst einen 'YYYY-MM-DD'-Key als lokales Datum (nicht new Date(string), das UTC
// interpretiert und je nach Zeitzone einen Tag daneben liegen kann).
function parseDateKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function startOfWeek(date) { const d = startOfDay(date); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; }
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }

// --- Erinnerungszeit-Helfer (Minuten seit Mitternacht <-> "HH:MM") ---------
// Erinnerungszeiten werden seit dem Onboarding-Tutorial in 15-Minuten-Schritten
// statt nur zur vollen Stunde gespeichert (siehe CLAUDE.md), als Minuten seit
// Mitternacht (0-1439) statt Stunde (0-23).
function minutesToTimeStr(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}
const REMINDER_TIME_STEP = 15; // Minuten — muss zum Cron-Intervall in send-notifications passen
// Bewusst ein <select> mit ausschließlich gültigen 15-Minuten-Werten statt eines
// nativen <input type="time" step="900">: das step-Attribut wird von vielen Browsern/
// Betriebssystemen (v.a. mobil) schlicht ignoriert, sodass sich trotzdem jede beliebige
// Minute auswählen ließ, obwohl das System ohnehin nur im 15-Minuten-Raster zustellen
// kann (unnötige Verwirrung: man konnte etwas einstellen, das stillschweigend gerundet
// wurde). Ein <select> kann von vornherein gar nichts anderes anbieten.
function reminderTimeInputHtml(id, minutes, dataAction, disabled) {
  const options = Array.from({ length: (24 * 60) / REMINDER_TIME_STEP }, (_, i) => i * REMINDER_TIME_STEP)
    .map((m) => `<option value="${m}" ${m === minutes ? 'selected' : ''}>${minutesToTimeStr(m)}</option>`)
    .join('');
  return `<select id="${id}" ${dataAction ? `data-action="${dataAction}"` : ''} ${disabled ? 'disabled' : ''}>${options}</select>`;
}

// 0 = schlechtester, 1 = bester Wert
function normalize(habit, value) {
  if (value === undefined || value === null) return null;
  const raw = (value - habit.min) / (habit.max - habit.min);
  return habit.good === 'low' ? 1 - raw : raw;
}

// Normalisierter Score (0-1) eines Feldes an einem bestimmten Tag. Bei normalen
// Skala-Feldern der direkt eingetragene Wert; bei gruppierten Feldern (kind='group')
// der Durchschnitt der normalisierten Werte seiner Mitglieder an dem Tag (null, wenn
// an dem Tag kein Mitglied befüllt ist — eine Gruppe hält nie einen eigenen Eintrag,
// ihr Slug taucht nie als Key in state.entries auf). Ändert man die Mitgliederliste
// einer Gruppe, wirkt sich das rückwirkend auf die gesamte Historie aus, da hier bei
// jedem Aufruf live neu gerechnet wird — beabsichtigt, siehe CLAUDE.md.
function habitScore(h, dateKey) {
  const day = state.entries[dateKey];
  if (!day) return null;
  if (h.kind === 'group') {
    const memberScores = (h.groupMembers || [])
      .map((slug) => state.habits.find((x) => x.id === slug))
      .filter(Boolean)
      .map((m) => normalize(m, day[m.id]))
      .filter((s) => s !== null);
    if (!memberScores.length) return null;
    return memberScores.reduce((a, b) => a + b, 0) / memberScores.length;
  }
  return normalize(h, day[h.id]);
}

// Ob ein Feld irgendwo in den übergebenen Datums-Keys einen (ggf. errechneten) Score
// hat — für archivierte Felder in Auswertungs-Ansichten: normale Felder prüfen direkt
// state.entries, Gruppen (die nie selbst einen Entry-Key haben) über habitScore.
function habitVisibleInRange(h, dateKeys) {
  if (h.kind === 'group') return dateKeys.some((k) => habitScore(h, k) !== null);
  return dateKeys.some((k) => state.entries[k]?.[h.id] !== undefined);
}

function scoreColor(score) {
  if (score === null || score === undefined) return 'transparent';
  const rust = [162, 80, 58], sand = [150, 142, 124], moss = [75, 107, 79];
  let c;
  if (score < 0.5) { const t = score / 0.5; c = rust.map((v, i) => Math.round(v + (sand[i] - v) * t)); }
  else { const t = (score - 0.5) / 0.5; c = sand.map((v, i) => Math.round(v + (moss[i] - v) * t)); }
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}

// Zusätzlich zur Farbe (scoreColor) ein Streifenmuster, dessen Dichte/Deckkraft mit
// dem Score steigt — macht die Bewertung auch für Rot-Grün-Farbenblinde ohne Farbe
// erkennbar, nicht als Ersatz für die Farbe, sondern als Ergänzung. Bewusst diskrete
// Stufen statt stufenloser Variation: bei 8-22px Zellgröße wäre ein kontinuierlicher
// Verlauf visuelles Rauschen, diskrete Stufen sind als "Sprosse auf einer Leiter"
// erkennbar unabhängig vom Farbton. coarse=true (Jahres-Ansicht, ~8px Zellen) nutzt
// nur 3 statt 5 Stufen mit weiter auseinanderliegenden Streifen.
function scorePatternStyle(score, coarse) {
  if (score === null || score === undefined || isPatternDisabled()) return '';
  const spacing = coarse ? [6, 4, 2] : [6, 5, 4, 3, 2];
  const opacity = coarse ? [0.15, 0.25, 0.35] : [0, 0.12, 0.2, 0.28, 0.35];
  const buckets = spacing.length;
  const step = Math.min(buckets - 1, Math.floor(score * buckets));
  if (opacity[step] === 0) return '';
  return `background-image:repeating-linear-gradient(45deg, rgba(0,0,0,${opacity[step]}) 0, rgba(0,0,0,${opacity[step]}) 1px, transparent 1px, transparent ${spacing[step]}px);`;
}

// Beschreibung für Kalenderzellen (Woche/Monat/Jahr), die nur per Hintergrundfarbe
// bewertet sind — macht dieselbe Information per Tastatur/Screenreader zugänglich.
// habitName optional: Wochen-Grid-Zellen gehören zu einem konkreten Feld, Monats-/
// Jahres-Zellen zeigen den Tages-Gesamtwert über alle Felder.
function dayCellAriaLabel(date, score, habitName) {
  const scoreText = score === null || score === undefined ? t('common.noData') : `${Math.round(score * 100)}%`;
  return habitName
    ? t('ariaLabel.dayCellForHabit', { name: habitName, date: formatDMY(date), score: scoreText })
    : t('ariaLabel.dayCell', { date: formatDMY(date), score: scoreText });
}

// Verschiebt einen normalisierten Score (0-1) anhand der pro Feld einstellbaren
// Ziel-Quote (goalThreshold, Standard 1 = 100%) für die FARBGEBUNG — z.B. bei
// "Kraftsport gemacht" kann eine 50%-Quote schon als voll erreicht (Score 1) gelten.
// Ändert NIE angezeigte Prozentzahlen, nur die Farbe, und wird bewusst NICHT in der
// "Heute"-Ansicht verwendet (siehe renderHabitOptions). Bei Standard-Ziel (1) exakter
// Durchreicher, keine Änderung ggü. vorher.
function applyGoal(habit, score) {
  if (score === null || score === undefined) return null;
  const threshold = habit.goalThreshold ?? 1;
  if (threshold >= 1) return score;
  return Math.min(1, score / threshold);
}

// Gesamt-Score eines Tages über alle Skala-/Gruppen-Felder gemittelt (für Monats-/
// Jahres-Heatmap). Zahlenwert-Felder (kind='number') fließen bewusst nicht ein —
// kein Gut/Schlecht dort.
function dayOverallScore(date) {
  const dateKey = formatKey(date);
  const day = state.entries[dateKey];
  if (!day) return null;
  const scores = state.habits.filter((h) => h.kind === 'scale' || h.kind === 'group')
    .map((h) => applyGoal(h, habitScore(h, dateKey)))
    .filter((s) => s !== null);
  if (!scores.length) return null;
  return scores.reduce((a, b) => a + b, 0) / scores.length;
}

// Durchschnitt + Anzahl je Skala-/Gruppen-Feld über eine Menge von Datums-Keys
// ('YYYY-MM-DD').
function computeHabitStats(habits, dateKeys) {
  return habits.map((h) => {
    let sum = 0, count = 0;
    for (const k of dateKeys) {
      const s = habitScore(h, k);
      if (s !== null) { sum += s; count++; }
    }
    return { habit: h, avg: count ? sum / count : null, count };
  });
}

// Werte-Reihe + Kennzahlen eines Zahlenwert-Felds über eine Menge von Datums-Keys.
function numberFieldStats(habitId, dateKeys) {
  const series = dateKeys
    .map((k) => ({ key: k, value: state.entries[k]?.[habitId] }))
    .filter((p) => p.value !== undefined && p.value !== null);
  if (!series.length) return null;
  const values = series.map((p) => p.value);
  return {
    series,
    count: series.length,
    min: Math.min(...values),
    max: Math.max(...values),
    avg: values.reduce((a, b) => a + b, 0) / values.length,
    last: series[series.length - 1].value,
  };
}

// --- App-State ---------------------------------------------------------
const state = {
  session: null,
  entries: {},       // { 'YYYY-MM-DD': { habitId: value, ... } }
  loading: true,
  notice: null,       // { type: 'error'|'ok', text }
  view: 'today',
  currentDate: startOfDay(new Date()),
  weekAnchor: startOfWeek(new Date()),
  monthAnchor: (() => { const d = startOfDay(new Date()); d.setDate(1); return d; })(),
  yearAnchor: new Date().getFullYear(),
  authMode: 'signin', // 'signin' | 'signup' | 'forgot'
  authError: null,
  authEmail: '', // bleibt über einen Re-Render (z.B. nach Fehler) hinweg erhalten,
  authPassword: '', // damit ein Tippfehler nicht das ganze Formular leert (siehe input-Listener).
  authPasswordVisible: false,
  passwordRecovery: false, // true zwischen Klick auf den Passwort-Reset-Link und neuem Passwort
  pushStatus: 'unknown', // 'unsupported' | 'unknown' | 'off' | 'on' | 'busy'
  habits: [],         // alle Felder des Nutzers (aktiv + archiviert), sort_order-sortiert
  habitForm: null,    // { defId, locked, name, mode: 'numeric'|'labels', min, max, steps, labels, good }
  habitFormSaving: false, // true während handleHabitSave() läuft, verhindert Doppel-Submits
  menuOpen: false,
  // Standard-Erinnerungszeit (Minuten seit Mitternacht) für Felder ohne eigene reminder_minute.
  // onboardingCompleted default true, bis loadUserSettings() den echten Wert lädt – verhindert,
  // dass das Tutorial kurz aufblitzt, bevor die tatsächlichen Einstellungen geladen sind.
  userSettings: { defaultReminderMinute: 1320, onboardingCompleted: true, locale: 'de' },
  deleteConfirm: null, // { busy: boolean } während der Konto-Löschen-Bestätigung offen ist
  habitDeleteConfirm: null, // defId eines archivierten Feldes mit Daten, dessen Löschen gerade bestätigt wird
  tutorialStep: null, // 1/2/3 während das Onboarding-Tutorial für neue Accounts läuft, sonst null
  tutorialSkipConfirm: false, // Bestätigungsdialog "Tutorial überspringen?" offen
  tutorialInstallAck: false, // "Weiter" auf dem Installations-Hinweis vor Schritt 1 geklickt (session-lokal,
  // NICHT dasselbe wie der dauerhafte installHintDismissed-localStorage-Flag)
  encryptionSetupInProgress: false, // true während setupEncryption()/Migration läuft
  recoveryKeyToShow: null, // { hex, confirmed } - einmalige Anzeige nach Erzeugung
  unlockError: null, // Fehlertext im renderUnlockPrompt-Screen
  unlockBusy: false,
  recoveryFallbackConfirm: false, // "Recovery-Key auch verloren?" im Passwort-Reset aufgeklappt
  recoveryBusy: false,
};

// currentDek (Modul-Variable statt state): der lebende Entschlüsselungs-Schlüssel darf
// nie über render()/innerHTML laufen und soll auch nicht versehentlich durch
// generische State-Handhabung angefasst werden.
let currentDek = null;

// Merkt sich einen CSS-Selektor für das Element, das ein Modal (Konto löschen/
// Tutorial überspringen) geöffnet hat, damit der Fokus beim Schließen
// (Abbrechen/Escape) dorthin zurückspringt. Bewusst ein Selektor statt einer
// direkten Element-Referenz: render() ersetzt bei jedem Aufruf das komplette
// innerHTML, jede zuvor gemerkte Node wäre beim Schließen längst verwaist —
// der Selektor wird erst beim tatsächlichen Zurückspringen neu aufgelöst.
let modalTriggerSelector = null;
function restoreModalFocus() {
  if (!modalTriggerSelector) return;
  document.querySelector(modalTriggerSelector)?.focus();
  modalTriggerSelector = null;
}

function activeHabits() {
  return state.habits.filter((h) => !h.archivedAt);
}

function habitHasData(habitId) {
  return Object.values(state.entries).some((day) => day[habitId] !== undefined);
}

function slugify(name) {
  const base = String(name).toLowerCase().replace(/ß/g, 'ss')
    .normalize('NFD')
    .replace(/[^a-z0-9]/g, '');
  return base || 'feld';
}

function uniqueSlug(base) {
  const existing = new Set(state.habits.map((h) => h.id));
  if (!existing.has(base)) return base;
  let i = 2;
  while (existing.has(base + i)) i++;
  return base + i;
}

const app = document.getElementById('app');

function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let currentLocale = 'de';

function t(key, params) {
  const table = STRINGS[currentLocale] || STRINGS.de;
  let str = table[key];
  if (str === undefined) {
    console.warn(`[i18n] fehlender Key "${key}" für Locale "${currentLocale}"`);
    str = STRINGS.de[key] ?? key;
  }
  if (!params) return str;
  return str.replace(/\{(\w+)\}/g, (_, name) => {
    const v = params[name];
    return v === undefined ? `{${name}}` : esc(String(v));
  });
}

function applyLocale(locale) {
  currentLocale = locale;
  document.documentElement.lang = locale;
}

function detectInitialLocale() {
  try {
    return (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en';
  } catch {
    return 'en';
  }
}

// Prüft beim Laden, ob DE und EN exakt dieselben Keys haben — deckt vergessene
// Übersetzungen sofort im Dev-Verlauf auf, statt sie erst live auffallen zu lassen.
(function assertStringsSymmetry() {
  const deKeys = new Set(Object.keys(STRINGS.de));
  const enKeys = new Set(Object.keys(STRINGS.en));
  const missingInEn = [...deKeys].filter((k) => !enKeys.has(k));
  const missingInDe = [...enKeys].filter((k) => !deKeys.has(k));
  if (missingInEn.length) console.error('[i18n] Keys fehlen in en:', missingInEn);
  if (missingInDe.length) console.error('[i18n] Keys fehlen in de:', missingInDe);
})();

// --- Dark Mode ---------------------------------------------------------
// Folgt standardmäßig prefers-color-scheme (siehe @media-Regeln im <style>-Block).
// Ein manueller Override (System/Hell/Dunkel) im Burger-Menü setzt zusätzlich
// data-theme auf <html> und wird NICHT über user_settings synchronisiert
// (anders als die Sprache) — bewusst geräte-lokal in localStorage, analog zum
// bestehenden installHintDismissed-Flag, kein DB-Roundtrip nötig.
const THEME_COLOR_BY_MODE = { light: '#eae7df', dark: '#1e1c17' };

function getThemeOverride() {
  try { return localStorage.getItem('themeOverride'); } catch { return null; } // 'light' | 'dark' | null (= System)
}

function systemPrefersDark() {
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch { return false; }
}

function syncThemeColorMeta(mode) {
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', THEME_COLOR_BY_MODE[mode]);
}

function applyTheme(override) {
  if (override) document.documentElement.setAttribute('data-theme', override);
  else document.documentElement.removeAttribute('data-theme');
  syncThemeColorMeta(override || (systemPrefersDark() ? 'dark' : 'light'));
}

function setThemeOverride(value) {
  try {
    if (value) localStorage.setItem('themeOverride', value);
    else localStorage.removeItem('themeOverride');
  } catch { /* z.B. privater Modus — Override wirkt dann nur für die laufende Sitzung */ }
  applyTheme(value);
}

// Streifenmuster (siehe scorePatternStyle) ist bewusst Standard, nicht opt-in — die
// meisten Menschen mit Rot-Grün-Farbschwäche wissen selbst nicht genau, dass/wie stark
// sie betroffen sind, würden ein verstecktes "Barrierefreiheit"-Menü also gar nicht
// erst aufsuchen. Wer das Muster rein optisch nicht möchte, kann es hier abschalten —
// geräte-lokal wie der Theme-Override, keine inhaltliche Account-Einstellung.
function isPatternDisabled() {
  try { return localStorage.getItem('scorePatternDisabled') === 'true'; } catch { return false; }
}
function setPatternDisabled(disabled) {
  try {
    if (disabled) localStorage.setItem('scorePatternDisabled', 'true');
    else localStorage.removeItem('scorePatternDisabled');
  } catch { /* z.B. privater Modus — wirkt dann nur für die laufende Sitzung */ }
}

// --- Datum/Zeit: locale-abhängige Formatierung -----------------------------
// Ersetzt frühere feste WEEKDAYS/MONTHS-Arrays + manuelles DD.MM.YYYY-Bauen.
// Die Montag-zuerst-Wochentag-Reihenfolge ((d.getDay()+6)%7) bleibt an den
// jeweiligen Aufrufstellen unverändert — reine Tages-Erzeugungslogik, keine
// Formatierungsfrage, dafür hat Intl kein verlässliches Grid-Primitiv.
function localeTag() {
  return currentLocale === 'en' ? 'en-US' : 'de-DE';
}
const dtfCache = new Map();
function dtf(options) {
  const key = localeTag() + JSON.stringify(options);
  if (!dtfCache.has(key)) dtfCache.set(key, new Intl.DateTimeFormat(localeTag(), options));
  return dtfCache.get(key);
}
function weekdayShort(date) { return dtf({ weekday: 'short' }).format(date); }
function weekdayLong(date) { return dtf({ weekday: 'long' }).format(date); }
function monthName(date) { return dtf({ month: 'long' }).format(date); }
function monthShort(date) { return dtf({ month: 'short' }).format(date); }
// 2024-01-01 ist ein Montag – fester Referenzpunkt, um Montag-zuerst-Kurznamen
// unabhängig vom aktuellen Datum aus Intl zu erzeugen (reine Label-Erzeugung, hat
// nichts mit der eigentlichen Tages-Reihenfolge-Logik an den Aufrufstellen zu tun).
function mondayFirstWeekdayShortNames() {
  return Array.from({ length: 7 }, (_, i) => weekdayShort(new Date(2024, 0, 1 + i)));
}
function longDate(date) { return dtf({ day: 'numeric', month: 'long', year: 'numeric' }).format(date); }
function formatDMY(dateKeyOrDate) {
  const d = typeof dateKeyOrDate === 'string' ? new Date(dateKeyOrDate + 'T00:00:00') : dateKeyOrDate;
  return dtf({ year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}

// Supabase liefert Auth-Fehlermeldungen nur auf Englisch. "Invalid login credentials"
// bleibt bewusst unspezifisch (verrät nicht, ob die E-Mail existiert oder nur das
// Passwort falsch ist — sonst ließe sich der Nutzerbestand durchscannen), wird aber
// zumindest übersetzt. Unbekannte Meldungen kommen unverändert durch.
const AUTH_ERROR_TRANSLATIONS = {
  de: {
    'Invalid login credentials': 'E-Mail oder Passwort falsch.',
    'User already registered': 'Für diese E-Mail existiert bereits ein Account.',
    'Email not confirmed': 'Bitte bestätige zuerst deine E-Mail-Adresse über den Link, den wir dir geschickt haben.',
    'Password should be at least 6 characters': 'Das Passwort muss mindestens 6 Zeichen lang sein.',
  },
  en: {
    'Invalid login credentials': 'Email or password incorrect.',
    'User already registered': 'An account already exists for this email address.',
    'Email not confirmed': 'Please confirm your email address first via the link we sent you.',
    'Password should be at least 6 characters': 'The password must be at least 6 characters long.',
  },
};
function translateAuthError(message) {
  return (AUTH_ERROR_TRANSLATIONS[currentLocale] || AUTH_ERROR_TRANSLATIONS.de)[message] || message;
}

// Übersetzt/vereinfacht technische Postgres-/Netzwerk-Fehlermeldungen (z.B. aus
// Datenbank-Operationen wie Feld anlegen/speichern) für Laien – die rohen
// Postgres-Meldungen (Constraint-Namen, Fachjargon) sind für Nicht-Techniker kaum
// verständlich. Unbekannte Meldungen kommen unverändert durch (wie
// translateAuthError), damit trotzdem etwas Nützliches angezeigt wird statt nichts.
function translateDbError(message) {
  if (/duplicate key value violates unique constraint "habit_definitions_user_id_slug_key"/.test(message)) {
    return t('error.db.duplicateSlug');
  }
  if (/duplicate key value violates unique constraint/.test(message)) {
    return t('error.db.duplicateGeneric');
  }
  if (/violates not-null constraint/.test(message)) {
    return t('error.db.notNull');
  }
  if (/violates check constraint/.test(message)) {
    return t('error.db.check');
  }
  if (/violates foreign key constraint/.test(message)) {
    return t('error.db.foreignKey');
  }
  if (/Failed to fetch|NetworkError|network error/i.test(message)) {
    return t('error.db.network');
  }
  if (/JWT expired|invalid JWT|refresh_token_not_found/i.test(message)) {
    return t('error.db.sessionExpired');
  }
  return message;
}

// Text-/Passwort-Eingabe mit optionalem "×"-Button zum Leeren (nur wenn nicht leer)
// und optionalem Sichtbar/Verbergen-Umschalter fürs Passwort — beides eigene kleine
// Buttons statt nativer Browser-Mechanismen, damit es plattformübergreifend gleich
// aussieht/funktioniert.
function clearableInputHtml(id, type, value, opts = {}) {
  const { autocomplete = '', required = true, minlength, showVisibilityToggle = false, visible = false } = opts;
  const inputType = showVisibilityToggle ? (visible ? 'text' : 'password') : type;
  return `
    <div class="input-clear-wrap">
      <input type="${inputType}" id="${id}" value="${esc(value)}" ${required ? 'required' : ''}
        ${autocomplete ? `autocomplete="${autocomplete}"` : ''} ${minlength ? `minlength="${minlength}"` : ''} />
      ${value ? `<button type="button" class="input-clear-btn" data-action="clear-input" data-target="${id}" tabindex="-1" aria-label="${esc(t('ariaLabel.clearInput'))}">×</button>` : ''}
    </div>
  `;
}

// Kleine "?"-Box mit Erklärungstext, per Tap auf-/zuklappbar (natives <details>, kein
// JS nötig) — für Erklärungen, die nicht direkt sichtbar sein sollen (zu viel auf
// einmal), aber bei Bedarf griffbereit sind.
function infoTip(text) {
  return `<details class="info-tip"><summary aria-label="${esc(t('ariaLabel.explain'))}">?</summary><p>${esc(text)}</p></details>`;
}

// Zentrale Stelle für state.notice → DOM: state.notice wird an vielen Stellen im
// Code gesetzt, aber nur hier gerendert — role/aria-live sorgen dafür, dass
// Screenreader neue Fehler-/Erfolgsmeldungen automatisch mitbekommen, ohne dass
// der Nutzer erst zur Meldung navigieren muss. Fehler unterbrechen sofort
// (assertive/alert), Erfolgsmeldungen kündigen sich nur höflich an (polite/status).
function renderNotice() {
  if (!state.notice) return '';
  const isErr = state.notice.type !== 'ok';
  return isErr
    ? `<div class="notice" role="alert" aria-live="assertive">${esc(state.notice.text)}</div>`
    : `<div class="notice notice--ok" role="status" aria-live="polite">${esc(state.notice.text)}</div>`;
}

// Zahlen-Eingabe mit +/- Buttons daneben, für kurze/eingeschränkte Wertebereiche
// (z.B. Anzahl Stufen) — spart das Eintippen. Ändert direkt das Input-Element und
// feuert ein 'change'-Event (siehe stepper-inc/-dec im Klick-Handler), damit ein
// evtl. daran hängender bestehender Change-Listener (z.B. für die Label-Stufenzahl)
// weiterhin greift.
function stepperInput(id, value, min, max, disabled, extraAttrs = '') {
  return `
    <div class="stepper-row">
      <button type="button" class="stepper-btn" data-action="stepper-dec" data-target="${id}" ${disabled ? 'disabled' : ''} aria-label="${esc(t('ariaLabel.decrease'))}">−</button>
      <input type="number" id="${id}" min="${min}" max="${max}" value="${value}" ${extraAttrs} ${disabled ? 'disabled' : ''} />
      <button type="button" class="stepper-btn" data-action="stepper-inc" data-target="${id}" ${disabled ? 'disabled' : ''} aria-label="${esc(t('ariaLabel.increase'))}">+</button>
    </div>
  `;
}

// --- Datenzugriff --------------------------------------------------------
async function loadEntries() {
  const { data, error } = await supabase.from('habit_entries').select('entry_date, data');
  if (error) {
    state.notice = { type: 'error', text: t('notice.loadEntriesError') + translateDbError(error.message) };
    return;
  }
  const map = {};
  for (const row of data) {
    try {
      map[row.entry_date] = row.data ? await decryptData(currentDek, row.data) : {};
    } catch {
      // Sollte nach der einmaligen Migration nicht mehr vorkommen; defensiv statt
      // die ganze App an einer kaputten/fremden Zeile scheitern zu lassen.
      map[row.entry_date] = {};
    }
  }
  state.entries = map;
}

async function loadHabits() {
  const { data, error } = await supabase.from('habit_definitions').select('*').order('sort_order');
  if (error) {
    state.notice = { type: 'error', text: t('notice.loadHabitsError') + translateDbError(error.message) };
    return;

  state.habits = data.map(habitFromRow);
}

async function loadUserSettings() {

  if (error) {

  }
  state.userSettings = {

    onboardingCompleted: data ? data.onboarding_completed : true,

}

async function saveDefaultReminderMinute(minutes) {
  state.userSettings = { ...state.userSettings, defaultReminderMinute: minutes };
  // Re-rendert das Zeit-Feld sofort mit dem tatsächlich gespeicherten (ggf. auf
  // 15-Minuten-Schritte gerundeten) Wert – sonst zeigte das Eingabefeld weiter den
  // ungerundeten, eingetippten Wert an, obwohl im Hintergrund längst gerundet wurde.

    render();
