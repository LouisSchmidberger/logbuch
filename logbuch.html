<!DOCTYPE html>

<meta charset="UTF-8" />
<!-- Content-Security-Policy: der Browser führt nur Skripte aus diesem Verzeichnis aus
     (kein eingeschleuster Inline-Code, keine fremden Server) und die App darf Daten nur an
     das eigene Supabase-Projekt schicken. Zweite Verteidigungslinie hinter esc()/t(): käme
     doch einmal HTML aus Nutzereingaben ungefiltert ins DOM, liefe darin trotzdem kein
     Code, und Passwort/Schlüssel könnten nirgendwohin abfließen. 'unsafe-inline' nur für
     Styles (style="..." wird an vielen Stellen gesetzt). Neue externe Quellen (Server,
     CDN, Schriften) müssen hier ergänzt werden, sonst blockt der Browser sie. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'self' https://qdadoqcnqmrauhshvcts.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<!-- interactive-widget=resizes-content: die Bildschirmtastatur verkleinert auf Android den
     Layout-Viewport statt ihn nur zu überdecken - dadurch halten Browser und
     ensureNoteEditorVisible() Eingabefelder zuverlässig über der Tastatur (iOS ignoriert
     das Attribut, dort bleibt die visualViewport-Rechnung zuständig). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

  :root {
    --paper: #eae7df;
    --ink: #24261f;
    --line: #c7c1b2;
    --moss: #4b6b4f;
    --rust: #a2503a;
    --sand: #665e4f; /* Nebentext: 5,2:1 auf --paper, 4,7:1 auf getönten Flächen (Gruppen in "Heute", Erklär-Kästen) - heller war es dort unter 4,5:1 */
    --surface: #eae7df;
    --popover-bg: #f4f1e9;
    --input-bg: #ffffff;
    --shadow: rgba(0, 0, 0, 0.15);
    --scrim: rgba(0, 0, 0, 0.45);
    --rust-rgb: 162, 80, 58;
    --moss-rgb: 75, 107, 79;
    /* scoreColor() liefert theme-unabhängig immer dieselben Mittelton-Farben (siehe
       JS) – Text darauf braucht deshalb eine feste, helle Farbe statt --ink/--paper,
       die sich sonst im Dark Mode mitverdunkeln und unlesbar würden. */
    --on-score: #f5f3ee;
  }
  /* Dunkles Farbschema: folgt automatisch prefers-color-scheme, außer ein
     manueller Override (data-theme) sagt etwas anderes. Beide Regeln setzen
     exakt dieselben Werte, nur der Auslöser unterscheidet sich. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1e1c17;
      --ink: #ece7da;
      --line: #4a453a;
      --moss: #7fa583;
      --rust: #d3785d;
      --sand: #a89f8c;
      --surface: #29261f;
      --popover-bg: #343025;
      --input-bg: #2c2920;
      --rust-rgb: 211, 120, 93;
      --moss-rgb: 127, 165, 131;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1e1c17;
    --ink: #ece7da;
    --line: #4a453a;
    --moss: #7fa583;
    --rust: #d3785d;
    --sand: #a89f8c;
    --surface: #29261f;
    --popover-bg: #343025;
    --input-bg: #2c2920;
    --rust-rgb: 211, 120, 93;
    --moss-rgb: 127, 165, 131;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Für Screenreader vorhandener, aber visuell ausgeblendeter Text (z.B. die
     Graph-Zusammenfassung) — Standard-Clip-Technik statt display:none, damit der
     Inhalt weiterhin vorgelesen wird. */
  /* Safari auf iOS/iPadOS zoomt beim Antippen jedes Eingabefelds mit weniger als 16px
     Schrift automatisch heran - und danach nie wieder heraus. Deshalb dort alle
     Eingabefelder auf 16px (@supports -webkit-touch-callout trifft nur Apples WebKit auf
     Touch-Geräten, Android/Desktop behalten die kleinere Schrift). Bewusst NICHT über
     maximum-scale=1 im Viewport gelöst: das sperrt auf Android auch das Zoomen mit zwei
     Fingern, für Menschen mit Sehschwäche ein echter Rückschritt. !important, weil die
     einzelnen Felder ihre Schriftgröße über spezifischere Selektoren setzen. */
  @supports (-webkit-touch-callout: none) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea {
      font-size: 1rem !important; /* = 16px bei Normalgröße, wächst mit der Textgröße */
    }
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  /* Textgröße (Menü → "Textgröße", pro Gerät, siehe applyTextSize): alle Schriftgrößen
     und die Maße von Bedienelementen mit Text stehen in rem und hängen damit nur an dieser
     einen Grundgröße. 100% = die Grundgröße des Browsers (meist 16px). */
  html { font-size: 100%; }
  :root[data-text-size="small"] { font-size: 87.5%; }
  :root[data-text-size="large"] { font-size: 112.5%; }
  :root[data-text-size="xlarge"] { font-size: 125%; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden; /* Sicherheitsnetz: nichts soll je die ganze Seite breiter machen */
  }
  #app {
    max-width: 30rem; /* = 480px bei Normalgröße, wächst mit der Textgröße mit */
    margin: 0 auto;
    padding: 20px 18px 40px;
  }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .header h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 1.5rem; margin: 0; }
  .subpage-header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  /* Lange Titel brechen um statt mit "…" gekürzt zu werden: bei sehr großer Schrift blieb
     sonst nur "Feld bea…" übrig. */
  .subpage-header-title h1 { font-size: 1.3125rem; line-height: 1.3; padding: 2px 0; overflow-wrap: break-word; hyphens: auto; min-width: 0; outline: none; }
  /* Trennlinie + etwas mehr Innenabstand unten, da hier (anders als bei den Tabs, die
     ihre eigene Trennlinie mitbringen) nichts anderes den unteren Rand der Fläche
     markiert. Die SVG-Chevron statt eines "←"-Zeichens zentriert sich unabhängig von
     Font-Metriken zuverlässig exakt. */
  .subpage-header { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px; }
  .back-btn {
    background: var(--ink); border: none; border-radius: 50%; width: 2rem; height: 2rem;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--paper);
    cursor: pointer;
  }

  /* Header + Tab-Leiste bzw. Unterseiten-Header bleiben beim Scrollen oben fixiert
     (Menü/Zurück/Tab-Wechsel immer erreichbar) und bekommen dieselbe abgesetzte Fläche
     (eigene Hintergrundfarbe, full-bleed über die seitliche #app-Polsterung hinweg via
     negativer Margins) statt nur die Unterseiten - einheitlicher als "nur manche
     Ansichten sehen anders aus". Die Trennlinie am unteren Rand kommt je nach Kontext
     von .tabs oder .subpage-header selbst (siehe dort), .sticky-top braucht keine
     eigene - Kindelement-Margins kollabieren sonst nicht sauber nach außen. */
  .sticky-top {
    position: sticky; top: 0; z-index: 6; background: var(--surface);
    margin: -20px -18px 0; padding: 14px 18px 0;
  }
  /* Wenig Höhe (Handy im Querformat, starke Vergrößerung): angepinnt nähmen Kopf und
     Tab-Leiste - mit geöffneter Tastatur erst recht - fast den ganzen Bildschirm ein.
     Dann scrollen sie normal mit. Die Ausrichtung bewusst NICHT sperren (WCAG 1.3.4, z.B.
     fest montierte Geräte). JS, das mit der Kopfhöhe rechnet: stickyHeaderBottom(). */
  @media (max-height: 500px) {
    .sticky-top { position: static; }
  }

  .header-menu-wrap { position: relative; }
  /* ☰ mit dem Wort "Menü" daneben - nicht jede Person erkennt die drei Striche. */
  .menu-btn {
    background: none; border: 1px solid var(--sand); border-radius: 999px; height: 2rem; padding: 0 0.75rem;
    display: flex; align-items: center; justify-content: center; gap: 0.375rem; color: var(--ink); cursor: pointer;
    font-family: inherit; font-size: 0.9375rem; white-space: nowrap; flex-shrink: 0;
  }
  .menu-panel {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; width: min(16rem, calc(100vw - 36px));
    max-height: calc(100vh - 54px); overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--popover-bg); border: 1px solid var(--ink); border-radius: 4px; padding: 14px;
    box-shadow: 0 12px 32px var(--shadow);
  }
  /* Einstellungen (renderSettings): Abschnitte mit Überschrift, jede Einstellung eine
     Zeile mit Erklärung direkt darunter. */
  .settings-section { margin: 0; }
  /* Symbol vor Menüpunkten und Abschnitts-Überschriften (wie im Onboarding). */
  .item-icon { display: inline-block; width: 1.6em; flex-shrink: 0; font-style: normal; }
  /* Eigene Symbole (ICONS in logbuch.js): Linie in Textfarbe, Flächen leicht in Moos. In em,
     damit sie mit der Schrift ihres Orts mitwachsen (Menü, große Onboarding-Symbole). */
  .icon { width: 1.2em; height: 1.2em; vertical-align: -0.22em; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .icon .f { fill: rgba(var(--moss-rgb), 0.42); }
  .onb-icon .icon, .onb-promise-icon .icon, .spare-key-method-icon .icon { width: 1em; height: 1em; vertical-align: top; }
  .settings-section .push-row { margin: 0.5rem 0 0; }
  .settings-row { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; padding: 0.875rem 0; border-bottom: 1px solid var(--line); font-size: 0.9375rem; }
  .settings-row > label:not(.checkbox-field), .settings-label { color: var(--ink); font-weight: 600; }
  .settings-note { font-size: 0.875rem; line-height: 1.45; color: var(--sand); margin: 0; }
  /* Uhrzeit als Knopf (Uhrzeit-Felder in "Heute", Erinnerungszeiten), öffnet die Uhrzeit-Auswahl. */
  .time-pick {
    font-family: inherit; font-size: 1rem; font-variant-numeric: tabular-nums; white-space: nowrap;
    min-width: 4.5rem; min-height: 2.5rem; padding: 0.375rem 0.625rem; border: 1px solid var(--sand);
    border-radius: 0.1875rem; background: var(--input-bg); color: var(--ink); cursor: pointer;
  }
  .time-pick:disabled { opacity: 0.4; cursor: default; }
  .time-pick--empty, .time-pick-day { color: var(--sand); }
  /* Uhrzeit-Auswahl (openTimePicker): <dialog> außerhalb von #app, sieht aus wie .modal-box. */
  .time-picker {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 0.375rem;
    padding: 1.125rem; width: calc(100% - 2.5rem); max-width: 21.25rem; max-height: calc(100% - 2.5rem); overflow-y: auto;
  }
  .time-picker::backdrop { background: var(--scrim, rgba(0, 0, 0, 0.45)); }
  html:has(.time-picker[open]) { overflow: hidden; }
  .time-picker h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 1.1875rem; margin: 0 0 0.625rem; overflow-wrap: anywhere; }
  /* Drehräder (Stunde : Minute): drei Zeilen hoch, die mittlere ist der Wert; das Band dahinter
     markiert sie, oben und unten blassen die Nachbarn aus. */
  .tp-clock { --tp-item: 2.75rem; position: relative; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin: 0.25rem 0 0.875rem; }
  .tp-clock::before {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: var(--tp-item); transform: translateY(-50%);
    border: 1px solid var(--line); border-radius: 0.375rem; background: var(--input-bg); pointer-events: none;
  }
  .tp-wheel {
    position: relative; width: 4.5rem; height: calc(var(--tp-item) * 3); overflow: hidden;
    touch-action: none; user-select: none; cursor: grab;
    -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent);
  }
  .tp-wheel:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 0.375rem; }
  /* Jede Zeile liegt auf dem mittleren Platz und wird per transform verschoben (drawWheel). */
  .tp-item {
    position: absolute; left: 0; right: 0; top: var(--tp-item); height: var(--tp-item);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--sand); will-change: transform;
  }
  .tp-item--on { color: var(--ink); font-weight: 600; }
  .tp-sep { position: relative; font-size: 1.5rem; font-weight: 600; }
  .tp-label { display: block; margin-bottom: 0.375rem; }
  .time-picker .pill-group.seg { margin-bottom: 0.875rem; }
  .tp-quick { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 0.875rem; }
  .tp-quick .manage-btn { min-height: 2.75rem; }
  .tp-clear { display: block; margin: 0 0 0.25rem; }
  /* Mehrere Erinnerungszeiten eines Felds: je Zeile Uhrzeit + "Entfernen", darunter "+ Weitere Zeit". */
  .reminder-time-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  /* Zähler: Bedingung unter der Uhrzeit (Raster statt Umbruch - sonst stünde sie bei großer
     Schrift mal neben, mal unter der Zeit); die Linie links hält Zeit und Bedingung zusammen. */
  .reminder-time-row--counter {
    display: grid; grid-template-columns: auto 1fr; grid-template-areas: "time remove" "below below";
    gap: 0.5rem 0.75rem; padding-left: 0.75rem; border-left: 2px solid var(--line); margin-bottom: 0.875rem;
  }
  .reminder-time-row--counter .time-pick { grid-area: time; justify-self: start; }
  .reminder-time-row--counter .reminder-below { grid-area: below; }
  .reminder-time-row--counter .manage-btn { grid-area: remove; justify-self: start; }
  .reminder-time-add { align-self: flex-start; margin: 0.25rem 0 0.5rem; }
  /* Spam-Rückmeldung auf der Seite nach dem Bestätigungslink: leise Frage, zwei gleichwertige Antworten. */
  .spam-feedback { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0.75rem 0; margin: 0 0 1rem; }
  .spam-feedback-q { margin: 0 0 0.5rem; font-size: 0.9375rem; color: var(--ink); }
  .spam-feedback-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.25rem; }
  .reminder-below { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9375rem; color: var(--ink); white-space: nowrap; }
  .auth-field .reminder-below input:not([type="checkbox"]) { width: 4.5rem; }
  .settings-row select {
    font-family: inherit; font-size: 1rem; padding: 0.5rem 0.625rem; border: 1px solid var(--sand);
    border-radius: 3px; background: var(--input-bg); color: var(--ink);
  }
  /* Ohne Weiß (--input-bg): in den Einstellungen sahen die Knöpfe sonst wie Eingabefelder aus. */
  .settings-row .menu-item-btn { align-self: stretch; background: transparent; text-align: center; }
  .settings-row--buttons { flex-direction: row; flex-wrap: wrap; gap: 0.5rem; border-bottom: none; }
  .settings-row--buttons .menu-item-btn { flex: 1 1 10rem; text-align: center; }
  .menu-item-btn {
    font-family: inherit; font-size: 0.9375rem; padding: 0.625rem 0.75rem; border: 1px solid var(--sand);
    border-radius: 3px; background: var(--input-bg); color: var(--ink); cursor: pointer; text-align: left;
  }
  .menu-item-btn:hover, .menu-item-btn:focus-visible { background: rgba(var(--moss-rgb), 0.14); border-color: var(--moss); }
  /* Rost-Knöpfe: --danger (Löschen, Zurücksetzen) voller Rand, --warn (Archivieren,
     reversibel) als Mittelding mit leichter Tönung. Ränder mind. 3:1, Text mind. 4,5:1 –
     auf der Tönung reicht --rust pur hell nicht (4,2:1), daher etwas zur Schrift gemischt. */
  .menu-item-btn--danger { color: var(--rust); border-color: var(--rust); }
  .menu-item-btn--danger:hover, .menu-item-btn--danger:focus-visible { background: rgba(var(--rust-rgb), 0.12); border-color: var(--rust); }
  .menu-item-btn--warn { color: color-mix(in srgb, var(--rust) 85%, var(--ink)); border-color: rgba(var(--rust-rgb), 0.85); background: rgba(var(--rust-rgb), 0.06); }
  .menu-item-btn--warn:hover, .menu-item-btn--warn:focus-visible { background: rgba(var(--rust-rgb), 0.12); border-color: var(--rust); }

  /* overflow-y + margin: auto: passt der Dialog, steht er mittig; ist er höher als der
     Bildschirm (Querformat mit Tastatur, starke Vergrößerung), lässt er sich scrollen,
     statt oben und unten abgeschnitten zu werden - sonst wären seine Buttons unerreichbar. */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--scrim); z-index: 50;
    display: flex; justify-content: center; padding: 20px; overflow-y: auto; overscroll-behavior: contain;
  }
  /* Solange ein Dialog offen ist, scrollt nur er, nicht die Seite dahinter (passte der Dialog
     auf den Bildschirm, reichte der Browser das Wischen sonst an die Seite weiter). */
  html:has(.modal-overlay) { overflow: hidden; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px; max-width: 340px; width: 100%; margin: auto;
  }
  .delete-account-email { overflow-wrap: anywhere; }
  .modal-box h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 1.1875rem; margin: 0 0 10px; }
  .modal-box p { font-size: 0.9375rem; line-height: 1.45; margin: 0 0 14px; }
  /* Aktion in Bestätigungs-Dialogen: so groß wie "Abbrechen" und gefüllt wie "Abmelden",
     statt der kleinen Pille aus "Felder verwalten". --paper auf --rust: 4,5:1 hell, 5,4:1 dunkel. */
  .modal-box .habit-form-actions .manage-btn--danger {
    flex: 1; font-size: 1rem; font-weight: 600; padding: 0.625rem; border-radius: 3px;
    background: var(--rust); color: var(--paper);
  }
  .modal-box .habit-form-actions .manage-btn--danger:disabled { opacity: 0.6; cursor: default; }

  .push-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.875rem; color: var(--ink); background: rgba(var(--moss-rgb), 0.08); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; margin-bottom: 16px; }
  .push-row--blocked { flex-direction: column; align-items: stretch; gap: 0.5rem; background: rgba(var(--rust-rgb), 0.08); }
  .push-blocked { font-size: 0.875rem; line-height: 1.5; }
  .push-blocked p { margin: 0 0 0.5rem; }
  .push-row--muted { color: var(--sand); background: transparent; }
  .push-toggle {
    flex-shrink: 0; background: none; border: 1px solid var(--sand); border-radius: 999px; color: var(--ink);
    font-family: inherit; font-size: 0.875rem; cursor: pointer; padding: 0.375rem 0.75rem;
  }

  .install-hint {
    display: flex; align-items: flex-start; gap: 8px; font-size: 0.875rem; line-height: 1.4; color: var(--ink);
    background: rgba(var(--rust-rgb), 0.08); border: 1px solid rgba(var(--rust-rgb), 0.3); border-radius: 3px;
    padding: 8px 10px; margin-bottom: 16px;
  }
  .install-hint span { flex: 1; }
  /* "Zeig mir, wie" unter dem Hinweistext: umrandeter Knopf wie die übrigen Nebenaktionen. */
  .install-hint-show {
    display: block; margin-top: 8px; background: none; border: 1px solid var(--sand); border-radius: 999px;
    color: var(--ink); font-family: inherit; font-size: 0.875rem; cursor: pointer; padding: 0.375rem 0.875rem;
  }
  .install-hint-close {
    position: relative; background: none; border: none; color: var(--sand); font-size: 1.25rem; line-height: 1; cursor: pointer;
    padding: 0 2px; flex-shrink: 0;
  }

  /* Abstand schrumpft auf schmalen Handys mit (vw), damit alle fünf Tabs auch bei großer
     Schrift sichtbar bleiben - die Leiste ist zwar wischbar, das sieht aber niemand. */
  .tabs {
    display: flex; gap: min(0.875rem, 2.5vw); border-bottom: 1px solid var(--line); margin-bottom: 20px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; padding: 6px 0 10px; font-family: inherit; font-size: 1rem;
    color: var(--sand); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab--active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

  .day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; position: relative; }
  /* Tageskopf von "Heute" im angehefteten Kopf (renderTodayDayNav): Linie darunter statt über
     der Tab-Leiste allein, sonst liefe der Inhalt ohne Kante darunter durch. */
  .sticky-top > .tabs:has(+ .day-nav) { margin-bottom: 10px; }
  .sticky-top > .day-nav { margin-bottom: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .sticky-top + .install-hint, .sticky-top + .view-body { margin-top: 0; }
  .nav-btn {
    background: none; border: 1px solid var(--sand); border-radius: 50%; width: 1.875rem; height: 1.875rem;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 1.0625rem;
  }
  .nav-btn:disabled, .nav-btn[aria-disabled="true"] { opacity: 0.35; cursor: default; }
  .day-label { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .day-weekday { font-family: 'Fraunces', serif; font-size: 1.1875rem; font-weight: 600; position: relative; }
  /* ⋮ zum Tag (renderDayMenuPanel): links vor dem Wochentag wie bei den Feldern, aber
     außerhalb des Textflusses, damit Wochentag und Datum mittig bleiben. */
  .day-weekday > .row-menu-btn { position: absolute; right: calc(100% + 2px); top: 50%; transform: translateY(-50%); }
  /* Doppelte Klasse: .row-menu steht weiter unten und setzte sonst left: 0 zurück. */
  .row-menu.day-menu { top: calc(100% + 4px); left: 50%; transform: translateX(-50%); }
  .day-relative { color: var(--moss); font-weight: 600; }
  /* Rutsch-Animation beim Zeitraum-Wechsel (siehe shiftPeriod/renderApp). Ohne
     fill-mode: danach bleibt keine Verschiebung am Element hängen (die würde z.B. das
     Zeilen-Menü falsch positionieren). */
  @keyframes view-slide-next { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes view-slide-prev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes view-fade { from { opacity: 0.35; } to { opacity: 1; } }
  .view-slide-next { animation: view-slide-next 0.22s ease-out; }
  .view-slide-prev { animation: view-slide-prev 0.22s ease-out; }
  /* "Bewegung reduzieren": nur kurzes Einblenden, keine Bewegung. */
  @media (prefers-reduced-motion: reduce) {
    .view-slide-next, .view-slide-prev { animation: view-fade 0.15s ease-out; }
  }
  /* Menüs, Dialoge, Notiz-Editor erscheinen sanft (.layer-in setzt markNewLayers nur beim
     ersten Auftauchen): wachsen aus ihrem Auslöser heraus (transform-origin), Dialoge aus
     der Mitte. Über `translate`/`scale` statt `transform`, damit vorhandene transforms
     (z.B. .row-menu.day-menu) bleiben; ohne fill-mode bleibt danach nichts hängen. Erste,
     zu zurückhaltende Werte (0,16 s, 6 px, kein Wachsen) fielen am Handy nicht auf. */
  @keyframes layer-in { from { opacity: 0; translate: 0 -0.5rem; scale: 0.92; } }
  @keyframes layer-pop { from { opacity: 0; scale: 0.9; } }
  @keyframes layer-fade { from { opacity: 0; } }
  .layer-in:not(.modal-overlay) { animation: layer-in 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.15); }
  .menu-panel.layer-in { transform-origin: top right; }
  .row-menu.layer-in { transform-origin: top left; }
  .row-menu.day-menu.layer-in { transform-origin: top center; }
  .note-editor.layer-in { transform-origin: top center; }
  .modal-overlay.layer-in { animation: layer-fade 0.22s ease-out; }
  .modal-overlay.layer-in .modal-box { animation: layer-pop 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.15); }
  @media (prefers-reduced-motion: reduce) {
    .layer-in:not(.modal-overlay), .modal-overlay.layer-in .modal-box { animation-name: layer-fade; }
  }
  /* Rückmeldung beim Antippen: Knopf drückt sofort ein und federt danach zurück (Übergang
     nur beim Loslassen - ein kurzer Tipp ist sonst vorbei, bevor man etwas sieht). Bei
     "Bewegung reduzieren" nur kurz blasser. */
  :is(button, [role="button"], .crisis-action-button) { transition: scale 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
  :is(button, [role="button"], .crisis-action-button):not(:disabled):active { scale: 0.94; transition-duration: 0s; }
  @media (prefers-reduced-motion: reduce) {
    :is(button, [role="button"], .crisis-action-button):not(:disabled):active { scale: none; opacity: 0.7; }
  }
  .day-date { font-size: 0.875rem; color: var(--sand); }
  /* Datum = Datumsauswahl (renderTodayDayNav): gepunktet unterstrichen als Hinweis, dass man
     es antippen kann; das unsichtbare Datumsfeld deckt es ab und reicht nach unten etwas
     über den Text hinaus (Tippfläche mind. 24px, nach oben nicht - dort sitzt das ⋮). */
  .day-date-pick {
    position: relative; cursor: pointer;
    text-decoration: underline dotted; text-underline-offset: 0.2em; text-decoration-thickness: 1px;
  }
  .day-date-input {
    position: absolute; top: 0; bottom: -0.5rem; left: 0; width: 100%; height: auto;
    margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer;
  }
  .day-date-pick:has(.day-date-input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }

  .today-jump {
    display: block; margin: 12px auto 14px; background: none; border: 1px solid var(--sand); border-radius: 999px;
    color: var(--ink); font-family: inherit; font-size: 0.875rem; cursor: pointer; padding: 0.375rem 0.875rem;
  }

  .habit-list { display: flex; flex-direction: column; }
  .habit-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .habit-row:first-child, .number-box:first-child { border-top: 1px solid var(--line); }
  .habit-name { font-size: 0.9375rem; line-height: 1.35; flex: 1; min-width: 0; }
  /* Wert-Buttons: sichtbar 2rem, die unsichtbare Tippfläche (::after) reicht bis in die
     halbe Lücke zum Nachbarn (~40px, ohne Überlappung). Passen sie nicht in eine Zeile,
     brechen sie um - jede Stufe muss sichtbar und antippbar bleiben (verworfen: seitlich
     wischbar, das sah niemand - Stufe 3 und 4 langer Bezeichnungen waren einfach weg). */
  .habit-options { display: flex; flex-wrap: wrap; gap: 0.5rem; min-width: 0; max-width: 60%; }
  /* Button-Zeilen in "Heute": Buttons neben dem Namen, solange Name (mind. 40 %) und
     Buttons nebeneinander passen - sonst rutschen sie rechtsbündig in eine eigene Zeile
     darunter (und brechen dort bei Bedarf weiter um). */
  .habit-row--buttons > .row-head { flex: 1 1 40%; }
  .habit-row--buttons > .habit-options { flex: 0 1 auto; max-width: 100%; margin-left: auto; justify-content: flex-end; }

  /* Zähler (renderCounterBox): "−" Zahl "+", Tippflächen 44px; "+" als Hauptaktion in Grün. */
  /* "Was ist neu" (renderWhatsNew) und Neuigkeiten in "Über Logbuch". */
  .whats-new-list { margin: 0.5rem 0 1rem; padding-left: 1.25rem; line-height: 1.5; }
  .whats-new-list li { margin-bottom: 0.4rem; }
  .whats-new-date { font-size: 0.9375rem; margin: 0.75rem 0 0; color: var(--sand); font-weight: 600; }
  .counter-controls { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .counter-btn {
    width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 1px solid var(--sand); background: transparent;
    color: var(--ink); font-family: inherit; font-size: 1.375rem; line-height: 1; cursor: pointer; touch-action: manipulation;
  }
  .counter-btn:disabled { opacity: 0.4; cursor: default; }
  .counter-btn--plus { border-color: var(--moss); color: var(--moss); font-weight: 600; }
  .counter-value { min-width: 2.5rem; text-align: center; font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* Ziel hinter dem Wert ("1 / 2", goalSuffixHtml): klein und in Nebentext-Farbe, damit der
     gefärbte Wert die Hauptsache bleibt. */
  .counter-value--goal { min-width: 3.75rem; white-space: nowrap; }
  .goal-suffix { font-size: 0.875rem; font-weight: 400; color: var(--sand); margin-left: 0.25rem; white-space: nowrap; }
  .opt-btn {
    position: relative; font-family: inherit; font-size: 0.875rem; width: 2rem; height: 2rem; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--sand); background: transparent; color: var(--ink); cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, scale 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.4); /* scale: siehe Rückmeldung beim Antippen */
  }
  .opt-btn--text {
    width: auto; min-width: 2rem; height: 2rem; border-radius: 999px; padding: 0 10px;
    white-space: nowrap;
  }
  .opt-btn--selected { color: var(--on-score); }
  .opt-btn::after { content: ''; position: absolute; inset: -0.25rem; }

  /* "Noch offen" (siehe isOpenToday): Punkt hinter dem Namen, Form statt Farbe als
     Unterscheidung (Punkt da oder nicht). Moos wie die übrigen Akzente, nicht Rost -
     soll nicht nach Fehler/Warnung aussehen. */
  .open-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--moss);
    margin-left: 6px; vertical-align: middle;
  }
  /* Ende von "Heute" in drei Teilen: Abschluss der Liste ("Alles eingetragen", direkt
     unter dem letzten Feld), der Tag ("nicht geplant", Tagesnotiz) und eine Fußleiste mit
     Trennlinie für das, was nicht zum Tag gehört ("+ Neues Feld", umrandet wie "+ Neue
     Gruppe" in der Verwaltung). Alles linksbündig wie die Felder. */
  /* Einmalige Karte(n) nach dem Einrichten (renderTodayIntro). */
  .today-intro {
    margin: 0 0 1rem; padding: 0.875rem; border-radius: 6px; border: 1px solid var(--moss);
    background: rgba(var(--moss-rgb), 0.09); font-size: 0.9375rem; line-height: 1.5;
  }
  .today-intro p { margin: 0 0 0.625rem; }
  .today-intro-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.75rem; }
  .today-intro-count { font-size: 0.875rem; color: var(--sand); }
  .day-status { min-height: 1.15rem; font-size: 0.8125rem; font-weight: 600; color: var(--sand); margin-top: 1px; }
  .day-status-done { color: color-mix(in srgb, var(--moss) 85%, var(--ink)); }
  .today-footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }

  /* Zahlenwert- und Text-Felder sind normale Zeilen wie alle anderen (Trennlinie statt
     eigenem Kasten). Nur das Eingabefeld selbst ist umrandet. */
  .number-box {
    padding: 11px 0; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .number-box .number-last { display: block; font-size: 0.8125rem; color: var(--sand); margin-top: 2px; }
  .number-input {
    width: 72px; font-family: inherit; font-size: 1rem; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink);
  }
  .number-input[style*="color"] { font-weight: 600; } /* Wert mit Ziel: gefärbt wie beim Zähler */
  .number-box .goal-suffix { margin-left: -0.25rem; }

  .habit-row--slider { flex-direction: column; align-items: stretch; gap: 6px; }
  .slider-row { display: flex; align-items: center; gap: 10px; width: 100%; }
  /* Feste statt min-width, sonst wird der Regler bei langen Bezeichnungen als Wert
     sichtbar schmaler (der Wertetext wächst, .value-slider hat flex:1 und muss dafür
     Platz abgeben) - fühlte sich beim Ziehen wie eine Verzerrung an. Lange Texte werden
     stattdessen abgeschnitten (…), der volle Text bleibt im Datenmodell erhalten. */
  .slider-value {
    font-size: 0.875rem; color: var(--sand); width: 70px; text-align: right; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slider-clear {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--sand); font-size: 0.9375rem; line-height: 1; cursor: pointer;
  }
  /* Ohne Wert: unsichtbarer Platzhalter in exakt derselben Größe statt gar nichts - sonst
     würde der Regler beim ersten Eintragen um die Breite des × schmaler (gleicher Grund
     wie die feste Breite von .slider-value oben). */
  .slider-clear--placeholder { visibility: hidden; }

  /* Eigens gestylter Regler statt native OS-Optik (wirkte "klobig") — die farbige
     Füllung kommt über einen Gradient auf dem Track, gesteuert durch --slider-color/
     --slider-pct (siehe renderHabitSlider/input-Listener in logbuch.html). Bewusst
     NICHT über accent-color, das bei jedem Live-Update in manchen Browsern kurz
     glitchte, statt sauber mitzuziehen. */
  /* touch-action: pan-y - senkrechtes Wischen, das auf dem Regler beginnt, scrollt die
     Seite, statt einen Wert zu setzen (siehe pointercancel-Listener in logbuch.js). */
  .value-slider {
    flex: 1; -webkit-appearance: none; appearance: none; background: transparent;
    height: 22px; cursor: pointer; --slider-color: var(--moss); --slider-pct: 50%;
    touch-action: pan-y;
  }
  .value-slider--unset { --slider-color: var(--sand); }
  /* Linie um den halben Knopf (8px) eingerückt: der Knopf bleibt ganz innerhalb des Reglers,
     seine Mitte erreicht die Enden also nie - ohne Einrückung stand er an beiden Anschlägen
     sichtbar vor dem Linienende. --slider-pct (0-100%) bezieht sich so genau auf den Weg der
     Knopfmitte. */
  .value-slider::-webkit-slider-runnable-track {
    height: 4px;
    background: linear-gradient(to right, var(--slider-color) 0%, var(--slider-color) var(--slider-pct), var(--line) var(--slider-pct), var(--line) 100%)
      center / calc(100% - 16px) 100% no-repeat;
  }
  .value-slider::-moz-range-track { height: 4px; background: linear-gradient(var(--line), var(--line)) center / calc(100% - 16px) 100% no-repeat; }
  .value-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--slider-color); }
  .value-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -6px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }
  .value-slider::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }

  .habit-row--computed .computed-readout {
    font-size: 0.875rem; font-weight: 600; padding: 3px 9px; border-radius: 12px; color: var(--on-score);
  }
  .habit-row--computed { flex-wrap: wrap; }
  .habit-row--computed .manage-meta { flex-basis: 100%; }

  /* Zeilen-Menü in "Heute" (siehe renderRowMenuButton). touch-callout/user-select
     verhindern, dass iOS/Android beim Long-Press auf die Zeile stattdessen Textauswahl
     oder ein eigenes Kontextmenü zeigen. */
  .habit-row, .number-box, .section-head { position: relative; -webkit-touch-callout: none; }
  .row-head, .section-head { -webkit-user-select: none; user-select: none; }
  /* Kopf einer Zeile: ⋮-Button + Name (bei Zahlenwert-Feldern darunter der letzte Wert).
     Der Button ragt etwas nach links in den Rand, damit die Namen nur wenig einrücken. */
  .row-head { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; margin-left: -8px; }
  .row-head-text { flex: 1; min-width: 0; }
  /* In untereinander gestapelten Zeilen (Schieberegler, Text) keine Höhe verteilen. */
  .habit-row--slider > .row-head, .text-box > .row-head { flex: none; }
  .row-menu-btn {
    flex-shrink: 0; width: 24px; height: 32px; display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0; background: none; border: none; border-radius: 3px; color: var(--sand); cursor: pointer;
  }
  .row-menu-btn svg { fill: currentColor; }
  /* Kleine Symbol-Knöpfe: sichtbar kompakt, Tippfläche (::after) mindestens 2.75rem (44px,
     Apple-Empfehlung). Prozent beziehen sich auf den Knopf selbst. Beim ⋮ nur senkrecht
     erweitert - daneben steht der Name, der dasselbe Menü öffnet. */
  .nav-btn, .menu-btn, .back-btn, .row-menu-btn, .stepper-btn { position: relative; }
  .nav-btn::after, .menu-btn::after, .back-btn::after, .stepper-btn::after, .install-hint-close::after {
    content: ''; position: absolute;
    top: min(0px, calc((100% - 2.75rem) / 2)); bottom: min(0px, calc((100% - 2.75rem) / 2));
    left: min(0px, calc((100% - 2.75rem) / 2)); right: min(0px, calc((100% - 2.75rem) / 2));
  }
  .row-menu-btn::after { content: ''; position: absolute; left: 0; right: 0; top: calc((100% - 2.75rem) / 2); bottom: calc((100% - 2.75rem) / 2); }
  .manage-btn::after { content: ''; position: absolute; left: 0; right: 0; top: min(0px, calc((100% - 2.75rem) / 2)); bottom: min(0px, calc((100% - 2.75rem) / 2)); }
  .row-menu-btn:hover, .row-menu-btn[aria-expanded="true"] { color: var(--ink); }
  /* Der Name öffnet per Zeige-Gerät dasselbe Menü (Abkürzung, kein eigenes
     Bedienelement für Tastatur/Screenreader). Offen: dezent unterstrichen, damit
     sichtbar bleibt, zu welcher Zeile das Menü gehört. */
  .row-menu-name { cursor: pointer; }
  .row-menu-name--open { text-decoration: underline; text-decoration-color: var(--sand); text-underline-offset: 3px; }
  .row-menu {
    position: absolute; top: calc(100% - 4px); left: 0; z-index: 5; min-width: 11rem;
    display: flex; flex-direction: column; gap: 6px; padding: 10px;
    background: var(--popover-bg); border: 1px solid var(--ink); border-radius: 4px;
    box-shadow: 0 12px 32px var(--shadow);
  }
  /* Übersichten (statsFieldName): Lage setzt positionFloatingRowMenu; über dem angehefteten Kopf. */
  .row-menu.row-menu--floating { position: fixed; z-index: 7; font-size: 1rem; text-align: left; }
  /* Feldname als Menü-Auslöser, sieht aus wie der Name selbst. */
  .stats-name-btn {
    background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit;
    text-align: inherit; cursor: pointer; overflow-wrap: inherit; hyphens: inherit;
  }

  /* Notizen (siehe renderNote). flex-wrap + width: 100% lassen Notiz/Editor in eine
     eigene Zeile unter Name und Eingabe umbrechen - Name (flex-basis 0) und Buttons
     (max-width 60%) bzw. Zahlen-Eingabe passen weiterhin zusammen in die erste Zeile. */
  .habit-row, .number-box { flex-wrap: wrap; }
  .row-note {
    width: 100%; text-align: left; font: inherit; font-size: 0.875rem; font-style: italic; line-height: 1.45;
    color: var(--ink); background: none; border: none; border-left: 2px solid var(--line);
    padding: 1px 0 1px 8px; margin: 0; cursor: pointer; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .row-note:hover, .row-note:focus-visible { border-left-color: var(--moss); }
  .note-editor { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .note-input {
    box-sizing: border-box; width: 100%; font-family: inherit; font-size: 1rem; line-height: 1.45;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--input-bg); color: var(--ink); resize: vertical;
  }
  .note-editor-actions { display: flex; gap: 8px; }
  .note-save-btn {
    flex: 1; font-family: inherit; font-size: 0.9375rem; font-weight: 600; padding: 10px;
    border: none; border-radius: 3px; background: var(--moss); color: var(--paper); cursor: pointer;
  }
  .day-note { margin-top: 16px; }
  .day-note-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 1rem; margin: 0 0 6px; }
  .day-note-add {
    display: block; width: 100%; box-sizing: border-box; text-align: left; font-family: inherit; font-size: 0.9375rem;
    color: var(--sand); padding: 10px 12px; background: none; border: 1px dashed var(--line); border-radius: 4px; cursor: pointer;
  }
  .day-note-add:hover, .day-note-add:focus-visible { border-color: var(--moss); color: var(--ink); }
  /* Punkt für "hier gibt es eine Notiz" in Woche (Feld-Zelle bzw. Wochentag = irgendeine
     Notiz an dem Tag) und Monat. Ink mit Papier-Ring, damit er auf jeder Zellfarbe inkl.
     Streifenmuster sichtbar bleibt. Im Monat unten statt oben, dort steht die Tageszahl. */
  .grid-cell.has-note, .month-cell.has-note, .grid-col-header.has-note { position: relative; }
  .has-note::after {
    content: ''; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 0 1.5px var(--paper);
  }
  .month-cell.has-note::after { top: auto; bottom: 3px; right: 3px; }
  /* Wochentag: unter der Tageszahl, in der Lücke zur ersten Zeile - oben rechts lag er bei
     schmalen Spalten (großer Schrift) auf dem Wochentag. */
  .grid-col-header.has-note::after { top: 100%; right: auto; left: 50%; transform: translateX(-50%); }

  .member-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .member-check { font-size: 0.9375rem; }
  .member-check--blocked { opacity: 0.45; }
  /* Berechnetes Zahlen-Feld: Wert ohne Bewertung - neutral statt eingefärbt. */
  .habit-row--computed .computed-readout--number { color: var(--ink); border: 1px solid var(--line); background: transparent; }

  .number-chart-box { padding: 10px 0; border-bottom: 1px solid var(--line); }
  /* Reicht der Platz nicht für Name und Kennzahlen, rutschen die Kennzahlen in eine eigene
     Zeile (min-width: auto = der Name schrumpft nicht unter sein längstes Wort). */
  .number-chart-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 8px; margin-bottom: 6px; }
  .number-chart-head .habit-name { min-width: auto; }
  /* Darf umbrechen: mit langem Namen und Einheit ("Ziel: mindestens 8 Gläser à 2") wurde
     die Seite sonst breiter als der Bildschirm. */
  .number-chart-meta { font-size: 0.8125rem; color: var(--sand); min-width: 0; }
  .number-chart-svg { display: block; width: 100%; height: 56px; }
  .number-chart-plot { position: relative; }

  /* Wiederholung: eingeklappter Bereich "Heute nicht geplant" (renderToday), Zellen an
     nicht geplanten Tagen in der Woche (schraffiert statt leer, damit "nicht dran"
     nicht wie "vergessen" aussieht), Formular-Bausteine. */
  .unplanned { margin-top: 14px; }
  .unplanned > summary { font-size: 0.875rem; color: var(--sand); cursor: pointer; padding: 6px 0; }
  .unplanned > .habit-list { margin-top: 6px; }
  /* Die Zellfarbe kommt inline als background-color (bewusst NICHT die Kurzschreibweise
     "background:", die setzte auch diese Schraffur wieder zurück). */
  .grid-cell--unplanned {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, var(--sand) 0, var(--sand) 1px, transparent 1px, transparent 5px);
  }
  /* Runde Buttons wie die Stufen-Buttons in "Heute", verteilt über höchstens 310px -
     bleibt auch auf schmalen Handys einzeilig (Abstände schrumpfen dann), ohne sich auf
     breiten Bildschirmen übertrieben weit zu verteilen. */
  /* Sieben Tage immer in einer Zeile: die Kreise schrumpfen mit der Breite (große Schrift,
     schmale Handys) statt umzubrechen. */
  .weekday-group { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 0.25rem; width: min(100%, 20rem); margin-top: 6px; }
  .weekday-group .weekday-toggle {
    flex: 1 1 0; min-width: 0; max-width: 2.5rem; aspect-ratio: 1; height: auto; padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .schedule-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 0.9375rem; }
  .auth-field .schedule-inline select, .auth-field .schedule-inline input:not([type="checkbox"]) { width: auto; }
  .auth-field .schedule-inline input[type="number"] { width: 72px; }
  .schedule-inline label, .schedule-inline span { font-size: 0.9375rem; color: var(--ink); }
  /* Kalender-Symbol im Datumsfeld ("Alle paar Tage"): Chrome malt es immer schwarz - im
     dunklen Schema hell machen (color-scheme bewusst nicht gesetzt, das änderte alle
     nativen Bedienelemente). */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .schedule-start::-webkit-calendar-picker-indicator { filter: invert(1); } }
  :root[data-theme="dark"] .schedule-start::-webkit-calendar-picker-indicator { filter: invert(1); }
  /* Kurzes Aufleuchten des Feldes nach einem Sprung aus der Auswertung (focusTodayField). */
  /* Hervorhebung nach einem Sprung (Feld in "Heute", Eintrag im Menü): erst eine Weile
     voll sichtbar, dann ausblenden - sonst ging sie leicht unter. */
  @keyframes field-highlight {
    0%, 45% { background-color: rgba(var(--moss-rgb), 0.35); }
    100% { background-color: transparent; }
  }
  .field-highlight { animation: field-highlight 2.8s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .field-highlight { animation-duration: 0.01s; animation-delay: 2.4s; background-color: rgba(var(--moss-rgb), 0.35); }
  }

  /* Text-Felder (kind='text', siehe renderTextBox): Textfeld unter dem Namen statt
     daneben wie bei der Zahlen-Eingabe. field-sizing: content lässt es mit dem Text
     mitwachsen (wo unterstützt, sonst rows="2" + manuell vergrößerbar). */
  .text-box { flex-direction: column; align-items: stretch; gap: 8px; }
  .text-field-input {
    box-sizing: border-box; width: 100%; font-family: inherit; font-size: 1rem; line-height: 1.45;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--input-bg); color: var(--ink); resize: vertical;
    field-sizing: content; min-height: 3.6em; max-height: 50vh;
  }
  /* Rückblick-Listen (siehe renderTextReviews) - gleiche Abstände wie die Zahlen-Graphen. */
  .text-review { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .text-review-title { font-size: 0.9375rem; font-weight: 400; line-height: 1.35; margin: 0; }
  summary.text-review-title { cursor: pointer; }
  .text-review-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .text-review-entry {
    display: flex; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink);
    background: none; border: none; border-radius: 3px; padding: 6px 4px; cursor: pointer;
  }
  .text-review-entry:hover, .text-review-entry:focus-visible { background: rgba(var(--moss-rgb), 0.10); }
  .text-review-date { flex-shrink: 0; width: 78px; font-size: 0.8125rem; color: var(--sand); padding-top: 2px; }
  .text-review-text { font-size: 0.9375rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Ring um Datenpunkte mit Notiz (siehe renderNumberChart) - gleiche Idee wie der
     Notiz-Punkt in Woche/Monat. */
  .number-chart-note {
    position: absolute; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%);
    border: 1.5px solid var(--ink); box-sizing: border-box; pointer-events: none;
  }
  .number-chart-hit {
    position: absolute; top: 0; bottom: 0; cursor: pointer; border-radius: 2px;
  }
  .number-chart-hit:hover, .number-chart-hit:active { background: rgba(var(--moss-rgb), 0.14); }

  .grid-scroll { overflow-x: auto; }
  /* Feldnamen bekommen gut ein Drittel der Breite, die Tageskästchen teilen sich den Rest -
     vorher brachen die Namen in einer schmalen Spalte mitten im Wort um. Umbruch an
     Silbengrenzen (hyphens, Sprache aus <html lang>), mitten im Wort nur als Notlösung. */
  .grid-row { display: grid; grid-template-columns: minmax(0, 35%) repeat(7, minmax(0, 1fr)) minmax(2.25rem, 2.5rem); align-items: center; gap: 1px; }
  .grid-row--header { padding-bottom: 6px; }
  /* Zeilen besser auseinanderhalten: Trennlinie + jede zweite Zeile leicht getönt (Ton
     statt Schraffur - schraffiert sind schon die nicht geplanten Tage, und das
     Streifenmuster kodiert die Bewertung). Gezählt nur über Feld-Zeilen, je Behälter. */
  .grid-scroll .grid-row:not(.grid-row--header) { border-bottom: 1px solid var(--line); padding: 2px 0; }
  .grid-scroll .grid-row:nth-child(even of .grid-row:not(.grid-row--header)) { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .grid-label { font-size: 0.75rem; padding-right: 3px; line-height: 1.2; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
  .grid-col-header { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: var(--sand); cursor: pointer; }
  /* Zweistellige Tage stoßen bei großer Schrift auf schmalen Handys fast aneinander ("1011") -
     gleich breite, leicht enger gesetzte Ziffern halten sie auseinander. */
  .grid-col-date { font-size: 0.8125rem; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.06em; }
  .grid-col-header--avg { font-family: 'Fraunces', serif; font-style: italic; color: var(--ink); cursor: default; }
  .grid-cell { height: 1.5rem; margin: 1px; border-radius: 2px; border: 1px solid var(--line); cursor: pointer; }
  .grid-cell--blank { border-color: transparent; }
  /* Mehrfachauswahl (multiWeekRows): Kopfzeile mit der Zahl gewählter Optionen, Unterzeilen je
     Option eingerückt; deren Ø-Zelle (grid-cell--plain, unten) ohne Score-Farbe, in normaler Schrift. */
  .grid-cell--count { display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .grid-scroll .grid-label--sub { padding-left: 0.75rem; color: color-mix(in srgb, var(--ink) 80%, var(--paper)); }
  .grid-scroll .section-content .grid-label--sub { padding-left: 1.8125rem; }
  .grid-cell--avg { display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--on-score); font-weight: 600; cursor: default; }
  /* Ø-Zelle als Knopf (Antippen zeigt den Wert ausgeschrieben, siehe habitAvgLong). */
  button.grid-cell--avg { font-family: inherit; padding: 0; cursor: pointer; font-variant-numeric: tabular-nums; }
  .grid-cell--avg.grid-cell--plain { color: var(--ink); font-weight: 400; background: transparent; }
  /* Mini-Skala (avgMiniScale): Linie über ~3/4 der Zelle, Punkt an der Stelle des Ø, in
     Feldrichtung. In der Textfarbe (Woche: textOnScore der Zelle, Listen: Farbe des Werts). */
  .avg-scale { position: relative; width: 70%; height: 2px; border-radius: 1px; background: color-mix(in srgb, currentColor 55%, transparent); }
  .avg-scale--inline { display: inline-block; width: 3rem; vertical-align: middle; margin-right: 0.5rem; }
  .avg-scale-dot { position: absolute; top: 50%; width: 0.5rem; height: 0.5rem; margin: -0.25rem 0 0 -0.25rem; border-radius: 50%; background: currentColor; }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
  .month-weekday { font-size: 0.8125rem; color: var(--sand); text-align: center; padding-bottom: 4px; }
  .month-cell { aspect-ratio: 1; border-radius: 3px; border: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px; cursor: pointer; }
  .month-cell--empty { border: none; cursor: default; }
  /* Auf gefärbten Zellen setzt renderMonth Schrift (textOnScore, Weiß/Schwarz je Zellfarbe -
     --ink lag dort bei nur 2,7-3,5:1) und ein Schild in der Zellfarbe: auf einem dunklen
     Streifen des Musters fiel auch Schwarz auf 4:1. */
  .month-cell-num { font-size: 0.75rem; color: var(--ink); padding: 0 0.125rem; border-radius: 2px; }

  .stats-empty {
    display: flex; align-items: flex-start; gap: 0.25rem; padding: 1rem; margin: 0.5rem 0 1.25rem;
    border: 1px dashed var(--sand); border-radius: 4px; font-size: 0.9375rem; line-height: 1.5;
  }
  /* Erklärung in der Optik der übrigen Erklär-Kästen (.why-box) - als schlichte Zeile sah
     sie aus wie ein weiterer Eintrag der Auswertung (z.B. die Text-Felder darunter). */
  .why-box.stats-legend { margin: 1rem 0 1.25rem; } /* doppelte Klasse: .why-box steht weiter unten und gewönne sonst */
  .why-box.stats-legend p { margin: 0.5rem 0 0; }
  .stats-legend-scale { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.375rem; font-size: 0.8125rem; color: var(--ink); } /* --sand hätte auf dem getönten Kasten hell nur 4,3:1 */
  .stats-legend-bar { flex: 1; height: 0.75rem; border-radius: 2px; }
  .month-stats { border-top: 1px solid var(--line); padding-top: 8px; }
  .month-stat-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 0.875rem; }
  /* Langer Wert bricht rechtsbündig um, statt den Namen zu überdecken (.habit-name hat
     sonst min-width: 0 und würde unter seine Textbreite schrumpfen). */
  .month-stat-row .habit-name { min-width: auto; }
  .month-stat-value { font-weight: 600; text-align: right; }
  .month-stat-count { font-weight: 400; color: var(--sand); }
  .month-stat-row--sub { padding-left: 1rem; font-size: 0.8125rem; }
  /* Mehrfachauswahl in "Heute": "nichts davon" gestrichelt, damit es nicht wie eine Option aussieht. */
  .opt-btn--none:not(.opt-btn--selected) { border-style: dashed; color: color-mix(in srgb, var(--ink) 75%, var(--paper)); }
  /* Optionen im Feld-Formular: Eingabefeld + Knopf (× bzw. Aus-/Einblenden) je Zeile. */
  .multi-option-list { list-style: none; margin: 0 0 0.5rem; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .multi-option-row { display: flex; gap: 0.5rem; align-items: center; }
  .multi-option-row input { flex: 1; min-width: 0; }
  .multi-option-row--hidden input { opacity: 0.6; }

  .year-grid { display: flex; flex-direction: column; gap: 3px; margin-bottom: 20px; }
  .year-month { display: flex; align-items: center; gap: 6px; }
  .year-month-label { width: 2.25rem; font-size: 0.75rem; color: var(--sand); flex-shrink: 0; }
  .year-month-grid { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; flex: 1; }
  .year-day-cell { aspect-ratio: 1; border-radius: 1px; min-width: 0; cursor: pointer; }

  .notice {
    font-size: 0.875rem; padding: 8px 10px; border-radius: 3px; margin-bottom: 14px;
    background: rgba(var(--rust-rgb), 0.12); color: var(--rust); border: 1px solid rgba(var(--rust-rgb), 0.3);
  }
  .notice--ok { background: rgba(var(--moss-rgb), 0.12); color: color-mix(in srgb, var(--moss) 85%, var(--ink)); border-color: rgba(var(--moss-rgb), 0.3); } /* --moss pur: 4,15:1 auf der Tönung */
  /* Meldungen unten am Rand (syncToast). Ohne Pointer-Events im leeren Bereich, damit
     der darunterliegende Inhalt bedienbar bleibt; solange einer da ist, bekommt #app unten
     mehr Platz, damit er nichts dauerhaft verdeckt (z.B. "Speichern"). */
  #toast-root {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; pointer-events: none;
    display: flex; justify-content: center; padding: 0 16px calc(16px + env(safe-area-inset-bottom));
  }
  .has-toast #app { padding-bottom: 9rem; }
  .toast {
    pointer-events: auto; width: 100%; max-width: 30rem; box-sizing: border-box;
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 12px 14px;
    background: var(--ink); color: var(--paper); border-radius: 6px; box-shadow: 0 8px 24px var(--shadow);
    font-size: 0.9375rem; line-height: 1.4;
  }
  /* Weiß auf Rost (~5,6:1); im dunklen Modus ist Rost heller, dort dunkle Schrift. */
  .toast--error { background: var(--rust); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast--error { color: var(--paper); } }
  :root[data-theme="dark"] .toast--error { color: var(--paper); }
  .toast-body { flex: 1; min-width: 0; }
  .toast-text { margin: 0; }
  .toast-details summary { cursor: pointer; font-size: 0.8125rem; margin-top: 6px; text-decoration: underline; }
  .toast-details p { font-size: 0.8125rem; margin: 4px 0 0; overflow-wrap: anywhere; }
  .toast-action {
    flex-shrink: 0; align-self: center; background: none; border: 1px solid currentColor; border-radius: 999px;
    color: inherit; font-family: inherit; font-size: 0.875rem; font-weight: 600; padding: 0.375rem 0.75rem; cursor: pointer;
  }
  .toast-close {
    position: relative; flex-shrink: 0; background: none; border: none; color: inherit;
    font-size: 1.25rem; line-height: 1; padding: 0 2px; cursor: pointer;
  }
  .toast-close::after { content: ''; position: absolute; inset: -12px; }
  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: toast-in 0.2s ease-out; }
  }
  @keyframes toast-in { from { transform: translateY(12px); opacity: 0; } }
  .loading { font-size: 0.9375rem; color: var(--sand); padding: 40px 0; text-align: center; }
  /* Startbildschirm beim Öffnen (renderStartupScreen; dieselbe Box steht schon im
     statischen HTML, damit nichts springt). Der Hinweis auf langsames Laden blendet erst
     nach der im style gesetzten Verzögerung ein. */
  .startup { text-align: center; }
  .startup-slow { opacity: 0; visibility: hidden; animation: startup-reveal 0.4s ease forwards; } /* hidden: Screenreader lesen ihn auch erst dann */
  @keyframes startup-reveal { to { opacity: 1; visibility: visible; } }

  .auth-box { max-width: 20rem; margin: 60px auto; }
  .auth-box h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 1.625rem; margin: 0 0 4px; text-align: center; }
  .auth-box p.sub { font-size: 0.875rem; color: var(--sand); text-align: center; margin: 0 0 24px; }
  .tutorial-text { font-size: 0.9375rem; line-height: 1.5; margin: 0 0 16px; }
  /* Tutorial-Bausteine (siehe tutorialScreen); "Warum?"-Kasten als wiedererkennbares
     Element für Begründungen. */
  .onb-icon { font-size: 2.5rem; line-height: 1; text-align: center; margin: 0 0 10px; }
  .onb h1 { margin-bottom: 16px; outline: none; }
  .onb .tutorial-text strong { font-weight: 600; }
  .onb-center { text-align: center; }
  .onb-nav {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .onb-nav-btn {
    font-family: inherit; font-size: 0.9375rem; color: var(--ink); background: none; border: 1px solid var(--sand);
    border-radius: 999px; padding: 0.5rem 0.875rem; cursor: pointer;
  }
  /* Farbe bewusst --ink: der blasse Sandton erreicht bei 13px nur ~3:1 Kontrast. Nebensache
     zeigen hier Position, Trennlinie und Größe. */
  .onb-nav-btn:hover, .onb-nav-btn:focus-visible { border-color: var(--ink); }
  /* Kurze Hinweise im Tutorial: bewusst normale Schriftfarbe statt des blassen Sandtons
     der Formular-Hinweise - hier stehen Dinge, die man wirklich lesen soll. */
  .onb-hint { font-size: 0.875rem; line-height: 1.45; color: var(--ink); margin: 0 0 10px; }
  .onb-hint--after { margin: 6px 0 0; }
  /* Aufklappbares "Warum?" (Anmelde-Seiten) - die Begründung steht bereit, ohne den
     Hauptsatz zu verdrängen. */
  .why-details { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.5; }
  .why-details summary { cursor: pointer; font-weight: 600; padding: 0.25rem 0; }
  .why-details p { margin: 0.25rem 0 0; color: var(--sand); }
  .auth-box > .why-details { margin-bottom: 1rem; } /* Entsperren: sonst klebt "Passwort" am Text */
  .password-count { margin: 4px 0 0; font-size: 0.875rem; color: var(--ink); }
  .password-count--ok { color: var(--moss); font-weight: 600; }
  .auth-password-hint { margin: 4px 0 0; }
  .why-box {
    margin: 0 0 18px; padding: 10px 12px; border-left: 3px solid var(--moss); border-radius: 4px;
    background: rgba(var(--moss-rgb), 0.09); font-size: 0.9375rem; line-height: 1.5;
  }
  .why-box p { margin: 0; }
  .why-box .why-box-title { font-weight: 600; cursor: pointer; }
  .why-box[open] .why-box-title { margin-bottom: 4px; }
  /* Fortschritt über das ganze Einrichten (onbProgress): Etappen als Leiste + Text. */
  .onb-progress { margin: 0 0 1.25rem; }
  .onb-progress-bar { display: flex; gap: 4px; }
  .onb-progress-seg { flex: 1; height: 6px; border-radius: 3px; border: 1px solid var(--sand); box-sizing: border-box; }
  .onb-progress-seg--done { background: var(--sand); }
  .onb-progress-seg--current { background: var(--moss); border-color: var(--moss); }
  .onb-substeps { display: flex; justify-content: center; gap: 5px; margin-top: 0.375rem; }
  .onb-substep { width: 7px; height: 7px; border-radius: 4px; border: 1.5px solid var(--sand); box-sizing: border-box; }
  .onb-substep--done { background: var(--sand); }
  .onb-substep--current { width: 18px; background: var(--moss); border-color: var(--moss); }
  .unlock-account { text-align: center; margin: -12px 0 16px; overflow-wrap: anywhere; }
  .onb-progress-label { margin: 0.5rem 0 0; font-size: 0.875rem; text-align: center; color: var(--ink); }
  /* Installations-Skizzen (sketchHtml): vereinfachte Handy-Ansicht, Hervorhebung in Moos. */
  .install-steps li > span { display: block; }
  /* Installieren-Knopf vorhanden: Anleitung von Hand nur als Ausweichweg, zugeklappt. */
  .install-fallback { margin-top: 1.25rem; }
  /* Android-Browser ohne echte Installation (otherBrowserBox): Link sieht aus wie ein Knopf. */
  .install-chrome-link { box-sizing: border-box; text-decoration: none; }
  .install-sketch { display: block; width: 100%; max-width: 12rem; margin: 0.25rem auto 0.5rem; color: var(--ink); }
  .sk-frame { fill: var(--paper); stroke: currentColor; stroke-width: 2; }
  .sk-line { fill: color-mix(in srgb, var(--ink) 18%, transparent); }
  .sk-bar { fill: color-mix(in srgb, var(--ink) 10%, transparent); }
  .sk-sheet { fill: var(--popover-bg); stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 1; }
  .sk-appicon { fill: var(--moss); }
  .sk-text { fill: currentColor; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; }
  .sk-icon path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .sk-dot { fill: currentColor; }
  .sk-hl--maybe { stroke-dasharray: 4 3; }
  .sk-sep { stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 1; }
  .sk-hl { fill: rgba(var(--moss-rgb), 0.15); stroke: var(--moss); stroke-width: 3; }
  .onb-overview { list-style: none; counter-reset: onb; padding: 0; margin: 0 0 1rem; display: flex; flex-direction: column; gap: 0.75rem; font-size: 1rem; line-height: 1.4; }
  .onb-overview li { counter-increment: onb; display: flex; align-items: flex-start; }
  .onb-overview li::before { content: counter(onb) "."; font-weight: 600; min-width: 1.5em; }
  .onb .recovery-key-code { margin-top: 4px; }
  .onb .habit-form-actions { margin-bottom: 18px; }
  .onb-steps { margin: 0 0 18px; padding-left: 22px; font-size: 0.9375rem; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; }
  .onb-inline-icon { vertical-align: -4px; color: var(--ink); }
  .onb-promises { list-style: none; padding: 0; margin: 0 0 24px; display: flex; flex-direction: column; gap: 12px; }
  .onb-promises li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9375rem; line-height: 1.5; }
  .onb-promise-icon { font-size: 1.25rem; line-height: 1.3; flex-shrink: 0; }
  .auth-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .auth-field label { font-size: 0.875rem; color: var(--sand); }
  .auth-field input:not([type="checkbox"]), .auth-field select {
    font-family: inherit; font-size: 1rem; padding: 9px 10px; border: 1px solid var(--sand);
    border-radius: 3px; background: var(--input-bg); color: var(--ink); width: 100%;
  }
  .auth-field-label-row { display: flex; align-items: center; justify-content: space-between; }
  .input-clear-wrap { position: relative; }
  .input-clear-wrap input { padding-right: 30px; }
  .input-clear-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--sand); font-size: 1.1875rem; line-height: 1;
    cursor: pointer; padding: 6px;
  }
  .auth-submit {
    width: 100%; padding: 10px; margin-top: 8px; font-family: inherit; font-size: 1rem; font-weight: 600;
    background: var(--ink); color: var(--paper); border: none; border-radius: 3px; cursor: pointer;
  }
  .auth-submit:disabled { background: var(--sand); cursor: default; }
  /* Hilfe "Keine Mail da?" nach der Registrierung (renderConfirmEmailHelp). Normale
     Schriftfarbe statt Sand - das hier soll man wirklich lesen. */
  .confirm-help { margin: 0 0 20px; padding: 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 0.9375rem; line-height: 1.45; }
  .confirm-help p { margin: 0 0 10px; overflow-wrap: anywhere; }
  .confirm-help .confirm-help-status { margin: 8px 0 0; color: var(--moss); }
  /* Startseite vor dem Anmelden (renderAuthWelcome). */
  .auth-welcome-lead { text-align: center; font-size: 1.0625rem; margin: 8px 0 28px; }
  .auth-box .auth-choice { margin-top: 0; padding: 14px; font-size: 1.0625rem; } /* .auth-box: gegen .manage-new-btn weiter unten */
  /* Gleichwertige Antworten (choiceCard): gleich aussehende Karten, Erklärung im Knopf.
     Rahmen in --ink (weit über 3:1), damit beide klar als antippbar erkennbar sind. */
  .onb-choice {
    display: block; width: 100%; margin: 0 0 1rem; padding: 1rem; text-align: center;
    background: var(--input-bg); color: var(--ink); border: 0.125rem solid var(--ink); border-radius: 0.25rem;
    font-family: inherit; cursor: pointer;
  }
  .onb-choice-title { display: block; font-size: 1.0625rem; font-weight: 600; }
  .onb-choice-note { display: block; margin-top: 0.375rem; font-size: 0.9375rem; line-height: 1.45; }
  .auth-email-hint { margin: 0.375rem 0 0; }
  .auth-back { margin-bottom: 8px; }
  .inline-icon { display: inline-block; vertical-align: -0.15em; margin: 0 0.1em; }
  /* Einführung: Zurück links, "Aa Anzeige" rechts in einer Zeile (addOnbDisplayBar). */
  .onb-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .onb-topbar .auth-back { margin-bottom: 0; }
  .onb-display-btn {
    position: relative; display: inline-flex; align-items: center; gap: 0.375rem; background: none; border: 1px solid var(--sand);
    border-radius: 999px; color: var(--ink); font-family: inherit; font-size: 0.875rem; cursor: pointer; padding: 0.375rem 0.875rem;
  }
  .onb-display-btn[aria-expanded="true"] { border-color: var(--ink); }
  .onb-display-btn-icon { font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.9375rem; }
  .onb-display-btn-icon span { font-size: 1.2em; }
  .onb-display { display: flex; flex-direction: column; gap: 6px; margin: 0 0 18px; }
  .onb-display--welcome { margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
  .onb-display-title { font-size: 0.9375rem; font-weight: 600; margin: 0 0 4px; }
  .onb-display-label { font-size: 0.875rem; color: var(--sand); margin-top: 4px; }
  /* Nebenaktion unter einer Hauptaktion (Passwort vergessen, Lieber nicht, im Browser
     bleiben ...): umrandeter Knopf statt unterstrichenem Text - Links wurden von wenig
     erfahrenen Menschen nicht als antippbar erkannt. Unterstrichen bleibt nur, was mitten
     im Fließtext steht (.link-btn). */
  .auth-toggle {
    display: block; width: 100%; margin: 12px 0 0; padding: 0.75rem; background: none;
    border: 1px solid var(--sand); border-radius: 4px; color: var(--ink);
    font-family: inherit; font-size: 1rem; cursor: pointer; text-align: center;
  }

  .manage-list { display: flex; flex-direction: column; margin-bottom: 18px; }
  /* Passen Name (mind. 8rem) und Knöpfe nicht nebeneinander, rutschen die Knöpfe
     rechtsbündig in eine eigene Zeile darunter - wie die Wert-Buttons in "Heute". Vorher
     überlappten sich Name und Knöpfe auf schmalen Handys bzw. bei großer Schrift. */
  .manage-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px;
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .manage-row:first-child { border-top: 1px solid var(--line); }
  .manage-row--archived { opacity: 0.55; }
  .manage-row--confirm-delete { opacity: 1; flex-wrap: wrap; }
  .manage-row--dragging { position: relative; z-index: 5; background: var(--surface); box-shadow: 0 4px 10px var(--shadow); }
  .manage-info { display: flex; flex-direction: column; gap: 2px; flex: 1 1 8rem; min-width: 0; }
  .manage-name { font-size: 0.9375rem; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
  .manage-meta { font-size: 0.8125rem; color: var(--sand); }
  .manage-delete-warning { font-size: 0.8125rem; color: var(--rust); }
  .manage-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .drag-handle {
    position: relative; display: flex; flex-direction: column; justify-content: center; gap: 3px; width: 16px; height: 22px;
    flex-shrink: 0; cursor: grab; touch-action: none;
  }
  /* Unsichtbar größere Tippfläche - der sichtbare Griff ist für einen Finger zu klein
     (verfehlt = gar nichts passiert, da er das Scrollen bewusst blockiert). Vor allem
     nach oben/unten und links in den Seitenrand; rechts nur knapp, damit sie nicht mit
     den ↑↓-Buttons daneben (eigene erweiterte Fläche, siehe .move-btn::after)
     überlappt. */
  .drag-handle::after { content: ''; position: absolute; top: -8px; bottom: -8px; left: -14px; right: -4px; }
  .drag-handle span { display: block; width: 12px; height: 2px; background: var(--sand); border-radius: 1px; }
  /* Tastatur-/Tipp-Alternative zum Drag-Handle (der rein per Pointer-Events
     funktioniert) — nebeneinander statt gestapelt, damit sie nicht die
     Zeilenhöhe treiben; mit spürbarem Abstand zueinander und einem unsichtbar
     über den sichtbaren Rand hinausragenden Treffer-Bereich (::after), damit
     auch ungenaues Antippen zuverlässig den richtigen der beiden Buttons
     trifft statt zu "verzugestopft" zu wirken. */
  .move-buttons { display: flex; flex-direction: row; gap: 0.5rem; flex-shrink: 0; }
  .move-btn {
    position: relative; font-family: inherit; font-size: 0.8125rem; line-height: 1; width: 1.75rem; height: 1.75rem;
    border: 1px solid var(--sand); border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer;
  }
  .move-btn::after { content: ''; position: absolute; left: -0.25rem; right: -0.25rem; top: calc((100% - 2.75rem) / 2); bottom: calc((100% - 2.75rem) / 2); }
  .move-btn:disabled { opacity: 0.3; cursor: default; }
  .manage-btn {
    position: relative; font-family: inherit; font-size: 0.8125rem; padding: 0.4375rem 0.75rem; border-radius: 999px;
    border: 1px solid var(--sand); background: transparent; color: var(--ink); cursor: pointer;
  }
  /* Wie .menu-item-btn--danger/--warn (Begründung dort). */
  .manage-btn--danger { color: var(--rust); border-color: var(--rust); }
  .manage-btn--warn { color: color-mix(in srgb, var(--rust) 85%, var(--ink)); border-color: rgba(var(--rust-rgb), 0.85); background: rgba(var(--rust-rgb), 0.06); }
  .manage-new-btn {
    display: block; width: 100%; margin-top: 4px; padding: 11px; font-family: inherit; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 4px; background: var(--moss); color: var(--paper); cursor: pointer;
  }
  /* "+ Neues Feld" bleibt die primäre Aktion, "+ Neue Gruppe" daneben als zweite. */
  .manage-new-row { display: flex; gap: 8px; margin-top: 4px; }
  /* Gruppen (intern "sections", siehe layoutBlocks): Verwaltung - Kopfzeile + eingerückte Felder. */
  .manage-section { border-bottom: 1px solid var(--line); }
  .manage-section-head { border-bottom: none; }
  .manage-section-name { font-weight: 600; }
  .manage-section-children { margin: 0 0 8px 20px; }
  .manage-section-children .manage-row:last-child { border-bottom: none; }
  .manage-section-empty { margin: 4px 0 6px; }
  .manage-inline-check { font-size: 0.875rem; margin-top: 4px; }
  .manage-section--drag-collapsed .manage-section-children { display: none; }
  /* Einklappbare Gruppen-Überschrift ("Heute" und Auswertung). */
  .section-toggle {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; cursor: pointer;
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 1.1875rem; color: var(--ink);
    background: none; border: none; border-bottom: 1px solid var(--line); padding: 12px 0 6px;
  }
  .section-chevron { flex-shrink: 0; color: var(--ink); transition: transform 0.15s ease; }
  .section-toggle[aria-expanded="true"] .section-chevron { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .section-chevron { transition: none; } }
  .section-block--stats > .section-toggle { font-size: 0.9375rem; padding-top: 10px; }
  /* Gruppe "nicht einklappbar": reine Überschrift, kein Knopf. */
  .section-toggle--static { cursor: default; }
  /* "✓ erledigt" hinter dem Namen einer zugeklappten Gruppe - in der Schrift des Fließtexts,
     damit es als Status und nicht als Teil des Namens gelesen wird. */
  .section-done {
    margin-left: 0.5rem; font-family: 'IBM Plex Sans', sans-serif; font-style: normal;
    font-size: 0.8125rem; font-weight: 600; color: color-mix(in srgb, var(--moss) 85%, var(--ink)); /* --moss pur: 4,4:1 auf der Gruppen-Fläche */
  }
  /* "Heute": ⋮-Button links neben der Überschrift, die Linie trägt dann der Kopf. */
  .section-head { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-top: 6px; }
  .section-head > .row-menu-btn { margin-left: -8px; }
  /* Notiz zur Gruppe (bzw. ihr Editor) direkt unter der Überschrift, auf Höhe des Pfeils. */
  .section-block > .row-note, .section-block > .note-editor { margin: 8px 0 6px 16px; width: calc(100% - 16px); }
  .section-head .section-toggle { flex: 1; min-width: 0; border-bottom: none; padding: 6px 0; }
  /* Inhalt einer aufgeklappten Gruppe eingerückt (wie in der Verwaltung), damit sichtbar
     ist, was dazugehört - bewusst ohne senkrechte Linie links, die wirkte überladen. Im
     Wochen-Raster nur der Feldname: eine eingerückte ganze Zeile würde die Tageskästchen
     gegen die Wochentag-Köpfe verschieben. */
  .section-content { padding-left: 19px; }
  /* In "Heute" ist jede Gruppe ein leicht getönter Block (Nutzer-Entscheidung 2026-10-10):
     zeigt, wo sie endet - auch bei zwei Gruppen direkt nacheinander, die sonst ineinander
     verschwammen. Ragt links/rechts etwas über die Spalte hinaus, damit der Inhalt seine
     volle Breite behält (sonst brachen Wert-Knöpfe um). Nicht in der Auswertung: dort
     stehen Gruppen in Tabellen, ein Block würde die Spalten stören. Tönung mit --ink 5 % -
     --sand ist darauf abgestimmt (Nebentext >= 4,5:1). */
  .section-block--today {
    background: color-mix(in srgb, var(--ink) 5%, transparent); border-radius: 6px;
    padding: 0 10px; margin: 10px -10px 14px;
  }
  .section-block--today > .section-content > :last-child { border-bottom: none; }
  .section-block--today.section-block--collapsed > .section-head { border-bottom: none; }
  /* Zeitraum-Bereich (renderPeriodBlock): der Datumsbereich als Zusatz, nicht als Teil des Titels. */
  /* Zeitraum-Felder in der Auswertung (renderPeriodStats): Überschrift wie eine Gruppe. */
  .period-stats { margin-top: 1.25rem; }
  .period-stats-title {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 1.1875rem;
    margin: 0; padding-bottom: 6px; /* Linie darunter kommt von der Liste (.month-stats) */
  }
  .month-stat-row--text { flex-wrap: wrap; }
  .period-text-value { flex-basis: 100%; margin: 0.25rem 0 0; color: var(--ink); }
  .period-range { font-family: 'IBM Plex Sans', sans-serif; font-style: normal; font-weight: 400; font-size: 0.9375rem; color: var(--sand); } /* nichts darunter - die Linie säße am Blockrand */
  .grid-scroll .section-content { padding-left: 0; }
  /* Die Gruppen-Überschrift hat schon eine Linie unten - sonst doppelt mit der oberen Linie der ersten Zeile. */
  .section-content > .habit-row:first-child, .section-content > .number-box:first-child { border-top: none; }
  .grid-scroll .section-content .grid-label { padding-left: 17px; }
  .manage-new-row .manage-new-btn { flex: 1; }
  .manage-new-btn--secondary { background: transparent; color: var(--moss); border: 1px solid var(--moss); }
  .manage-tag {
    display: inline-block; font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--sand);
  }
  .feedback-form textarea {
    font-family: inherit; font-size: 1rem; line-height: 1.5; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink); width: 100%; min-height: 180px; resize: vertical;
  }
  .feedback-intro { margin-bottom: 14px; }
  .feedback-form .habit-form-lock-note { margin: 0 0 14px; }
  .link-btn {
    font-family: inherit; font-size: inherit; padding: 0; border: none; background: none; color: var(--moss);
    text-decoration: underline; cursor: pointer; font-style: normal; font-weight: 600;
  }
  .link-btn.tip-link {
    display: inline-block; font-size: 0.875rem; font-weight: 500; margin-top: 6px; text-decoration: none; color: var(--ink);
    border: 1px solid var(--sand); border-radius: 999px; padding: 0.375rem 0.875rem;
  }
  .manage-section-divider { border-top: 1px solid var(--line); margin: 22px 0 14px; }
  .manage-section-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 1.0625rem; margin: 0 0 4px; }
  .about-status { font-size: 0.9375rem; line-height: 1.5; color: var(--ink); font-weight: 600; margin: 0 0 10px; }
  .about-status--secondary { font-weight: 400; color: var(--sand); margin: 0 0 10px; }
  .about-intro { font-size: 0.9375rem; line-height: 1.5; color: var(--sand); margin: 0 0 22px; }
  .tip-group summary.manage-section-title { cursor: pointer; margin-bottom: 0; }
  .tip-group[open] summary.manage-section-title { margin-bottom: 12px; }
  .tip { margin-bottom: 16px; }
  .tip:last-child { margin-bottom: 0; }
  .tip-title { font-size: 0.9375rem; font-weight: 600; margin: 0 0 2px; }
  .tip-body { font-size: 0.9375rem; line-height: 1.5; color: var(--sand); margin: 0; }
  .a11y-highlight {
    background: rgba(var(--moss-rgb), 0.08); border: 1px solid rgba(var(--moss-rgb), 0.3);
    border-radius: 6px; padding: 16px; margin-top: 16px;
  }
  .a11y-highlight summary.manage-section-title,
  .mental-health-highlight summary.manage-section-title { cursor: pointer; }
  .a11y-highlight[open] summary.manage-section-title,
  .mental-health-highlight[open] summary.manage-section-title { margin-bottom: 8px; }
