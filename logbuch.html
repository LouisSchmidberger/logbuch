<!DOCTYPE html>

<meta charset="UTF-8" />
<!-- Content-Security-Policy: der Browser führt nur Skripte aus diesem Verzeichnis aus
     (kein eingeschleuster Inline-Code, keine fremden Server) und die App darf Daten nur an
     das eigene Supabase-Projekt schicken. Zweite Verteidigungslinie hinter esc()/t(): käme
     doch einmal HTML aus Nutzereingaben ungefiltert ins DOM, liefe darin trotzdem kein
     Code, und Passwort/Schlüssel könnten nirgendwohin abfließen. 'unsafe-inline' nur für
     Styles (style="..." wird an vielen Stellen gesetzt). Neue externe Quellen (Server,
     CDN, Schriften) müssen hier ergänzt werden, sonst blockt der Browser sie. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'self' https://qdadoqcnqmrauhshvcts.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<!-- interactive-widget=resizes-content: die Bildschirmtastatur verkleinert auf Android den
     Layout-Viewport statt ihn nur zu überdecken - dadurch halten Browser und
     ensureNoteEditorVisible() Eingabefelder zuverlässig über der Tastatur (iOS ignoriert
     das Attribut, dort bleibt die visualViewport-Rechnung zuständig). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

  :root {
    --paper: #eae7df;
    --ink: #24261f;
    --line: #c7c1b2;
    --moss: #4b6b4f;
    --rust: #a2503a;
    --sand: #8c8371;
    --surface: #eae7df;
    --popover-bg: #f4f1e9;
    --input-bg: #ffffff;
    --shadow: rgba(0, 0, 0, 0.15);
    --scrim: rgba(0, 0, 0, 0.45);
    --rust-rgb: 162, 80, 58;
    --moss-rgb: 75, 107, 79;
    /* scoreColor() liefert theme-unabhängig immer dieselben Mittelton-Farben (siehe
       JS) – Text darauf braucht deshalb eine feste, helle Farbe statt --ink/--paper,
       die sich sonst im Dark Mode mitverdunkeln und unlesbar würden. */
    --on-score: #f5f3ee;
  }
  /* Dunkles Farbschema: folgt automatisch prefers-color-scheme, außer ein
     manueller Override (data-theme) sagt etwas anderes. Beide Regeln setzen
     exakt dieselben Werte, nur der Auslöser unterscheidet sich. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1e1c17;
      --ink: #ece7da;
      --line: #4a453a;
      --moss: #7fa583;
      --rust: #d3785d;
      --sand: #a89f8c;
      --surface: #29261f;
      --popover-bg: #343025;
      --input-bg: #2c2920;
      --rust-rgb: 211, 120, 93;
      --moss-rgb: 127, 165, 131;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1e1c17;
    --ink: #ece7da;
    --line: #4a453a;
    --moss: #7fa583;
    --rust: #d3785d;
    --sand: #a89f8c;
    --surface: #29261f;
    --popover-bg: #343025;
    --input-bg: #2c2920;
    --rust-rgb: 211, 120, 93;
    --moss-rgb: 127, 165, 131;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Für Screenreader vorhandener, aber visuell ausgeblendeter Text (z.B. die
     Graph-Zusammenfassung) — Standard-Clip-Technik statt display:none, damit der
     Inhalt weiterhin vorgelesen wird. */
  /* Safari auf iOS/iPadOS zoomt beim Antippen jedes Eingabefelds mit weniger als 16px
     Schrift automatisch heran - und danach nie wieder heraus. Deshalb dort alle
     Eingabefelder auf 16px (@supports -webkit-touch-callout trifft nur Apples WebKit auf
     Touch-Geräten, Android/Desktop behalten die kleinere Schrift). Bewusst NICHT über
     maximum-scale=1 im Viewport gelöst: das sperrt auf Android auch das Zoomen mit zwei
     Fingern, für Menschen mit Sehschwäche ein echter Rückschritt. !important, weil die
     einzelnen Felder ihre Schriftgröße über spezifischere Selektoren setzen. */
  @supports (-webkit-touch-callout: none) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea {
      font-size: 16px !important;
    }
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden; /* Sicherheitsnetz: nichts soll je die ganze Seite breiter machen */
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .header h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 22px; margin: 0; }
  .subpage-header-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  /* line-height/padding großzügig, da "overflow: hidden" (für die "…"-Kürzung bei
     langen Titeln) sonst die Oberlängen der kursiven Fraunces-Schrift abschneidet
     (z.B. die Ü-Punkte bei "Über Logbuch"). */
  .subpage-header-title h1 { font-size: 19px; line-height: 1.5; padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; outline: none; }
  /* Trennlinie + etwas mehr Innenabstand unten, da hier (anders als bei den Tabs, die
     ihre eigene Trennlinie mitbringen) nichts anderes den unteren Rand der Fläche
     markiert. Die SVG-Chevron statt eines "←"-Zeichens zentriert sich unabhängig von
     Font-Metriken zuverlässig exakt. */
  .subpage-header { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px; }
  .back-btn {
    background: var(--ink); border: none; border-radius: 50%; width: 32px; height: 32px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--paper);
    cursor: pointer;
  }

  /* Header + Tab-Leiste bzw. Unterseiten-Header bleiben beim Scrollen oben fixiert
     (Menü/Zurück/Tab-Wechsel immer erreichbar) und bekommen dieselbe abgesetzte Fläche
     (eigene Hintergrundfarbe, full-bleed über die seitliche #app-Polsterung hinweg via
     negativer Margins) statt nur die Unterseiten - einheitlicher als "nur manche
     Ansichten sehen anders aus". Die Trennlinie am unteren Rand kommt je nach Kontext
     von .tabs oder .subpage-header selbst (siehe dort), .sticky-top braucht keine
     eigene - Kindelement-Margins kollabieren sonst nicht sauber nach außen. */
  .sticky-top {
    position: sticky; top: 0; z-index: 6; background: var(--surface);
    margin: -20px -18px 0; padding: 14px 18px 0;
  }
  /* Wenig Höhe (Handy im Querformat, starke Vergrößerung): angepinnt nähmen Kopf und
     Tab-Leiste - mit geöffneter Tastatur erst recht - fast den ganzen Bildschirm ein.
     Dann scrollen sie normal mit. Die Ausrichtung bewusst NICHT sperren (WCAG 1.3.4, z.B.
     fest montierte Geräte). JS, das mit der Kopfhöhe rechnet: stickyHeaderBottom(). */
  @media (max-height: 500px) {
    .sticky-top { position: static; }
  }

  .header-menu-wrap { position: relative; }
  .menu-btn {
    background: none; border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .menu-panel {
    position: absolute; top: 38px; right: 0; z-index: 10; width: 250px;
    max-height: calc(100vh - 54px); overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--popover-bg); border: 1px solid var(--ink); border-radius: 4px; padding: 14px;
    box-shadow: 0 12px 32px var(--shadow);
  }
  .menu-panel .push-row { margin-bottom: 0; }
  .menu-group { display: flex; flex-direction: column; gap: 9px; }
  .menu-group-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--sand); margin: 0;
  }
  .menu-group-divider { border-top: 1px solid var(--line); margin: 2px 0; }
  .menu-row { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sand); }
  .menu-row-note { font-size: 11px; color: var(--sand); margin: 0; }
  .menu-row select {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink);
  }
  .menu-item-btn {
    font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink); cursor: pointer; text-align: left;
  }
  .menu-item-btn:hover, .menu-item-btn:focus-visible { background: rgba(var(--moss-rgb), 0.14); border-color: var(--moss); }
  .menu-item-btn--danger { color: var(--rust); border-color: rgba(var(--rust-rgb), 0.4); }
  .menu-item-btn--danger:hover, .menu-item-btn--danger:focus-visible { background: rgba(var(--rust-rgb), 0.12); border-color: var(--rust); }
  /* Wie .manage-btn--warn: reversibel (z.B. Archivieren), daher dezenter als --danger. */
  .menu-item-btn--warn { color: var(--rust); border-color: rgba(var(--rust-rgb), 0.25); }
  .menu-item-btn--warn:hover, .menu-item-btn--warn:focus-visible { background: rgba(var(--rust-rgb), 0.08); border-color: rgba(var(--rust-rgb), 0.6); }

  /* overflow-y + margin: auto: passt der Dialog, steht er mittig; ist er höher als der
     Bildschirm (Querformat mit Tastatur, starke Vergrößerung), lässt er sich scrollen,
     statt oben und unten abgeschnitten zu werden - sonst wären seine Buttons unerreichbar. */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--scrim); z-index: 50;
    display: flex; justify-content: center; padding: 20px; overflow-y: auto;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px; max-width: 340px; width: 100%; margin: auto;
  }
  .modal-box h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 17px; margin: 0 0 10px; }
  .modal-box p { font-size: 13px; line-height: 1.45; margin: 0 0 14px; }

  .push-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink); background: rgba(var(--moss-rgb), 0.08); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; margin-bottom: 16px; }
  .push-row--muted { color: var(--sand); background: transparent; }
  .push-toggle { background: none; border: none; color: var(--moss); font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .push-toggle--prominent {
    background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600;
    padding: 7px 12px; border-radius: 3px;
  }

  .install-hint {
    display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.4; color: var(--ink);
    background: rgba(var(--rust-rgb), 0.08); border: 1px solid rgba(var(--rust-rgb), 0.3); border-radius: 3px;
    padding: 8px 10px; margin-bottom: 16px;
  }
  .install-hint span { flex: 1; }
  .install-hint-close {
    background: none; border: none; color: var(--sand); font-size: 16px; line-height: 1; cursor: pointer;
    padding: 0 2px; flex-shrink: 0;
  }

  .tabs {
    display: flex; gap: 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; padding: 6px 0 10px; font-family: inherit; font-size: 14px;
    color: var(--sand); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab--active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

  .day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; position: relative; }
  .nav-btn {
    background: none; border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .day-label { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .day-weekday { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; position: relative; }
  /* ⋮ zum Tag (renderDayMenuPanel): links vor dem Wochentag wie bei den Feldern, aber
     außerhalb des Textflusses, damit Wochentag und Datum mittig bleiben. */
  .day-weekday > .row-menu-btn { position: absolute; right: calc(100% + 2px); top: 50%; transform: translateY(-50%); }
  /* Doppelte Klasse: .row-menu steht weiter unten und setzte sonst left: 0 zurück. */
  .row-menu.day-menu { top: calc(100% + 4px); left: 50%; transform: translateX(-50%); }
  .day-relative { color: var(--moss); font-weight: 600; }
  /* Rutsch-Animation beim Zeitraum-Wechsel (siehe shiftPeriod/renderApp). Ohne
     fill-mode: danach bleibt keine Verschiebung am Element hängen (die würde z.B. das
     Zeilen-Menü falsch positionieren). */
  @keyframes view-slide-next { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes view-slide-prev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes view-fade { from { opacity: 0.35; } to { opacity: 1; } }
  .view-slide-next { animation: view-slide-next 0.22s ease-out; }
  .view-slide-prev { animation: view-slide-prev 0.22s ease-out; }
  /* "Bewegung reduzieren": nur kurzes Einblenden, keine Bewegung. */
  @media (prefers-reduced-motion: reduce) {
    .view-slide-next, .view-slide-prev { animation: view-fade 0.15s ease-out; }
  }
  .day-date { font-size: 12px; color: var(--sand); }

  .today-jump {
    display: block; margin: 0 auto 14px; background: none; border: none; color: var(--moss);
    font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0;
  }

  .habit-list { display: flex; flex-direction: column; }
  .habit-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .habit-row:first-child, .number-box:first-child { border-top: 1px solid var(--line); }
  .habit-name { font-size: 13px; line-height: 1.35; flex: 1; min-width: 0; }
  .habit-options {
    display: flex; gap: 6px; flex-shrink: 1; min-width: 0; max-width: 60%;
    overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .habit-options::-webkit-scrollbar { display: none; }
  /* Button-Zeilen in "Heute": Buttons neben dem Namen, solange Name (mind. 40 %) und
     Buttons nebeneinander passen - sonst rutschen die Buttons rechtsbündig in eine eigene
     Zeile darunter, statt teilweise unsichtbar seitlich zu scrollen (auf 360 px breiten
     Handys passten vorher nur 5 nummerierte Buttons neben den Namen). Seitlich gescrollt
     wird nur noch, was selbst in der vollen Breite nicht passt (lange Bezeichnungen). */
  .habit-row--buttons > .row-head { flex: 1 1 40%; }
  .habit-row--buttons > .habit-options { flex: 0 0 auto; max-width: 100%; margin-left: auto; }

  .opt-btn {
    font-family: inherit; font-size: 12px; width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .opt-btn--text {
    width: auto; min-width: 28px; height: 28px; border-radius: 14px; padding: 0 10px;
    white-space: nowrap;
  }
  .opt-btn--selected { color: var(--on-score); }

  /* "Noch offen" (siehe isOpenToday): Punkt hinter dem Namen, Form statt Farbe als
     Unterscheidung (Punkt da oder nicht). Moos wie die übrigen Akzente, nicht Rost -
     soll nicht nach Fehler/Warnung aussehen. */
  .open-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--moss);
    margin-left: 6px; vertical-align: middle;
  }
  /* Ende von "Heute" in drei Teilen: Abschluss der Liste ("Alles eingetragen", direkt
     unter dem letzten Feld), der Tag ("nicht geplant", Tagesnotiz) und eine Fußleiste mit
     Trennlinie für das, was nicht zum Tag gehört ("+ Neues Feld", umrandet wie "+ Neue
     Gruppe" in der Verwaltung). Alles linksbündig wie die Felder. */
  .today-complete { margin: 10px 0 0; font-size: 13px; font-style: italic; color: var(--moss); }
  .today-footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }

  /* Zahlenwert- und Text-Felder sind normale Zeilen wie alle anderen (Trennlinie statt
     eigenem Kasten - der stammte noch aus der Zeit, als Gewicht ein fester Sonderfall über
     der Liste war). Nur das Eingabefeld selbst ist umrandet. */
  .number-box {
    padding: 11px 0; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .number-box .number-last { display: block; font-size: 11px; color: var(--sand); margin-top: 2px; }
  .number-input {
    width: 72px; font-family: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 3px; background: var(--input-bg); color: var(--ink);
  }

  .habit-row--slider { flex-direction: column; align-items: stretch; gap: 6px; }
  .slider-row { display: flex; align-items: center; gap: 10px; width: 100%; }
  /* Feste statt min-width, sonst wird der Regler bei langen Bezeichnungen als Wert
     sichtbar schmaler (der Wertetext wächst, .value-slider hat flex:1 und muss dafür
     Platz abgeben) - fühlte sich beim Ziehen wie eine Verzerrung an. Lange Texte werden
     stattdessen abgeschnitten (…), der volle Text bleibt im Datenmodell erhalten. */
  .slider-value {
    font-size: 12px; color: var(--sand); width: 70px; text-align: right; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slider-clear {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--sand); font-size: 13px; line-height: 1; cursor: pointer;
  }
  /* Ohne Wert: unsichtbarer Platzhalter in exakt derselben Größe statt gar nichts - sonst
     würde der Regler beim ersten Eintragen um die Breite des × schmaler (gleicher Grund
     wie die feste Breite von .slider-value oben). */
  .slider-clear--placeholder { visibility: hidden; }

  /* Eigens gestylter Regler statt native OS-Optik (wirkte "klobig") — die farbige
     Füllung kommt über einen Gradient auf dem Track, gesteuert durch --slider-color/
     --slider-pct (siehe renderHabitSlider/input-Listener in logbuch.html). Bewusst
     NICHT über accent-color, das bei jedem Live-Update in manchen Browsern kurz
     glitchte, statt sauber mitzuziehen. */
  .value-slider {
    flex: 1; -webkit-appearance: none; appearance: none; background: transparent;
    height: 22px; cursor: pointer; --slider-color: var(--moss); --slider-pct: 50%;
  }
  .value-slider--unset { --slider-color: var(--sand); }
  .value-slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--slider-color) 0%, var(--slider-color) var(--slider-pct), var(--line) var(--slider-pct), var(--line) 100%);
  }
  .value-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .value-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--slider-color); }
  .value-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -6px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }
  .value-slider::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }

  .habit-row--computed .computed-readout {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; color: var(--on-score);
  }
  .habit-row--computed { flex-wrap: wrap; }
  .habit-row--computed .manage-meta { flex-basis: 100%; }

  /* Zeilen-Menü in "Heute" (siehe renderRowMenuButton). touch-callout/user-select
     verhindern, dass iOS/Android beim Long-Press auf die Zeile stattdessen Textauswahl
     oder ein eigenes Kontextmenü zeigen. */
  .habit-row, .number-box, .section-head { position: relative; -webkit-touch-callout: none; }
  .row-head, .section-head { -webkit-user-select: none; user-select: none; }
  /* Kopf einer Zeile: ⋮-Button + Name (bei Zahlenwert-Feldern darunter der letzte Wert).
     Der Button ragt etwas nach links in den Rand, damit die Namen nur wenig einrücken. */
  .row-head { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; margin-left: -8px; }
  .row-head-text { flex: 1; min-width: 0; }
  /* In untereinander gestapelten Zeilen (Schieberegler, Text) keine Höhe verteilen. */
  .habit-row--slider > .row-head, .text-box > .row-head { flex: none; }
  .row-menu-btn {
    flex-shrink: 0; width: 24px; height: 32px; display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0; background: none; border: none; border-radius: 3px; color: var(--sand); cursor: pointer;
  }
  .row-menu-btn svg { fill: currentColor; }
  .row-menu-btn:hover, .row-menu-btn[aria-expanded="true"] { color: var(--ink); }
  /* Der Name öffnet per Zeige-Gerät dasselbe Menü (Abkürzung, kein eigenes
     Bedienelement für Tastatur/Screenreader). Offen: dezent unterstrichen, damit
     sichtbar bleibt, zu welcher Zeile das Menü gehört. */
  .row-menu-name { cursor: pointer; }
  .row-menu-name--open { text-decoration: underline; text-decoration-color: var(--sand); text-underline-offset: 3px; }
  .row-menu {
    position: absolute; top: calc(100% - 4px); left: 0; z-index: 5; min-width: 170px;
    display: flex; flex-direction: column; gap: 6px; padding: 10px;
    background: var(--popover-bg); border: 1px solid var(--ink); border-radius: 4px;
    box-shadow: 0 12px 32px var(--shadow);
  }

  /* Notizen (siehe renderNote). flex-wrap + width: 100% lassen Notiz/Editor in eine
     eigene Zeile unter Name und Eingabe umbrechen - Name (flex-basis 0) und Buttons
     (max-width 60%) bzw. Zahlen-Eingabe passen weiterhin zusammen in die erste Zeile. */
  .habit-row, .number-box { flex-wrap: wrap; }
  .row-note {
    width: 100%; text-align: left; font: inherit; font-size: 12px; font-style: italic; line-height: 1.45;
    color: var(--ink); background: none; border: none; border-left: 2px solid var(--line);
    padding: 1px 0 1px 8px; margin: 0; cursor: pointer; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .row-note:hover, .row-note:focus-visible { border-left-color: var(--moss); }
  .note-editor { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .note-input {
    box-sizing: border-box; width: 100%; font-family: inherit; font-size: 14px; line-height: 1.45;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--input-bg); color: var(--ink); resize: vertical;
  }
  .note-editor-actions { display: flex; gap: 8px; }
  .note-save-btn {
    flex: 1; font-family: inherit; font-size: 13px; font-weight: 600; padding: 10px;
    border: none; border-radius: 3px; background: var(--moss); color: var(--paper); cursor: pointer;
  }
  .day-note { margin-top: 16px; }
  .day-note-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 14px; margin: 0 0 6px; }
  .day-note-add {
    display: block; width: 100%; box-sizing: border-box; text-align: left; font-family: inherit; font-size: 13px;
    color: var(--sand); padding: 10px 12px; background: none; border: 1px dashed var(--line); border-radius: 4px; cursor: pointer;
  }
  .day-note-add:hover, .day-note-add:focus-visible { border-color: var(--moss); color: var(--ink); }
  /* Punkt für "hier gibt es eine Notiz" in Woche (Feld-Zelle bzw. Wochentag = irgendeine
     Notiz an dem Tag) und Monat. Ink mit Papier-Ring, damit er auf jeder Zellfarbe inkl.
     Streifenmuster sichtbar bleibt. Im Monat unten statt oben, dort steht die Tageszahl. */
  .grid-cell.has-note, .month-cell.has-note, .grid-col-header.has-note { position: relative; }
  .has-note::after {
    content: ''; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 0 1.5px var(--paper);
  }
  .month-cell.has-note::after { top: auto; bottom: 3px; right: 3px; }

  .member-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .member-check { font-size: 13px; }
  .member-check--blocked { opacity: 0.45; }
  /* Berechnetes Zahlen-Feld: Wert ohne Bewertung - neutral statt eingefärbt. */
  .habit-row--computed .computed-readout--number { color: var(--ink); border: 1px solid var(--line); background: transparent; }

  .number-chart-box { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .number-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .number-chart-meta { font-size: 11px; color: var(--sand); flex-shrink: 0; white-space: nowrap; }
  .number-chart-svg { display: block; width: 100%; height: 56px; }
  .number-chart-plot { position: relative; }

  /* Wiederholung: eingeklappter Bereich "Heute nicht geplant" (renderToday), Zellen an
     nicht geplanten Tagen in der Woche (schraffiert statt leer, damit "nicht dran"
     nicht wie "vergessen" aussieht), Formular-Bausteine. */
  .unplanned { margin-top: 14px; }
  .unplanned > summary { font-size: 12px; color: var(--sand); cursor: pointer; padding: 6px 0; }
  .unplanned > .habit-list { margin-top: 6px; }
  /* Die Zellfarbe kommt inline als background-color (bewusst NICHT die Kurzschreibweise
     "background:", die setzte auch diese Schraffur wieder zurück). */
  .grid-cell--unplanned {
    border-style: dashed;
    background-image: repeating-linear-gradient(-45deg, var(--sand) 0, var(--sand) 1px, transparent 1px, transparent 5px);
  }
  /* Runde Buttons wie die Stufen-Buttons in "Heute", verteilt über höchstens 310px -
     bleibt auch auf schmalen Handys einzeilig (Abstände schrumpfen dann), ohne sich auf
     breiten Bildschirmen übertrieben weit zu verteilen. */
  .weekday-group { display: flex; justify-content: space-between; gap: 0; width: min(100%, 310px); margin-top: 6px; }
  .weekday-group .weekday-toggle {
    width: 34px; height: 34px; padding: 0; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .schedule-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .auth-field .schedule-inline select, .auth-field .schedule-inline input:not([type="checkbox"]) { width: auto; }
  .auth-field .schedule-inline input[type="number"] { width: 72px; }
  .schedule-inline label, .schedule-inline span { font-size: 13px; color: var(--ink); }
  /* Kurzes Aufleuchten des Feldes nach einem Sprung aus der Auswertung (focusTodayField). */
  /* Hervorhebung nach einem Sprung (Feld in "Heute", Eintrag im Menü): erst eine Weile
     voll sichtbar, dann ausblenden - sonst ging sie leicht unter. */
  @keyframes field-highlight {
    0%, 45% { background-color: rgba(var(--moss-rgb), 0.35); }
    100% { background-color: transparent; }
  }
  .field-highlight { animation: field-highlight 2.8s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .field-highlight { animation-duration: 0.01s; animation-delay: 2.4s; background-color: rgba(var(--moss-rgb), 0.35); }
  }

  /* Text-Felder (kind='text', siehe renderTextBox): Textfeld unter dem Namen statt
     daneben wie bei der Zahlen-Eingabe. field-sizing: content lässt es mit dem Text
     mitwachsen (wo unterstützt, sonst rows="2" + manuell vergrößerbar). */
  .text-box { flex-direction: column; align-items: stretch; gap: 8px; }
  .text-field-input {
    box-sizing: border-box; width: 100%; font-family: inherit; font-size: 14px; line-height: 1.45;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--input-bg); color: var(--ink); resize: vertical;
    field-sizing: content; min-height: 3.6em; max-height: 50vh;
  }
  /* Rückblick-Listen (siehe renderTextReviews) - gleiche Abstände wie die Zahlen-Graphen. */
  .text-review { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .text-review-title { font-size: 13px; font-weight: 400; line-height: 1.35; margin: 0; }
  summary.text-review-title { cursor: pointer; }
  .text-review-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .text-review-entry {
    display: flex; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink);
    background: none; border: none; border-radius: 3px; padding: 6px 4px; cursor: pointer;
  }
  .text-review-entry:hover, .text-review-entry:focus-visible { background: rgba(var(--moss-rgb), 0.10); }
  .text-review-date { flex-shrink: 0; width: 78px; font-size: 11px; color: var(--sand); padding-top: 2px; }
  .text-review-text { font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Ring um Datenpunkte mit Notiz (siehe renderNumberChart) - gleiche Idee wie der
     Notiz-Punkt in Woche/Monat. */
  .number-chart-note {
    position: absolute; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%);
    border: 1.5px solid var(--ink); box-sizing: border-box; pointer-events: none;
  }
  .number-chart-hit {
    position: absolute; top: 0; bottom: 0; cursor: pointer; border-radius: 2px;
  }
  .number-chart-hit:hover, .number-chart-hit:active { background: rgba(var(--moss-rgb), 0.14); }

  .grid-scroll { overflow-x: auto; }
  .grid-row { display: grid; grid-template-columns: minmax(58px, 80px) repeat(7, 1fr) minmax(30px, 38px); align-items: center; gap: 1px; }
  .grid-row--header { padding-bottom: 6px; }
  .grid-label { font-size: 10px; padding-right: 3px; line-height: 1.2; overflow-wrap: anywhere; }
  .grid-col-header { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: var(--sand); cursor: pointer; }
  .grid-col-date { font-size: 10px; color: var(--ink); }
  .grid-col-header--avg { font-family: 'Fraunces', serif; font-style: italic; color: var(--ink); cursor: default; }
  .grid-cell { height: 22px; margin: 1px; border-radius: 2px; border: 1px solid var(--line); cursor: pointer; }
  .grid-cell--blank { border-color: transparent; }
  .grid-cell--avg { display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--on-score); font-weight: 600; cursor: default; }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
  .month-weekday { font-size: 10px; color: var(--sand); text-align: center; padding-bottom: 4px; }
  .month-cell { aspect-ratio: 1; border-radius: 3px; border: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px; cursor: pointer; }
  .month-cell--empty { border: none; cursor: default; }
  /* mix-blend-mode:multiply setzt auf einen hellen Seitenhintergrund, damit die
     Zahl unabhängig vom farbcodierten Zell-Hintergrund lesbar bleibt – funktioniert
     im Dark Mode nicht mehr (verdunkelt statt abzuheben), dort auf reine Ink-Farbe
     ohne Blend-Mode zurückfallen. */
  .month-cell-num { font-size: 10px; color: var(--ink); mix-blend-mode: multiply; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .month-cell-num { mix-blend-mode: normal; }
  }
  :root[data-theme="dark"] .month-cell-num { mix-blend-mode: normal; }

  .month-stats { border-top: 1px solid var(--line); padding-top: 8px; }
  .month-stat-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .month-stat-value { font-weight: 600; }
  .month-stat-count { font-weight: 400; color: var(--sand); }

  .year-grid { display: flex; flex-direction: column; gap: 3px; margin-bottom: 20px; }
  .year-month { display: flex; align-items: center; gap: 6px; }
  .year-month-label { width: 24px; font-size: 9px; color: var(--sand); flex-shrink: 0; }
  .year-month-grid { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; flex: 1; }
  .year-day-cell { aspect-ratio: 1; border-radius: 1px; min-width: 0; cursor: pointer; }

  .notice {
    font-size: 12px; padding: 8px 10px; border-radius: 3px; margin-bottom: 14px;
    background: rgba(var(--rust-rgb), 0.12); color: var(--rust); border: 1px solid rgba(var(--rust-rgb), 0.3);
  }
  .notice--ok { background: rgba(var(--moss-rgb), 0.12); color: var(--moss); border-color: rgba(var(--moss-rgb), 0.3); }
  .loading { font-size: 13px; color: var(--sand); padding: 40px 0; text-align: center; }

  .auth-box { max-width: 320px; margin: 60px auto; }
  .auth-box h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 24px; margin: 0 0 4px; text-align: center; }
  .auth-box p.sub { font-size: 12px; color: var(--sand); text-align: center; margin: 0 0 24px; }
  .tutorial-text { font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
  /* Tutorial-Bausteine (siehe tutorialScreen): Punkte statt "Schritt X von Y", der
     aktuelle Punkt länger (Form statt nur Farbe); "Warum?"-Kasten als wiedererkennbares
     Element für Begründungen. */
  .onb-dots { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 0 0 20px; }
  .onb-dot { width: 8px; height: 8px; border-radius: 4px; border: 1.5px solid var(--sand); box-sizing: border-box; }
  .onb-dot--done { background: var(--sand); }
  .onb-dot--current { width: 22px; background: var(--moss); border-color: var(--moss); }
  .onb-icon { font-size: 40px; line-height: 1; text-align: center; margin: 0 0 10px; }
  .onb h1 { margin-bottom: 16px; outline: none; }
  .onb .tutorial-text strong { font-weight: 600; }
  .onb-center { text-align: center; }
  .onb-nav {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .onb-nav-btn {
    font-family: inherit; font-size: 13px; color: var(--ink); background: none; border: none;
    padding: 8px 4px; cursor: pointer;
  }
  /* Farbe bewusst --ink: der blasse Sandton erreicht bei 13px nur ~3:1 Kontrast. Nebensache
     zeigen hier Position, Trennlinie und Größe. */
  .onb-nav-btn:hover, .onb-nav-btn:focus-visible { text-decoration: underline; }
  /* Kurze Hinweise im Tutorial: bewusst normale Schriftfarbe statt des blassen Sandtons
     der Formular-Hinweise - hier stehen Dinge, die man wirklich lesen soll. */
  .onb-hint { font-size: 12px; line-height: 1.45; color: var(--ink); margin: 0 0 10px; }
  .onb-hint--after { margin: 6px 0 0; }
  .why-box {
    margin: 0 0 18px; padding: 10px 12px; border-left: 3px solid var(--moss); border-radius: 4px;
    background: rgba(var(--moss-rgb), 0.09); font-size: 13px; line-height: 1.5;
  }
  .why-box p { margin: 0; }
  .why-box .why-box-title { font-weight: 600; margin-bottom: 2px; }
  .onb-more { margin: 0 0 16px; font-size: 13px; line-height: 1.5; }
  .onb-more summary { cursor: pointer; color: var(--moss); font-weight: 600; }
  .onb-more p { margin: 6px 0 0; }
  .onb .recovery-key-code { margin-top: 4px; }
