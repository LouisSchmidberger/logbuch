<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logbuch</title>
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<meta name="theme-color" content="#eae7df" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Logbuch" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --paper: #eae7df;
    --ink: #24261f;
    --line: #c7c1b2;
    --moss: #4b6b4f;
    --rust: #a2503a;
    --sand: #8c8371;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden; /* Sicherheitsnetz: nichts soll je die ganze Seite breiter machen */
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .header h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 22px; margin: 0; }

  .header-menu-wrap { position: relative; }
  .menu-btn {
    background: none; border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .menu-panel {
    position: absolute; top: 38px; right: 0; z-index: 10; width: 230px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }
  .menu-panel .push-row { margin-bottom: 0; }
  .menu-row { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sand); }
  .menu-row select {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; color: var(--ink);
  }
  .menu-item-btn {
    font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: transparent; color: var(--ink); cursor: pointer; text-align: left;
  }
  .menu-item-btn--danger { color: var(--rust); border-color: rgba(162, 80, 58, 0.4); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(36, 38, 31, 0.45); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box {
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px; max-width: 340px; width: 100%;
  }
  .modal-box h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 17px; margin: 0 0 10px; }
  .modal-box p { font-size: 13px; line-height: 1.45; margin: 0 0 14px; }

  .push-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink); background: rgba(75,107,79,0.08); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; margin-bottom: 16px; }
  .push-row--muted { color: var(--sand); background: transparent; }
  .push-toggle { background: none; border: none; color: var(--moss); font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .push-toggle--prominent {
    background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600;
    padding: 7px 12px; border-radius: 3px;
  }

  .install-hint {
    display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.4; color: var(--ink);
    background: rgba(162, 80, 58, 0.08); border: 1px solid rgba(162, 80, 58, 0.3); border-radius: 3px;
    padding: 8px 10px; margin-bottom: 16px;
  }
  .install-hint span { flex: 1; }
  .install-hint-close {
    background: none; border: none; color: var(--sand); font-size: 16px; line-height: 1; cursor: pointer;
    padding: 0 2px; flex-shrink: 0;
  }

  .tabs {
    display: flex; gap: 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; padding: 6px 0 10px; font-family: inherit; font-size: 14px;
    color: var(--sand); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab--active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

  .day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .nav-btn {
    background: none; border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .day-label { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .day-weekday { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; }
  .day-date { font-size: 12px; color: var(--sand); }

  .today-jump {
    display: block; margin: 0 auto 14px; background: none; border: none; color: var(--moss);
    font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0;
  }

  .habit-list { display: flex; flex-direction: column; }
  .habit-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .habit-row:first-child { border-top: 1px solid var(--line); }
  .habit-name { font-size: 13px; line-height: 1.35; flex: 1; min-width: 0; }
  .habit-options {
    display: flex; gap: 6px; flex-shrink: 1; min-width: 0; max-width: 60%;
    overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .habit-options::-webkit-scrollbar { display: none; }

  .opt-btn {
    font-family: inherit; font-size: 12px; width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .opt-btn--text {
    width: auto; min-width: 28px; height: 28px; border-radius: 14px; padding: 0 10px;
    white-space: nowrap;
  }
  .opt-btn--selected { color: var(--paper); }

  .reset-btn {
    display: block; margin: 18px auto 0; background: none; border: none; color: var(--sand);
    font-family: inherit; font-size: 12px; cursor: pointer; text-decoration: underline;
  }

  .number-box {
    border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .number-box label { font-size: 13px; flex: 1; }
  .number-box .number-last { display: block; font-size: 11px; color: var(--sand); margin-top: 2px; }
  .number-input {
    width: 72px; font-family: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; color: var(--ink);
  }

  .habit-row--slider { flex-direction: column; align-items: stretch; gap: 6px; }
  .slider-row { display: flex; align-items: center; gap: 10px; width: 100%; }
  .slider-value { font-size: 12px; color: var(--sand); min-width: 2em; text-align: right; flex-shrink: 0; }
  .slider-clear {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--sand); font-size: 13px; line-height: 1; cursor: pointer;
  }

  /* Eigens gestylter Regler statt native OS-Optik (wirkte "klobig") — die farbige
     Füllung kommt über einen Gradient auf dem Track, gesteuert durch --slider-color/
     --slider-pct (siehe renderHabitSlider/input-Listener in logbuch.html). Bewusst
     NICHT über accent-color, das bei jedem Live-Update in manchen Browsern kurz
     glitchte, statt sauber mitzuziehen. */
  .value-slider {
    flex: 1; -webkit-appearance: none; appearance: none; background: transparent;
    height: 22px; cursor: pointer; --slider-color: var(--moss); --slider-pct: 50%;
  }
  .value-slider--unset { --slider-color: var(--sand); }
  .value-slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--slider-color) 0%, var(--slider-color) var(--slider-pct), var(--line) var(--slider-pct), var(--line) 100%);
  }
  .value-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .value-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--slider-color); }
  .value-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -6px;
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }
  .value-slider::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: var(--slider-color);
    border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }

  .habit-row--group .group-readout {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; color: var(--paper);
  }
  .habit-row--group { flex-wrap: wrap; }
  .habit-row--group .manage-meta { flex-basis: 100%; }

  .group-member-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .group-member-check { font-size: 13px; }

  .number-chart-box { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .number-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .number-chart-meta { font-size: 11px; color: var(--sand); flex-shrink: 0; white-space: nowrap; }
  .number-chart-svg { display: block; width: 100%; height: 56px; }

  .grid-scroll { overflow-x: auto; }
  .grid-row { display: grid; grid-template-columns: minmax(58px, 80px) repeat(7, 1fr) minmax(30px, 38px); align-items: center; gap: 1px; }
  .grid-row--header { padding-bottom: 6px; }
  .grid-label { font-size: 10px; padding-right: 3px; line-height: 1.2; }
  .grid-col-header { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: var(--sand); cursor: pointer; }
  .grid-col-date { font-size: 10px; color: var(--ink); }
  .grid-col-header--avg { font-family: 'Fraunces', serif; font-style: italic; color: var(--ink); cursor: default; }
  .grid-cell { height: 22px; margin: 1px; border-radius: 2px; border: 1px solid var(--line); cursor: pointer; }
  .grid-cell--avg { display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--paper); font-weight: 600; cursor: default; }

  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
  .month-weekday { font-size: 10px; color: var(--sand); text-align: center; padding-bottom: 4px; }
  .month-cell { aspect-ratio: 1; border-radius: 3px; border: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px; cursor: pointer; }
  .month-cell--empty { border: none; cursor: default; }
  .month-cell-num { font-size: 10px; color: var(--ink); mix-blend-mode: multiply; }

  .month-stats { border-top: 1px solid var(--line); padding-top: 8px; }
  .month-stat-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .month-stat-value { font-weight: 600; }
  .month-stat-count { font-weight: 400; color: var(--sand); }

  .year-grid { display: flex; flex-direction: column; gap: 3px; margin-bottom: 20px; }
  .year-month { display: flex; align-items: center; gap: 6px; }
  .year-month-label { width: 24px; font-size: 9px; color: var(--sand); flex-shrink: 0; }
  .year-month-grid { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; flex: 1; }
  .year-day-cell { aspect-ratio: 1; border-radius: 1px; min-width: 0; cursor: pointer; }

  .notice {
    font-size: 12px; padding: 8px 10px; border-radius: 3px; margin-bottom: 14px;
    background: rgba(162, 80, 58, 0.12); color: var(--rust); border: 1px solid rgba(162, 80, 58, 0.3);
  }
  .notice--ok { background: rgba(75, 107, 79, 0.12); color: var(--moss); border-color: rgba(75, 107, 79, 0.3); }
  .loading { font-size: 13px; color: var(--sand); padding: 40px 0; text-align: center; }

  .auth-box { max-width: 320px; margin: 60px auto; }
  .auth-box h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 24px; margin: 0 0 4px; text-align: center; }
  .auth-box p.sub { font-size: 12px; color: var(--sand); text-align: center; margin: 0 0 24px; }
  .tutorial-text { font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
  .tutorial-step-label { font-size: 12px; color: var(--sand); text-align: center; margin: 4px 0 14px; }
  .auth-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .auth-field label { font-size: 12px; color: var(--sand); }
  .auth-field input:not([type="checkbox"]), .auth-field select {
    font-family: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; color: var(--ink); width: 100%;
  }
  .auth-field-label-row { display: flex; align-items: center; justify-content: space-between; }
  .input-clear-wrap { position: relative; }
  .input-clear-wrap input { padding-right: 30px; }
  .input-clear-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--sand); font-size: 17px; line-height: 1;
    cursor: pointer; padding: 6px;
  }
  .auth-submit {
    width: 100%; padding: 10px; margin-top: 8px; font-family: inherit; font-size: 14px; font-weight: 600;
    background: var(--ink); color: var(--paper); border: none; border-radius: 3px; cursor: pointer;
  }
  .auth-submit:disabled { background: var(--sand); cursor: default; }
  .auth-toggle { display: block; margin: 14px auto 0; background: none; border: none; color: var(--moss); font-family: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; text-align: center; width: 100%; }

  .manage-list { display: flex; flex-direction: column; margin-bottom: 18px; }
  .manage-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .manage-row:first-child { border-top: 1px solid var(--line); }
  .manage-row--archived { opacity: 0.55; }
  .manage-row--confirm-delete { opacity: 1; flex-wrap: wrap; }
  .manage-row--dragging { position: relative; z-index: 5; background: var(--paper); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  .manage-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .manage-name { font-size: 13px; }
  .manage-meta { font-size: 11px; color: var(--sand); }
  .manage-delete-warning { font-size: 11px; color: var(--rust); }
  .manage-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .drag-handle {
    display: flex; flex-direction: column; justify-content: center; gap: 3px; width: 20px; height: 28px;
    flex-shrink: 0; cursor: grab; touch-action: none;
  }
  .drag-handle span { display: block; width: 14px; height: 2px; background: var(--sand); border-radius: 1px; }
  .manage-btn {
    font-family: inherit; font-size: 11px; padding: 5px 9px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .manage-btn--danger { color: var(--rust); border-color: rgba(162, 80, 58, 0.4); }
  .manage-new-btn {
    display: block; width: 100%; margin-top: 4px; padding: 10px; font-family: inherit; font-size: 13px;
    border: 1px dashed var(--line); border-radius: 4px; background: transparent; color: var(--moss); cursor: pointer;
  }
  .manage-section-divider { border-top: 1px solid var(--line); margin: 22px 0 14px; }
  .manage-section-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 15px; margin: 0 0 4px; }

  .habit-form { border: 1px solid var(--line); border-radius: 4px; padding: 14px; margin-bottom: 18px; }
  .habit-form h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 16px; margin: 0 0 12px; }
  .habit-form .auth-field { margin-bottom: 10px; }
  .habit-form-lock-note { font-size: 11px; color: var(--sand); margin: -4px 0 12px; }
  .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill-toggle {
    font-family: inherit; font-size: 12px; padding: 7px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .pill-toggle--active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .pill-toggle:disabled { opacity: 0.4; cursor: default; }

  .stepper-row { display: flex; align-items: center; gap: 8px; }
  .stepper-row input[type="number"] {
    width: 60px; text-align: center; font-family: inherit; font-size: 14px; padding: 6px 4px;
    border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink);
  }
  .stepper-btn {
    width: 30px; height: 30px; flex-shrink: 0; font-family: inherit; font-size: 16px; line-height: 1;
    border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink); cursor: pointer;
  }
  .stepper-btn:disabled { opacity: 0.4; cursor: default; }

  .info-tip { display: inline-block; margin-left: 4px; vertical-align: middle; }
  .info-tip summary {
    display: inline-flex; align-items: center; justify-content: center; list-style: none; user-select: none;
    width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--sand); color: var(--sand);
    font-size: 10px; cursor: pointer;
  }
  .info-tip summary::-webkit-details-marker { display: none; }
  .info-tip[open] summary { color: var(--ink); border-color: var(--ink); }
  .info-tip p { font-size: 11px; color: var(--sand); margin: 6px 0 10px; }

  .habit-form-minmax { display: flex; gap: 10px; }
  .habit-form-minmax .auth-field { flex: 1; margin-bottom: 0; }
  .label-inputs { display: flex; flex-direction: column; gap: 6px; }
  .label-inputs input {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; color: var(--ink);
  }
  .habit-form select {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; color: var(--ink);
  }
  .checkbox-field { display: flex; align-items: center; gap: 7px; font-size: 13px; margin-bottom: 4px; }
  .checkbox-field input { margin: 0; }
  .recovery-key-confirm-row {
    border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin: 12px 0 14px;
    background: rgba(75, 107, 79, 0.06);
  }
  .recovery-key-confirm-row input[type="checkbox"] { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--moss); }
  .habit-form-actions { display: flex; gap: 8px; margin-top: 14px; }
  .habit-form-actions .auth-submit { margin-top: 0; width: auto; flex: 1; }
  .habit-form-cancel {
    flex: 1; font-family: inherit; font-size: 13px; padding: 10px; background: none; border: 1px solid var(--line);
    border-radius: 3px; color: var(--ink); cursor: pointer;
  }
  .recovery-key-code {
    font-family: monospace; font-size: 13px; line-height: 1.6; word-break: break-all;
    background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 10px;
    margin: 4px 0 14px;
  }
  /* Honeypot: für Menschen unsichtbar (nicht display:none, das erkennen manche Bots),
     für Screenreader per aria-hidden ausgeblendet. */
  .honeypot-field { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// --- Konfiguration -----------------------------------------------------
const SUPABASE_URL = 'https://qdadoqcnqmrauhshvcts.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_c8VJ-dqy-WD_y01aQy1Dzw_LJE-Ornr';
const VAPID_PUBLIC_KEY = 'BDsrR2NV5vEE4Ati-Dda7tNom6GTtWmKvzytspTc7x1LP6ur1np90oAPphhIAoCtnaw3nGELgBXxYNyiSkLVEEY';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

// --- Verschlüsselung (Zero-Access: der Server sieht nur Chiffretext) --------
// Zweistufiger Schlüssel: ein zufälliger DEK (Data Encryption Key) verschlüsselt die
// eigentlichen Werte in habit_entries.data. Der DEK selbst wird zweifach "verpackt"
// (wrapped) serverseitig abgelegt — einmal mit einem aus dem Passwort abgeleiteten KEK
// (Key Encryption Key), einmal mit einem zufälligen Recovery-Key, den nur der Nutzer
// kennt (einmalig angezeigt, siehe renderRecoveryKeyDisplay). Der DEK selbst ändert
// sich dadurch nie — ein Passwort-Reset mit Recovery-Key "vererbt" ihn einfach ins neu
// verpackte Feld weiter, ohne dass irgendwelche Bestandsdaten neu verschlüsselt werden
// müssten. Alles über die native Web Crypto API, keine externe Library nötig.

function bufToBase64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function base64ToBuf(b64) {
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
}
function bufToHex(buf) {
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function hexToBuf(hex) {
  const clean = hex.replace(/[^0-9a-fA-F]/g, '');
  const bytes = new Uint8Array(clean.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(clean.substr(i * 2, 2), 16);
  return bytes.buffer;
}
// Recovery-Key fürs Anzeigen in Fünferblöcken gruppieren, z.B. "a1b2c-d3e4f-...".
function formatRecoveryKey(hex) {
  return hex.match(/.{1,5}/g).join('-');
}

const PBKDF2_ITERATIONS = 250000;

async function deriveKek(password, saltBuf, iterations) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBuf, iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['wrapKey', 'unwrapKey']
  );
}

async function generateDek() {
  return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}

function generateRecoveryKeyBytes() {
  return crypto.getRandomValues(new Uint8Array(32));
}

async function importRecoveryKeyAsCryptoKey(bytesBuf) {
  return crypto.subtle.importKey('raw', bytesBuf, 'AES-GCM', false, ['wrapKey', 'unwrapKey']);
}

async function wrapDek(dek, wrappingKey) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const wrapped = await crypto.subtle.wrapKey('raw', dek, wrappingKey, { name: 'AES-GCM', iv });
  return { iv: bufToBase64(iv), wrapped: bufToBase64(wrapped) };
}

async function unwrapDek(wrappedB64, ivB64, wrappingKey) {
  return crypto.subtle.unwrapKey(
    'raw',
    base64ToBuf(wrappedB64),
    wrappingKey,
    { name: 'AES-GCM', iv: new Uint8Array(base64ToBuf(ivB64)) },
    { name: 'AES-GCM', length: 256 },
    true,
    ['encrypt', 'decrypt']
  );
}

async function encryptData(dek, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dek, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: bufToBase64(iv), ciphertext: bufToBase64(ciphertext) };
}

async function decryptData(dek, enc) {
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(base64ToBuf(enc.iv)) }, dek, base64ToBuf(enc.ciphertext));
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// --- Lokaler DEK-Cache (IndexedDB) -------------------------------------------
// Rohbytes des entpackten DEK, ausschließlich auf diesem Gerät — geht nie an den
// Server. Erspart bei jedem App-Start auf demselben Gerät die erneute Passworteingabe
// (und die PBKDF2-Ableitung). Vergleichbares Sicherheitsniveau wie die ohnehin schon
// lokal gespeicherte Supabase-Session.
function openKeyDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('logbuch-keys', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('deks');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function cacheDek(userId, dek) {
  const raw = await crypto.subtle.exportKey('raw', dek);
  const db = await openKeyDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction('deks', 'readwrite');
    tx.objectStore('deks').put(bufToBase64(raw), userId);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function loadCachedDek(userId) {
  const db = await openKeyDb();
  const rawB64 = await new Promise((resolve, reject) => {
    const tx = db.transaction('deks', 'readonly');
    const req = tx.objectStore('deks').get(userId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
  if (!rawB64) return null;
  return crypto.subtle.importKey('raw', base64ToBuf(rawB64), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
}
async function clearCachedDek(userId) {
  try {
    const db = await openKeyDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('deks', 'readwrite');
      tx.objectStore('deks').delete(userId);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch { /* IndexedDB evtl. nicht verfügbar (privater Modus etc.) - egal, nur Cache */ }
}

// --- Habit-Definitionen ----------------------------------------------------
// Kommen jetzt aus der Tabelle habit_definitions (pro Nutzer frei verwaltbar, siehe
// renderManage weiter unten), nicht mehr aus einer festen Konstante hier im Code.
// `id` bleibt (wie vorher bei der festen Liste) der Schlüssel in habit_entries.data
// (= slug in der DB); `defId` ist die UUID der Definitions-Zeile, nur für Verwaltungs-
// Aktionen (bearbeiten/archivieren/löschen) gebraucht.
// - labels === null  → Zahlenwerte (0, 1, 2, ...)
// - labels === [...] → eigene Bezeichnungen, Länge muss max-min+1 entsprechen
function habitFromRow(row) {
  return {
    id: row.slug,
    defId: row.id,
    name: row.name,
    kind: row.kind,          // 'scale' | 'number' | 'group'
    unit: row.unit,          // nur bei kind === 'number', z.B. 'kg'
    min: row.min,
    max: row.max,
    labels: row.labels,
    good: row.good,
    displayStyle: row.display_style,   // 'buttons' | 'slider', nur bei kind === 'scale' + Zahlenwerte relevant
    sliderShowValue: row.slider_show_value,
    groupMembers: row.group_members,   // nur bei kind === 'group': Array von Slugs
    reminderMinute: row.reminder_minute, // Minuten seit Mitternacht (0-1439) oder null (= Standardzeit)
    goalThreshold: row.goal_threshold, // nur bei kind === 'scale'/'group', 0-1 oder null (= 1 = 100%)
    sortOrder: row.sort_order,
    archivedAt: row.archived_at,
  };
}

function isNumberKind(h) { return h.kind === 'number'; }

const WEEKDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const WEEKDAYS_FULL = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

// --- Datum-Helfer ----------------------------------------------------------
function formatKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function startOfDay(date) { const d = new Date(date); d.setHours(0, 0, 0, 0); return d; }
// Parst einen 'YYYY-MM-DD'-Key als lokales Datum (nicht new Date(string), das UTC
// interpretiert und je nach Zeitzone einen Tag daneben liegen kann).
function parseDateKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function startOfWeek(date) { const d = startOfDay(date); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; }
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }

// --- Erinnerungszeit-Helfer (Minuten seit Mitternacht <-> "HH:MM") ---------
// Erinnerungszeiten werden seit dem Onboarding-Tutorial in 15-Minuten-Schritten
// statt nur zur vollen Stunde gespeichert (siehe CLAUDE.md), als Minuten seit
// Mitternacht (0-1439) statt Stunde (0-23).
function minutesToTimeStr(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}
const REMINDER_TIME_STEP = 15; // Minuten — muss zum Cron-Intervall in send-notifications passen
// Bewusst ein <select> mit ausschließlich gültigen 15-Minuten-Werten statt eines
// nativen <input type="time" step="900">: das step-Attribut wird von vielen Browsern/
// Betriebssystemen (v.a. mobil) schlicht ignoriert, sodass sich trotzdem jede beliebige
// Minute auswählen ließ, obwohl das System ohnehin nur im 15-Minuten-Raster zustellen
// kann (unnötige Verwirrung: man konnte etwas einstellen, das stillschweigend gerundet
// wurde). Ein <select> kann von vornherein gar nichts anderes anbieten.
function reminderTimeInputHtml(id, minutes, dataAction, disabled) {
  const options = Array.from({ length: (24 * 60) / REMINDER_TIME_STEP }, (_, i) => i * REMINDER_TIME_STEP)
    .map((m) => `<option value="${m}" ${m === minutes ? 'selected' : ''}>${minutesToTimeStr(m)}</option>`)
    .join('');
  return `<select id="${id}" ${dataAction ? `data-action="${dataAction}"` : ''} ${disabled ? 'disabled' : ''}>${options}</select>`;
}

// 0 = schlechtester, 1 = bester Wert
function normalize(habit, value) {
  if (value === undefined || value === null) return null;
  const raw = (value - habit.min) / (habit.max - habit.min);
  return habit.good === 'low' ? 1 - raw : raw;
}

// Normalisierter Score (0-1) eines Feldes an einem bestimmten Tag. Bei normalen
// Skala-Feldern der direkt eingetragene Wert; bei gruppierten Feldern (kind='group')
// der Durchschnitt der normalisierten Werte seiner Mitglieder an dem Tag (null, wenn
// an dem Tag kein Mitglied befüllt ist — eine Gruppe hält nie einen eigenen Eintrag,
// ihr Slug taucht nie als Key in state.entries auf). Ändert man die Mitgliederliste
// einer Gruppe, wirkt sich das rückwirkend auf die gesamte Historie aus, da hier bei
// jedem Aufruf live neu gerechnet wird — beabsichtigt, siehe CLAUDE.md.
function habitScore(h, dateKey) {
  const day = state.entries[dateKey];
  if (!day) return null;
  if (h.kind === 'group') {
    const memberScores = (h.groupMembers || [])
      .map((slug) => state.habits.find((x) => x.id === slug))
      .filter(Boolean)
      .map((m) => normalize(m, day[m.id]))
      .filter((s) => s !== null);
    if (!memberScores.length) return null;
    return memberScores.reduce((a, b) => a + b, 0) / memberScores.length;
  }
  return normalize(h, day[h.id]);
}

// Ob ein Feld irgendwo in den übergebenen Datums-Keys einen (ggf. errechneten) Score
// hat — für archivierte Felder in Auswertungs-Ansichten: normale Felder prüfen direkt
// state.entries, Gruppen (die nie selbst einen Entry-Key haben) über habitScore.
function habitVisibleInRange(h, dateKeys) {
  if (h.kind === 'group') return dateKeys.some((k) => habitScore(h, k) !== null);
  return dateKeys.some((k) => state.entries[k]?.[h.id] !== undefined);
}

function scoreColor(score) {
  if (score === null || score === undefined) return 'transparent';
  const rust = [162, 80, 58], sand = [150, 142, 124], moss = [75, 107, 79];
  let c;
  if (score < 0.5) { const t = score / 0.5; c = rust.map((v, i) => Math.round(v + (sand[i] - v) * t)); }
  else { const t = (score - 0.5) / 0.5; c = sand.map((v, i) => Math.round(v + (moss[i] - v) * t)); }
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}

// Verschiebt einen normalisierten Score (0-1) anhand der pro Feld einstellbaren
// Ziel-Quote (goalThreshold, Standard 1 = 100%) für die FARBGEBUNG — z.B. bei
// "Kraftsport gemacht" kann eine 50%-Quote schon als voll erreicht (Score 1) gelten.
// Ändert NIE angezeigte Prozentzahlen, nur die Farbe, und wird bewusst NICHT in der
// "Heute"-Ansicht verwendet (siehe renderHabitOptions). Bei Standard-Ziel (1) exakter
// Durchreicher, keine Änderung ggü. vorher.
function applyGoal(habit, score) {
  if (score === null || score === undefined) return null;
  const threshold = habit.goalThreshold ?? 1;
  if (threshold >= 1) return score;
  return Math.min(1, score / threshold);
}

// Gesamt-Score eines Tages über alle Skala-/Gruppen-Felder gemittelt (für Monats-/
// Jahres-Heatmap). Zahlenwert-Felder (kind='number') fließen bewusst nicht ein —
// kein Gut/Schlecht dort.
function dayOverallScore(date) {
  const dateKey = formatKey(date);
  const day = state.entries[dateKey];
  if (!day) return null;
  const scores = state.habits.filter((h) => h.kind === 'scale' || h.kind === 'group')
    .map((h) => applyGoal(h, habitScore(h, dateKey)))
    .filter((s) => s !== null);
  if (!scores.length) return null;
  return scores.reduce((a, b) => a + b, 0) / scores.length;
}

// Durchschnitt + Anzahl je Skala-/Gruppen-Feld über eine Menge von Datums-Keys
// ('YYYY-MM-DD').
function computeHabitStats(habits, dateKeys) {
  return habits.map((h) => {
    let sum = 0, count = 0;
    for (const k of dateKeys) {
      const s = habitScore(h, k);
      if (s !== null) { sum += s; count++; }
    }
    return { habit: h, avg: count ? sum / count : null, count };
  });
}

// Werte-Reihe + Kennzahlen eines Zahlenwert-Felds über eine Menge von Datums-Keys.
function numberFieldStats(habitId, dateKeys) {
  const series = dateKeys
    .map((k) => ({ key: k, value: state.entries[k]?.[habitId] }))
    .filter((p) => p.value !== undefined && p.value !== null);
  if (!series.length) return null;
  const values = series.map((p) => p.value);
  return {
    series,
    count: series.length,
    min: Math.min(...values),
    max: Math.max(...values),
    avg: values.reduce((a, b) => a + b, 0) / values.length,
    last: series[series.length - 1].value,
  };
}

// currentDek (Modul-Variable statt state): der lebende Entschlüsselungs-Schlüssel darf
// nie über render()/innerHTML laufen und soll auch nicht versehentlich durch
// generische State-Handhabung angefasst werden.
let currentDek = null;

function activeHabits() {
  return state.habits.filter((h) => !h.archivedAt);
}

function habitHasData(habitId) {
  return Object.values(state.entries).some((day) => day[habitId] !== undefined);
}

function slugify(name) {
  const base = String(name).toLowerCase().replace(/ß/g, 'ss')
    .normalize('NFD')
    .replace(/[^a-z0-9]/g, '');
  return base || 'feld';
}

function uniqueSlug(base) {
  const existing = new Set(state.habits.map((h) => h.id));
  if (!existing.has(base)) return base;
  let i = 2;
  while (existing.has(base + i)) i++;
  return base + i;
}

const app = document.getElementById('app');

function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Supabase liefert Auth-Fehlermeldungen nur auf Englisch. "Invalid login credentials"
// bleibt bewusst unspezifisch (verrät nicht, ob die E-Mail existiert oder nur das
// Passwort falsch ist — sonst ließe sich der Nutzerbestand durchscannen), wird aber
// zumindest ins Deutsche übersetzt. Unbekannte Meldungen kommen unverändert durch.
const AUTH_ERROR_TRANSLATIONS = {
  'Invalid login credentials': 'E-Mail oder Passwort falsch.',
  'User already registered': 'Für diese E-Mail existiert bereits ein Account.',
  'Email not confirmed': 'Bitte bestätige zuerst deine E-Mail-Adresse über den Link, den wir dir geschickt haben.',
  'Password should be at least 6 characters': 'Das Passwort muss mindestens 6 Zeichen lang sein.',
};
function translateAuthError(message) {
  return AUTH_ERROR_TRANSLATIONS[message] || message;
}

// Übersetzt/vereinfacht technische Postgres-/Netzwerk-Fehlermeldungen (z.B. aus
// Datenbank-Operationen wie Feld anlegen/speichern) für Laien – die rohen
// Postgres-Meldungen (Constraint-Namen, Fachjargon) sind für Nicht-Techniker kaum
// verständlich. Unbekannte Meldungen kommen unverändert durch (wie
// translateAuthError), damit trotzdem etwas Nützliches angezeigt wird statt nichts.
function translateDbError(message) {
  if (/duplicate key value violates unique constraint "habit_definitions_user_id_slug_key"/.test(message)) {
    return 'Ein Feld mit einem sehr ähnlichen Namen existiert schon – bitte einen anderen Namen wählen.';
  }
  if (/duplicate key value violates unique constraint/.test(message)) {
    return 'Das gibt es in dieser Form schon.';
  }
  if (/violates not-null constraint/.test(message)) {
    return 'Ein Pflichtfeld fehlt oder enthält gerade keinen gültigen Wert – bitte alle Felder prüfen und nochmal versuchen.';
  }
  if (/violates check constraint/.test(message)) {
    return 'Einer der eingegebenen Werte liegt außerhalb des erlaubten Bereichs.';
  }
  if (/violates foreign key constraint/.test(message)) {
    return 'Ein verknüpfter Eintrag existiert nicht mehr – bitte die Seite neu laden und nochmal versuchen.';
  }
  if (/Failed to fetch|NetworkError|network error/i.test(message)) {
    return 'Keine Verbindung zum Server – prüfe deine Internetverbindung und versuch es nochmal.';
  }
  if (/JWT expired|invalid JWT|refresh_token_not_found/i.test(message)) {
    return 'Deine Sitzung ist abgelaufen – bitte lade die Seite neu und melde dich erneut an.';
  }
  return message;
}

// Text-/Passwort-Eingabe mit optionalem "×"-Button zum Leeren (nur wenn nicht leer)
// und optionalem Sichtbar/Verbergen-Umschalter fürs Passwort — beides eigene kleine
// Buttons statt nativer Browser-Mechanismen, damit es plattformübergreifend gleich
// aussieht/funktioniert.
function clearableInputHtml(id, type, value, opts = {}) {
  const { autocomplete = '', required = true, minlength, showVisibilityToggle = false, visible = false } = opts;
  const inputType = showVisibilityToggle ? (visible ? 'text' : 'password') : type;
  return `
    <div class="input-clear-wrap">
      <input type="${inputType}" id="${id}" value="${esc(value)}" ${required ? 'required' : ''}
        ${autocomplete ? `autocomplete="${autocomplete}"` : ''} ${minlength ? `minlength="${minlength}"` : ''} />
      ${value ? `<button type="button" class="input-clear-btn" data-action="clear-input" data-target="${id}" tabindex="-1" aria-label="Eingabe löschen">×</button>` : ''}
    </div>
  `;
}

// Kleine "?"-Box mit Erklärungstext, per Tap auf-/zuklappbar (natives <details>, kein
// JS nötig) — für Erklärungen, die nicht direkt sichtbar sein sollen (zu viel auf
// einmal), aber bei Bedarf griffbereit sind.
function infoTip(text) {
  return `<details class="info-tip"><summary aria-label="Erklärung anzeigen">?</summary><p>${esc(text)}</p></details>`;
}

// Zahlen-Eingabe mit +/- Buttons daneben, für kurze/eingeschränkte Wertebereiche
// (z.B. Anzahl Stufen) — spart das Eintippen. Ändert direkt das Input-Element und
// feuert ein 'change'-Event (siehe stepper-inc/-dec im Klick-Handler), damit ein
// evtl. daran hängender bestehender Change-Listener (z.B. für die Label-Stufenzahl)
// weiterhin greift.
function stepperInput(id, value, min, max, disabled, extraAttrs = '') {
  return `
    <div class="stepper-row">
      <button type="button" class="stepper-btn" data-action="stepper-dec" data-target="${id}" ${disabled ? 'disabled' : ''} aria-label="Verringern">−</button>
      <input type="number" id="${id}" min="${min}" max="${max}" value="${value}" ${extraAttrs} ${disabled ? 'disabled' : ''} />
      <button type="button" class="stepper-btn" data-action="stepper-inc" data-target="${id}" ${disabled ? 'disabled' : ''} aria-label="Erhöhen">+</button>
    </div>
  `;
}

// --- Datenzugriff --------------------------------------------------------
async function loadEntries() {
  const { data, error } = await supabase.from('habit_entries').select('entry_date, data');
  if (error) {
    state.notice = { type: 'error', text: 'Einträge konnten nicht geladen werden: ' + translateDbError(error.message) };
    return;
  }
  const map = {};
  for (const row of data) {
    try {
      map[row.entry_date] = row.data ? await decryptData(currentDek, row.data) : {};
    } catch {
      // Sollte nach der einmaligen Migration nicht mehr vorkommen; defensiv statt
      // die ganze App an einer kaputten/fremden Zeile scheitern zu lassen.
      map[row.entry_date] = {};
    }
  }
  state.entries = map;
}

async function loadHabits() {

  if (error) {

async function loadUserSettings() {

// --- Verschlüsselungs-Lebenszyklus -------------------------------------------
async function fetchEncryptionRow(userId) {
  const { data, error } = await supabase.from('user_encryption').select('*').eq('user_id', userId).maybeSingle();
  if (error) throw error;
  return data;
}

async function unwrapDekWithPassword(row, password) {
  const kek = await deriveKek(password, base64ToBuf(row.salt), row.kdf_iterations);
  return unwrapDek(row.wrapped_dek, row.wrap_iv, kek);
}

async function unwrapDekWithRecoveryKey(row, recoveryKeyHex) {
  const wrappingKey = await importRecoveryKeyAsCryptoKey(hexToBuf(recoveryKeyHex));
  return unwrapDek(row.wrapped_dek_recovery, row.recovery_wrap_iv, wrappingKey);
}

// Verschlüsselt alle noch im alten Klartext-Format vorliegenden habit_entries dieses
// Nutzers (einmalig, beim allerersten Setup). Bereits verschlüsselte Zeilen (erkennbar
// am {iv, ciphertext}-Format) werden übersprungen - macht die Funktion sicher erneut
// aufrufbar, falls sie mal unterbrochen wird.
async function migrateExistingEntries(userId, dek) {
  const { data: rows, error } = await supabase.from('habit_entries').select('id, data').eq('user_id', userId);
  if (error) throw error;
  for (const row of rows ?? []) {
    const isAlreadyEncrypted = row.data && typeof row.data === 'object' && 'iv' in row.data && 'ciphertext' in row.data;
    if (isAlreadyEncrypted) continue;
    const plain = row.data && typeof row.data === 'object' ? row.data : {};
    const enc = await encryptData(dek, plain);
    const { error: updErr } = await supabase.from('habit_entries')
      .update({ data: enc, filled_slugs: Object.keys(plain) })
      .eq('id', row.id);
    if (updErr) throw updErr;
  }
}

// Erzeugt DEK + Passwort-Wrapping + Recovery-Key-Wrapping neu, migriert bestehende
// Klartext-Einträge und hinterlegt den frischen Recovery-Key zur einmaligen Anzeige
// (state.recoveryKeyToShow). Genutzt sowohl beim allerersten Setup (Neu-Signup oder
// Bestandskonto vor diesem Umbau) als auch beim "Recovery-Key auch verloren"-Fallback
// im Passwort-Reset (dort verliert der Nutzer bewusst seine alten Einträge).
async function setupEncryption(userId, password) {
  const dek = await generateDek();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const kek = await deriveKek(password, salt, PBKDF2_ITERATIONS);
  const { iv: wrapIv, wrapped: wrappedDek } = await wrapDek(dek, kek);

  const recoveryBytes = generateRecoveryKeyBytes();
  const recoveryKey = await importRecoveryKeyAsCryptoKey(recoveryBytes);
  const { iv: recoveryWrapIv, wrapped: wrappedDekRecovery } = await wrapDek(dek, recoveryKey);

  const { error } = await supabase.from('user_encryption').upsert({
    user_id: userId,
    salt: bufToBase64(salt),
    kdf_iterations: PBKDF2_ITERATIONS,
    wrap_iv: wrapIv,
    wrapped_dek: wrappedDek,
    recovery_wrap_iv: recoveryWrapIv,
    wrapped_dek_recovery: wrappedDekRecovery,
  }, { onConflict: 'user_id' });
  if (error) throw error;

  await migrateExistingEntries(userId, dek);

  currentDek = dek;
  await cacheDek(userId, dek);
  state.recoveryKeyToShow = { hex: bufToHex(recoveryBytes), confirmed: false };
}

// Haupteinstieg nach erfolgreichem signIn/signUp (Passwort ist zu diesem Zeitpunkt im
// Klartext verfügbar). Schneller Pfad über den lokalen Cache, sonst Passwort-Ableitung;
// erstmaliger Aufruf für ein Konto legt die Verschlüsselung überhaupt erst an.
async function unlockEncryption(userId, password) {
  const cached = await loadCachedDek(userId).catch(() => null);
  if (cached) { currentDek = cached; return; }

  const row = await fetchEncryptionRow(userId);
  if (!row) {
    state.encryptionSetupInProgress = true;
    render();
    try {
      await setupEncryption(userId, password);
    } finally {
      state.encryptionSetupInProgress = false;
    }
    return;
  }
  currentDek = await unwrapDekWithPassword(row, password);
  await cacheDek(userId, currentDek);
}

// Für den "Recovery-Key neu erzeugen"-Menüpunkt: nutzt den bereits im Speicher
// gehaltenen DEK direkt (kein Passwort nötig), macht den bisherigen Code ungültig.
async function regenerateRecoveryKey() {
  if (!currentDek || !state.session) return;
  const recoveryBytes = generateRecoveryKeyBytes();
  const recoveryKey = await importRecoveryKeyAsCryptoKey(recoveryBytes);
  const { iv: recoveryWrapIv, wrapped: wrappedDekRecovery } = await wrapDek(currentDek, recoveryKey);
  const { error } = await supabase.from('user_encryption')
    .update({ recovery_wrap_iv: recoveryWrapIv, wrapped_dek_recovery: wrappedDekRecovery })
    .eq('user_id', state.session.user.id);
  if (error) {
    state.notice = { type: 'error', text: 'Neuer Recovery-Key konnte nicht gespeichert werden: ' + translateDbError(error.message) };
    render();
    return;
  }
  state.menuOpen = false;
  state.recoveryKeyToShow = { hex: bufToHex(recoveryBytes), confirmed: false };
  render();
}

// --- Felder-Verwaltung -----------------------------------------------------
function defaultHabitForm() {
  return {
    defId: null, locked: false, kind: 'scale',
    name: '', mode: 'numeric', min: 1, max: 5, steps: 3, labels: ['', '', ''], good: 'high',
    displayStyle: 'buttons', sliderSteps: 100, sliderShowValue: true,
    groupMembers: [],
    goalPercent: 100,
    unit: '', reminderEnabled: false, reminderMinute: state.userSettings.defaultReminderMinute,
  };
}

function habitToForm(h) {
  const labeled = !!h.labels;
  const min = h.min ?? 1;
  const max = h.max ?? 5;
  const displayStyle = h.displayStyle || 'buttons';
  return {
    defId: h.defId,
    locked: habitHasData(h.id),
    kind: h.kind,
    name: h.name,
    mode: labeled ? 'labels' : 'numeric',
    min,
    max,
    steps: labeled ? h.labels.length : (max - min + 1),
    labels: labeled ? [...h.labels] : Array.from({ length: max - min + 1 }, () => ''),
    good: h.good || 'high',
    displayStyle,
    sliderSteps: displayStyle === 'slider' ? max : 100,
    sliderShowValue: h.sliderShowValue ?? true,
    groupMembers: h.kind === 'group' ? [...(h.groupMembers || [])] : [],
    goalPercent: Math.round((h.goalThreshold ?? 1) * 100),
    unit: h.unit || '',
    reminderEnabled: h.reminderMinute !== null && h.reminderMinute !== undefined,
    reminderMinute: h.reminderMinute ?? state.userSettings.defaultReminderMinute,
  };
}

function formatScale(h) {
  if (h.kind === 'number') return h.unit ? `Zahlenwert (${h.unit})` : 'Zahlenwert';
  if (h.kind === 'group') {
    const names = (h.groupMembers || [])
      .map((slug) => state.habits.find((x) => x.id === slug)?.name || slug)
      .join(', ');
    return `Gruppiert · Ø aus: ${names || '–'}`;
  }
  const scale = h.labels ? h.labels.join(' / ') : `${h.min} – ${h.max}`;
  const goalPercent = Math.round((h.goalThreshold ?? 1) * 100);
  const styleSuffix = h.displayStyle === 'slider' ? ' · Schieberegler' : '';
  return (goalPercent < 100 ? `${scale} · Ziel ${goalPercent}%` : scale) + styleSuffix;
}

// Liest die gerade sichtbaren Formularfelder (Name + je nach Modus Min/Max oder
// Bezeichnungen) ins State-Objekt, bevor ein Struktur-Wechsel (Modus/Stufenzahl) das
// Formular neu aufbaut — sonst gingen bereits eingegebene Werte beim Re-Render verloren.
function syncHabitFormFromDom() {
  const f = state.habitForm;
  if (!f) return;
  const nameEl = document.getElementById('habit-form-name');
  if (nameEl) f.name = nameEl.value;
  if (f.kind === 'scale') {
    if (f.mode === 'numeric') {
      if (f.displayStyle === 'slider') {
        const stepsEl = document.getElementById('habit-form-slider-steps');
        if (stepsEl) f.sliderSteps = Number(stepsEl.value);
        const showValueEl = document.getElementById('habit-form-slider-show-value');
        if (showValueEl) f.sliderShowValue = showValueEl.checked;
      } else {
        const minEl = document.getElementById('habit-form-min');
        const maxEl = document.getElementById('habit-form-max');
        if (minEl) f.min = Number(minEl.value);
        if (maxEl) f.max = Number(maxEl.value);
      }
    } else {
      document.querySelectorAll('[data-label-index]').forEach((el) => {
        f.labels[Number(el.dataset.labelIndex)] = el.value;
      });
    }
    const goalEl = document.getElementById('habit-form-goal');
    if (goalEl) f.goalPercent = Number(goalEl.value);
    const reminderEnabledEl = document.getElementById('habit-form-reminder-enabled');
    if (reminderEnabledEl) f.reminderEnabled = reminderEnabledEl.checked;
    const reminderTimeEl = document.getElementById('habit-form-reminder-time');
    if (reminderTimeEl) f.reminderMinute = Number(reminderTimeEl.value);
  } else if (f.kind === 'group') {
    document.querySelectorAll('[data-group-member]').forEach((el) => {
      const slug = el.dataset.groupMember;
      if (el.checked) { if (!f.groupMembers.includes(slug)) f.groupMembers.push(slug); }
      else { f.groupMembers = f.groupMembers.filter((s) => s !== slug); }
    });
    const goalEl = document.getElementById('habit-form-goal');
    if (goalEl) f.goalPercent = Number(goalEl.value);
  } else {
    const unitEl = document.getElementById('habit-form-unit');
    if (unitEl) f.unit = unitEl.value;
    const reminderEnabledEl = document.getElementById('habit-form-reminder-enabled');
    if (reminderEnabledEl) f.reminderEnabled = reminderEnabledEl.checked;
    const reminderTimeEl = document.getElementById('habit-form-reminder-time');
    if (reminderTimeEl) f.reminderMinute = Number(reminderTimeEl.value);
  }
}

async function handleHabitSave() {
  // Verhindert Doppel-Submits (z.B. mehrfaches schnelles Klicken auf "Speichern",
  // während der erste Request noch läuft, etwa bei einer langsamen Verbindung) - ohne
  // diese Sperre konnten zwei parallele Inserts mit demselben Namen/Slug entstehen,
  // von denen der zweite mit einem kryptischen "duplicate key"-Fehler fehlschlug.
  if (state.habitFormSaving) return;
  state.habitFormSaving = true;
  render();
  try {
    await handleHabitSaveInner();
  } finally {
    state.habitFormSaving = false;
    render();
  }
}

async function handleHabitSaveInner() {
  const f = state.habitForm;
  // Muss VOR jedem möglichen frühen Return (Validierungsfehler) passieren — sonst baut
  // render() das Formular aus dem noch nicht synchronisierten (veralteten) f neu auf und
  // wirft dabei unbeteiligte, bereits eingegebene Werte weg (wirkte wie zufälliger Reset).
  syncHabitFormFromDom();
  const name = (document.getElementById('habit-form-name')?.value || '').trim();
  if (!name) {
    state.notice = { type: 'error', text: 'Bitte einen Namen eingeben.' };
    return;
  }

  const isInsert = !f.defId;
  const reminderEnabled = document.getElementById('habit-form-reminder-enabled')?.checked ?? f.reminderEnabled;
  const reminderTimeEl = document.getElementById('habit-form-reminder-time');
  const reminderMinute = reminderEnabled
    ? (reminderTimeEl ? Number(reminderTimeEl.value) : f.reminderMinute)
    : null;

  const goalEl = document.getElementById('habit-form-goal');
  const goalPercent = goalEl ? Number(goalEl.value) : f.goalPercent;
  const goalThreshold = (f.kind === 'scale' || f.kind === 'group') && Number.isFinite(goalPercent) && goalPercent > 0 && goalPercent < 100
    ? goalPercent / 100
    : null;

  let fields; // { kind, min, max, labels, good, unit, display_style, slider_show_value, group_members, goal_threshold }
  if (f.kind === 'number') {
    const unit = (document.getElementById('habit-form-unit')?.value || '').trim();
    fields = { kind: 'number', min: null, max: null, labels: null, good: null, unit: unit || null, display_style: 'buttons', slider_show_value: true, group_members: null, goal_threshold: null };
  } else if (f.kind === 'group') {
    const groupMembers = [...document.querySelectorAll('[data-group-member]:checked')].map((el) => el.dataset.groupMember);
    if (groupMembers.length < 2) {
      state.notice = { type: 'error', text: 'Bitte mindestens 2 Felder zum Gruppieren auswählen.' };
      return;
    }
    fields = { kind: 'group', min: null, max: null, labels: null, good: null, unit: null, display_style: 'buttons', slider_show_value: true, group_members: groupMembers, goal_threshold: goalThreshold };
  } else if (f.locked) {
    // Bereich/Bezeichnungen bleiben unangetastet (original.min/max/labels) – die
    // Darstellung (Buttons/Slider) und die Sichtbarkeit des Werts beim Eintragen sind
    // reine Anzeige-Einstellungen ohne Auswirkung auf bestehende Daten, deshalb aus dem
    // aktuellen Formular übernommen statt wie der Rest vom Original beibehalten.
    const original = state.habits.find((h) => h.defId === f.defId);
    fields = { kind: 'scale', min: original.min, max: original.max, labels: original.labels, good: f.good, unit: null, display_style: f.displayStyle, slider_show_value: f.sliderShowValue, group_members: null, goal_threshold: goalThreshold };
  } else if (f.mode === 'numeric' && f.displayStyle === 'slider') {
    const stepsEl = document.getElementById('habit-form-slider-steps');
    const steps = Math.round(Number(stepsEl ? stepsEl.value : f.sliderSteps));
    if (!Number.isFinite(steps) || steps < 2 || steps > 1000) {
      state.notice = { type: 'error', text: 'Anzahl Stufen muss zwischen 2 und 1000 liegen.' };
      return;
    }
    const showValueEl = document.getElementById('habit-form-slider-show-value');
    const sliderShowValue = showValueEl ? showValueEl.checked : f.sliderShowValue;
    fields = { kind: 'scale', min: 0, max: steps, labels: null, good: f.good, unit: null, display_style: 'slider', slider_show_value: sliderShowValue, group_members: null, goal_threshold: goalThreshold };
  } else if (f.mode === 'numeric') {
    const min = Number(document.getElementById('habit-form-min').value);
    const max = Number(document.getElementById('habit-form-max').value);
    if (!Number.isFinite(min) || !Number.isFinite(max) || max <= min) {
      state.notice = { type: 'error', text: '„Bis" muss größer als „Von" sein.' };
      return;
    }
    if (max - min + 1 > 12) {
      state.notice = { type: 'error', text: 'Bitte maximal 12 Stufen.' };
      return;
    }
    fields = { kind: 'scale', min, max, labels: null, good: f.good, unit: null, display_style: 'buttons', slider_show_value: true, group_members: null, goal_threshold: goalThreshold };
  } else {
    const labelEls = [...document.querySelectorAll('[data-label-index]')]
      .sort((a, b) => Number(a.dataset.labelIndex) - Number(b.dataset.labelIndex));
    const labels = labelEls.map((el) => el.value.trim());
    if (labels.some((l) => !l)) {
      state.notice = { type: 'error', text: 'Bitte alle Bezeichnungen ausfüllen.' };
      return;
    }
    fields = { kind: 'scale', min: 0, max: labels.length - 1, labels, good: f.good, unit: null, display_style: 'buttons', slider_show_value: true, group_members: null, goal_threshold: goalThreshold };
  }

  if (f.defId) {
    const patch = f.locked
      ? {
          name,
          ...(f.kind === 'scale'
            ? { good: f.good, goal_threshold: goalThreshold, display_style: fields.display_style, slider_show_value: fields.slider_show_value }
            : { unit: fields.unit }),
          reminder_minute: reminderMinute,
        }
      : { name, ...fields, reminder_minute: reminderMinute };
    const { data, error } = await supabase.from('habit_definitions').update(patch).eq('id', f.defId).select().single();
    if (error) {
      state.notice = { type: 'error', text: 'Speichern fehlgeschlagen: ' + translateDbError(error.message) };
      return;
    }
    const idx = state.habits.findIndex((h) => h.defId === f.defId);
    state.habits[idx] = habitFromRow(data);
  } else {
    const slug = uniqueSlug(slugify(name));
    const sortOrder = state.habits.length ? Math.max(...state.habits.map((h) => h.sortOrder)) + 1 : 1;
    const { data, error } = await supabase.from('habit_definitions')
      .insert({ user_id: state.session.user.id, slug, name, ...fields, reminder_minute: reminderMinute, sort_order: sortOrder })
      .select().single();
    if (error) {
      state.notice = { type: 'error', text: 'Anlegen fehlgeschlagen: ' + translateDbError(error.message) };
      return;
    }
    state.habits = [...state.habits, habitFromRow(data)];
  }

  state.habitForm = null;
  // Im Tutorial (Schritt 2) gilt das erste erfolgreich angelegte Feld als Abschluss
  // des Schritts – automatischer Sprung zu Schritt 3, kein zusätzlicher Klick nötig.
  if (isInsert && state.tutorialStep === 2) state.tutorialStep = 3;
}

async function handleHabitArchive(defId, archive) {
  const { error } = await supabase.from('habit_definitions')
    .update({ archived_at: archive ? new Date().toISOString() : null })
    .eq('id', defId);
  if (error) {
    state.notice = { type: 'error', text: 'Aktion fehlgeschlagen: ' + translateDbError(error.message) };
    render();
    return;
  }
  const idx = state.habits.findIndex((h) => h.defId === defId);
  if (idx !== -1) state.habits[idx] = { ...state.habits[idx], archivedAt: archive ? new Date().toISOString() : null };
  render();
}

async function handleHabitDelete(defId) {
  const habit = state.habits.find((h) => h.defId === defId);
  const { error } = await supabase.from('habit_definitions').delete().eq('id', defId);
  if (error) {
    state.notice = { type: 'error', text: 'Löschen fehlgeschlagen: ' + translateDbError(error.message) };
    render();
    return;
  }
  state.habits = state.habits.filter((h) => h.defId !== defId);
  render();
  // Die Feld-Definition ist gelöscht (das war der eigentliche "Löschen"-Schritt) –
  // zusätzlich räumen wir best effort die Werte dieses Feldes aus allen Tages-
  // Einträgen weg, statt sie als verwaisten Schlüssel im verschlüsselten data-JSON
  // liegen zu lassen. Passt zur Zero-Access-/Löschrecht-Ausrichtung der App: "Löschen"
  // soll möglichst wenig übrig lassen, nicht nur die Definition unbrauchbar machen.
  if (habit) purgeHabitFromEntries(habit.id);
}

async function purgeHabitFromEntries(habitId) {
  const affectedDates = Object.keys(state.entries).filter((k) => state.entries[k]?.[habitId] !== undefined);
  await Promise.all(affectedDates.map(async (dateKey) => {
    const day = { ...state.entries[dateKey] };
    delete day[habitId];
    state.entries = { ...state.entries, [dateKey]: day };
    await saveDay(dateKey, day);
  }));
  render();
}

async function saveDay(dateKey, dayData) {
  const encrypted = await encryptData(currentDek, dayData);
  const { error } = await supabase
    .from('habit_entries')
    .upsert(
      { user_id: state.session.user.id, entry_date: dateKey, data: encrypted, filled_slugs: Object.keys(dayData) },
      { onConflict: 'user_id,entry_date' }
    );
  if (error) {
    state.notice = { type: 'error', text: 'Speichern fehlgeschlagen: ' + translateDbError(error.message) };
    render();
  }
}

function handleSelect(dateKey, habitId, value) {
  const day = { ...(state.entries[dateKey] || {}) };
  if (day[habitId] === value) delete day[habitId];
  else day[habitId] = value;
  state.entries = { ...state.entries, [dateKey]: day };
  render();
  saveDay(dateKey, day);
}

function handleReset(dateKey) {
  state.entries = { ...state.entries, [dateKey]: {} };
  render();
  saveDay(dateKey, {});
}

// Einzelnen Eintrag löschen (nicht den ganzen Tag) — für den Slider gebraucht, der
// anders als Buttons (nochmal klicken) oder Zahlenfeld (leeren) sonst keine
// Möglichkeit hat, einen Wert wieder auszutragen.
function handleClearValue(dateKey, habitId) {
  const day = { ...(state.entries[dateKey] || {}) };
  delete day[habitId];
  state.entries = { ...state.entries, [dateKey]: day };
  render();
  saveDay(dateKey, day);
}

function handleSaveNumber(dateKey, habitId, rawValue) {
  const day = { ...(state.entries[dateKey] || {}) };
  const trimmed = String(rawValue).trim().replace(',', '.');
  if (trimmed === '') {
    delete day[habitId];
  } else {
    const num = parseFloat(trimmed);
    if (Number.isNaN(num)) {
      state.notice = { type: 'error', text: 'Das ist keine gültige Zahl.' };
      render();
      return;
    }
    day[habitId] = num;
  }
  state.entries = { ...state.entries, [dateKey]: day };
  render();
  saveDay(dateKey, day);
}

function findLastValue(habitId, beforeOrOnDateKey) {
  const keys = Object.keys(state.entries)
    .filter((k) => k <= beforeOrOnDateKey && state.entries[k]?.[habitId] !== undefined)
    .sort();
  if (!keys.length) return null;
  const lastKey = keys[keys.length - 1];
  return { dateKey: lastKey, value: state.entries[lastKey][habitId] };
}

// --- "Zum Homescreen hinzufügen"-Hinweis --------------------------------
// Auf iOS funktioniert Web-Push NUR, wenn die Seite zum Home-Bildschirm hinzugefügt
// wurde (harte Plattform-Einschränkung seit iOS 16.4, kein normaler Safari-Tab-Push
// möglich) - auf Android/Desktop ist das "nice to have", kein Muss. Deshalb früh und
// deutlich darauf hinweisen, mit iOS-spezifischer Anleitung.
function isStandaloneDisplay() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOSDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// iOS übernimmt beim Start einer über "Zum Home-Bildschirm" installierten Web-App
// manchmal einen alten Zoom-Stand (z.B. von Safari zum Zeitpunkt des Hinzufügens)
// statt bei initial-scale=1.0 zu starten — wirkt wie "leicht reingezoomt". Fix ohne
// Zoomen dauerhaft zu sperren: den Viewport kurz auf maximum-scale=1 setzen (zwingt
// iOS, auf 100% zurückzuspringen), danach die Beschränkung sofort wieder entfernen,
// damit Pinch-to-Zoom für den Nutzer weiterhin uneingeschränkt funktioniert.
function resetIOSZoomOnStandaloneStart() {
  if (!isIOSDevice() || !isStandaloneDisplay()) return;
  const viewport = document.querySelector('meta[name="viewport"]');
  if (!viewport) return;
  const original = viewport.getAttribute('content');
  viewport.setAttribute('content', original + ', maximum-scale=1.0');
  setTimeout(() => viewport.setAttribute('content', original), 300);
}
function isInstallHintDismissed() {
  try { return localStorage.getItem('installHintDismissed') === 'true'; } catch { return false; /* z.B. privater Modus */ }
}
function installHintText() {
  return isIOSDevice()

    : 'Für die beste Erfahrung (u.a. zuverlässigere Erinnerungen): füge Logbuch über das Browser-Menü zum Home-Bildschirm hinzu.';
}
