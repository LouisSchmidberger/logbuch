     für Screenreader per aria-hidden ausgeblendet. */

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// --- Konfiguration -----------------------------------------------------
const SUPABASE_URL = 'https://qdadoqcnqmrauhshvcts.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_c8VJ-dqy-WD_y01aQy1Dzw_LJE-Ornr';
const VAPID_PUBLIC_KEY = 'BDsrR2NV5vEE4Ati-Dda7tNom6GTtWmKvzytspTc7x1LP6ur1np90oAPphhIAoCtnaw3nGELgBXxYNyiSkLVEEY';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

// --- Verschlüsselung (Zero-Access: der Server sieht nur Chiffretext) --------
// Zweistufiger Schlüssel: ein zufälliger DEK (Data Encryption Key) verschlüsselt die
// eigentlichen Werte in habit_entries.data. Der DEK selbst wird zweifach "verpackt"
// (wrapped) serverseitig abgelegt — einmal mit einem aus dem Passwort abgeleiteten KEK
// (Key Encryption Key), einmal mit einem zufälligen Recovery-Key, den nur der Nutzer
// kennt (einmalig angezeigt, siehe renderRecoveryKeyDisplay). Der DEK selbst ändert
// sich dadurch nie — ein Passwort-Reset mit Recovery-Key "vererbt" ihn einfach ins neu
// verpackte Feld weiter, ohne dass irgendwelche Bestandsdaten neu verschlüsselt werden
// müssten. Alles über die native Web Crypto API, keine externe Library nötig.

function bufToBase64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function base64ToBuf(b64) {
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
}
function bufToHex(buf) {
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function hexToBuf(hex) {
  const clean = hex.replace(/[^0-9a-fA-F]/g, '');
  const bytes = new Uint8Array(clean.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(clean.substr(i * 2, 2), 16);
  return bytes.buffer;
}
// Recovery-Key fürs Anzeigen in Fünferblöcken gruppieren, z.B. "a1b2c-d3e4f-...".
function formatRecoveryKey(hex) {
  return hex.match(/.{1,5}/g).join('-');
}

const PBKDF2_ITERATIONS = 250000;

async function deriveKek(password, saltBuf, iterations) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBuf, iterations, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['wrapKey', 'unwrapKey']
  );
}

async function generateDek() {
  return crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}

function generateRecoveryKeyBytes() {
  return crypto.getRandomValues(new Uint8Array(32));
}

async function importRecoveryKeyAsCryptoKey(bytesBuf) {
  return crypto.subtle.importKey('raw', bytesBuf, 'AES-GCM', false, ['wrapKey', 'unwrapKey']);
}

async function wrapDek(dek, wrappingKey) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const wrapped = await crypto.subtle.wrapKey('raw', dek, wrappingKey, { name: 'AES-GCM', iv });
  return { iv: bufToBase64(iv), wrapped: bufToBase64(wrapped) };
}

async function unwrapDek(wrappedB64, ivB64, wrappingKey) {
  return crypto.subtle.unwrapKey(
    'raw',
    base64ToBuf(wrappedB64),
    wrappingKey,
    { name: 'AES-GCM', iv: new Uint8Array(base64ToBuf(ivB64)) },
    { name: 'AES-GCM', length: 256 },
    true,
    ['encrypt', 'decrypt']
  );
}

async function encryptData(dek, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dek, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: bufToBase64(iv), ciphertext: bufToBase64(ciphertext) };
}

async function decryptData(dek, enc) {
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(base64ToBuf(enc.iv)) }, dek, base64ToBuf(enc.ciphertext));
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// --- Lokaler DEK-Cache (IndexedDB) -------------------------------------------
// Rohbytes des entpackten DEK, ausschließlich auf diesem Gerät — geht nie an den
// Server. Erspart bei jedem App-Start auf demselben Gerät die erneute Passworteingabe
// (und die PBKDF2-Ableitung). Vergleichbares Sicherheitsniveau wie die ohnehin schon
// lokal gespeicherte Supabase-Session.
function openKeyDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('logbuch-keys', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('deks');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function cacheDek(userId, dek) {
  const raw = await crypto.subtle.exportKey('raw', dek);
  const db = await openKeyDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction('deks', 'readwrite');
    tx.objectStore('deks').put(bufToBase64(raw), userId);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function loadCachedDek(userId) {
  const db = await openKeyDb();
  const rawB64 = await new Promise((resolve, reject) => {
    const tx = db.transaction('deks', 'readonly');
    const req = tx.objectStore('deks').get(userId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
  if (!rawB64) return null;
  return crypto.subtle.importKey('raw', base64ToBuf(rawB64), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
}
async function clearCachedDek(userId) {
  try {
    const db = await openKeyDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('deks', 'readwrite');
      tx.objectStore('deks').delete(userId);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch { /* IndexedDB evtl. nicht verfügbar (privater Modus etc.) - egal, nur Cache */ }
}

// --- Habit-Definitionen ----------------------------------------------------
// Kommen jetzt aus der Tabelle habit_definitions (pro Nutzer frei verwaltbar, siehe
// renderManage weiter unten), nicht mehr aus einer festen Konstante hier im Code.
// `id` bleibt (wie vorher bei der festen Liste) der Schlüssel in habit_entries.data
// (= slug in der DB); `defId` ist die UUID der Definitions-Zeile, nur für Verwaltungs-
// Aktionen (bearbeiten/archivieren/löschen) gebraucht.
// - labels === null  → Zahlenwerte (0, 1, 2, ...)
// - labels === [...] → eigene Bezeichnungen, Länge muss max-min+1 entsprechen
function habitFromRow(row) {
  return {
    id: row.slug,
    defId: row.id,
    name: row.name,
    kind: row.kind,          // 'scale' | 'number'
    unit: row.unit,          // nur bei kind === 'number', z.B. 'kg'
    min: row.min,
    max: row.max,
    labels: row.labels,
    good: row.good,
    reminderHour: row.reminder_hour, // 0-23 oder null (= Standardzeit je nach kind)
    goalThreshold: row.goal_threshold, // nur bei kind === 'scale', 0-1 oder null (= 1 = 100%)
    sortOrder: row.sort_order,
    archivedAt: row.archived_at,
  };
}

function isNumberKind(h) { return h.kind === 'number'; }

const WEEKDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const WEEKDAYS_FULL = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

// --- Datum-Helfer ----------------------------------------------------------
function formatKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function startOfDay(date) { const d = new Date(date); d.setHours(0, 0, 0, 0); return d; }
// Parst einen 'YYYY-MM-DD'-Key als lokales Datum (nicht new Date(string), das UTC
// interpretiert und je nach Zeitzone einen Tag daneben liegen kann).
function parseDateKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function startOfWeek(date) { const d = startOfDay(date); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; }
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }

// 0 = schlechtester, 1 = bester Wert
function normalize(habit, value) {
  if (value === undefined || value === null) return null;
  const raw = (value - habit.min) / (habit.max - habit.min);
  return habit.good === 'low' ? 1 - raw : raw;
}
function scoreColor(score) {
  if (score === null || score === undefined) return 'transparent';
  const rust = [162, 80, 58], sand = [150, 142, 124], moss = [75, 107, 79];
  let c;
  if (score < 0.5) { const t = score / 0.5; c = rust.map((v, i) => Math.round(v + (sand[i] - v) * t)); }
  else { const t = (score - 0.5) / 0.5; c = sand.map((v, i) => Math.round(v + (moss[i] - v) * t)); }
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}

// Verschiebt einen normalisierten Score (0-1) anhand der pro Feld einstellbaren
// Ziel-Quote (goalThreshold, Standard 1 = 100%) für die FARBGEBUNG — z.B. bei
// "Kraftsport gemacht" kann eine 50%-Quote schon als voll erreicht (Score 1) gelten.
// Ändert NIE angezeigte Prozentzahlen, nur die Farbe, und wird bewusst NICHT in der
// "Heute"-Ansicht verwendet (siehe renderHabitOptions). Bei Standard-Ziel (1) exakter
// Durchreicher, keine Änderung ggü. vorher.
function applyGoal(habit, score) {
  if (score === null || score === undefined) return null;
  const threshold = habit.goalThreshold ?? 1;
  if (threshold >= 1) return score;
  return Math.min(1, score / threshold);
}

// Gesamt-Score eines Tages über alle Skala-Felder gemittelt (für Monats-/Jahres-Heatmap).
// Zahlenwert-Felder (kind='number') fließen bewusst nicht ein — kein Gut/Schlecht dort.
function dayOverallScore(date) {
  const day = state.entries[formatKey(date)];
  if (!day) return null;
  const scores = state.habits.filter((h) => h.kind === 'scale')
    .map((h) => applyGoal(h, normalize(h, day[h.id])))
    .filter((s) => s !== null);
  if (!scores.length) return null;
  return scores.reduce((a, b) => a + b, 0) / scores.length;
}

// Durchschnitt + Anzahl je Skala-Feld über eine Menge von Datums-Keys ('YYYY-MM-DD').
function computeHabitStats(habits, dateKeys) {
  return habits.map((h) => {
    let sum = 0, count = 0;
    for (const k of dateKeys) {
      const s = normalize(h, state.entries[k]?.[h.id]);
      if (s !== null) { sum += s; count++; }
    }
    return { habit: h, avg: count ? sum / count : null, count };
  });
}

// Werte-Reihe + Kennzahlen eines Zahlenwert-Felds über eine Menge von Datums-Keys.
function numberFieldStats(habitId, dateKeys) {
  const series = dateKeys
    .map((k) => ({ key: k, value: state.entries[k]?.[habitId] }))
    .filter((p) => p.value !== undefined && p.value !== null);
  if (!series.length) return null;
  const values = series.map((p) => p.value);
  return {
    series,
    count: series.length,
    min: Math.min(...values),
    max: Math.max(...values),
    avg: values.reduce((a, b) => a + b, 0) / values.length,
    last: series[series.length - 1].value,
  };
}

  view: 'today',
  currentDate: startOfDay(new Date()),
  weekAnchor: startOfWeek(new Date()),
  monthAnchor: (() => { const d = startOfDay(new Date()); d.setDate(1); return d; })(),
  yearAnchor: new Date().getFullYear(),
  authMode: 'signin', // 'signin' | 'signup' | 'forgot'
  authError: null,
  passwordRecovery: false, // true zwischen Klick auf den Passwort-Reset-Link und neuem Passwort
  pushStatus: 'unknown', // 'unsupported' | 'unknown' | 'off' | 'on' | 'busy'
  habits: [],         // alle Felder des Nutzers (aktiv + archiviert), sort_order-sortiert
  habitForm: null,    // { defId, locked, name, mode: 'numeric'|'labels', min, max, steps, labels, good }
  menuOpen: false,
  userSettings: { defaultReminderHour: 22 }, // Standard-Erinnerungszeit für Felder ohne eigene reminder_hour
  deleteConfirm: null, // { busy: boolean } während der Konto-Löschen-Bestätigung offen ist
  encryptionSetupInProgress: false, // true während setupEncryption()/Migration läuft
  recoveryKeyToShow: null, // { hex, confirmed } - einmalige Anzeige nach Erzeugung
  unlockError: null, // Fehlertext im renderUnlockPrompt-Screen
  unlockBusy: false,
  recoveryFallbackConfirm: false, // "Recovery-Key auch verloren?" im Passwort-Reset aufgeklappt
  recoveryBusy: false,
};

// currentDek (Modul-Variable statt state): der lebende Entschlüsselungs-Schlüssel darf
// nie über render()/innerHTML laufen und soll auch nicht versehentlich durch
// generische State-Handhabung angefasst werden.
let currentDek = null;

function activeHabits() {
  return state.habits.filter((h) => !h.archivedAt);
}

function habitHasData(habitId) {
  return Object.values(state.entries).some((day) => day[habitId] !== undefined);
}

function slugify(name) {
  const base = String(name).toLowerCase().replace(/ß/g, 'ss')
    .normalize('NFD')
    .replace(/[^a-z0-9]/g, '');
  return base || 'feld';
}

function uniqueSlug(base) {
  const existing = new Set(state.habits.map((h) => h.id));
  if (!existing.has(base)) return base;
  let i = 2;
  while (existing.has(base + i)) i++;
  return base + i;
}

const app = document.getElementById('app');

function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// --- Datenzugriff --------------------------------------------------------
async function loadEntries() {
  const { data, error } = await supabase.from('habit_entries').select('entry_date, data');
  if (error) {
    state.notice = { type: 'error', text: 'Einträge konnten nicht geladen werden: ' + error.message };
    return;
  }
  const map = {};
  for (const row of data) {
    try {
      map[row.entry_date] = row.data ? await decryptData(currentDek, row.data) : {};
    } catch {
      // Sollte nach der einmaligen Migration nicht mehr vorkommen; defensiv statt
      // die ganze App an einer kaputten/fremden Zeile scheitern zu lassen.
      map[row.entry_date] = {};
    }
  }
  state.entries = map;
}

async function loadHabits() {
  const { data, error } = await supabase.from('habit_definitions').select('*').order('sort_order');
  if (error) {
    state.notice = { type: 'error', text: 'Felder konnten nicht geladen werden: ' + error.message };
    return;
  }
  state.habits = data.map(habitFromRow);
}

async function loadUserSettings() {
  const { data, error } = await supabase.from('user_settings').select('default_reminder_hour').maybeSingle();
  if (error) {
    state.notice = { type: 'error', text: 'Einstellungen konnten nicht geladen werden: ' + error.message };
    return;
  }
  state.userSettings = { defaultReminderHour: data ? data.default_reminder_hour : 22 };
}

async function saveDefaultReminderHour(hour) {
  state.userSettings = { defaultReminderHour: hour };
  const { error } = await supabase.from('user_settings')
    .upsert({ user_id: state.session.user.id, default_reminder_hour: hour }, { onConflict: 'user_id' });
  if (error) {
    state.notice = { type: 'error', text: 'Speichern fehlgeschlagen: ' + error.message };
    render();
  }
}

// --- Verschlüsselungs-Lebenszyklus -------------------------------------------
async function fetchEncryptionRow(userId) {
  const { data, error } = await supabase.from('user_encryption').select('*').eq('user_id', userId).maybeSingle();
  if (error) throw error;
  return data;
}

async function unwrapDekWithPassword(row, password) {
  const kek = await deriveKek(password, base64ToBuf(row.salt), row.kdf_iterations);
  return unwrapDek(row.wrapped_dek, row.wrap_iv, kek);
}

async function unwrapDekWithRecoveryKey(row, recoveryKeyHex) {
  const wrappingKey = await importRecoveryKeyAsCryptoKey(hexToBuf(recoveryKeyHex));
  return unwrapDek(row.wrapped_dek_recovery, row.recovery_wrap_iv, wrappingKey);
}

// Verschlüsselt alle noch im alten Klartext-Format vorliegenden habit_entries dieses
// Nutzers (einmalig, beim allerersten Setup). Bereits verschlüsselte Zeilen (erkennbar
// am {iv, ciphertext}-Format) werden übersprungen - macht die Funktion sicher erneut
// aufrufbar, falls sie mal unterbrochen wird.
async function migrateExistingEntries(userId, dek) {
  const { data: rows, error } = await supabase.from('habit_entries').select('id, data').eq('user_id', userId);
  if (error) throw error;
  for (const row of rows ?? []) {
    const isAlreadyEncrypted = row.data && typeof row.data === 'object' && 'iv' in row.data && 'ciphertext' in row.data;
    if (isAlreadyEncrypted) continue;
    const plain = row.data && typeof row.data === 'object' ? row.data : {};
    const enc = await encryptData(dek, plain);
    const { error: updErr } = await supabase.from('habit_entries')
      .update({ data: enc, filled_slugs: Object.keys(plain) })
      .eq('id', row.id);
    if (updErr) throw updErr;
  }
}

// Erzeugt DEK + Passwort-Wrapping + Recovery-Key-Wrapping neu, migriert bestehende
// Klartext-Einträge und hinterlegt den frischen Recovery-Key zur einmaligen Anzeige
// (state.recoveryKeyToShow). Genutzt sowohl beim allerersten Setup (Neu-Signup oder
// Bestandskonto vor diesem Umbau) als auch beim "Recovery-Key auch verloren"-Fallback
// im Passwort-Reset (dort verliert der Nutzer bewusst seine alten Einträge).
async function setupEncryption(userId, password) {
  const dek = await generateDek();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const kek = await deriveKek(password, salt, PBKDF2_ITERATIONS);
  const { iv: wrapIv, wrapped: wrappedDek } = await wrapDek(dek, kek);

  const recoveryBytes = generateRecoveryKeyBytes();
  const recoveryKey = await importRecoveryKeyAsCryptoKey(recoveryBytes);
  const { iv: recoveryWrapIv, wrapped: wrappedDekRecovery } = await wrapDek(dek, recoveryKey);

  const { error } = await supabase.from('user_encryption').upsert({
    user_id: userId,
    salt: bufToBase64(salt),
    kdf_iterations: PBKDF2_ITERATIONS,
    wrap_iv: wrapIv,
    wrapped_dek: wrappedDek,
    recovery_wrap_iv: recoveryWrapIv,
    wrapped_dek_recovery: wrappedDekRecovery,
  }, { onConflict: 'user_id' });
  if (error) throw error;

  await migrateExistingEntries(userId, dek);

  currentDek = dek;
  await cacheDek(userId, dek);
  state.recoveryKeyToShow = { hex: bufToHex(recoveryBytes), confirmed: false };
}

// Haupteinstieg nach erfolgreichem signIn/signUp (Passwort ist zu diesem Zeitpunkt im
// Klartext verfügbar). Schneller Pfad über den lokalen Cache, sonst Passwort-Ableitung;
// erstmaliger Aufruf für ein Konto legt die Verschlüsselung überhaupt erst an.
async function unlockEncryption(userId, password) {
  const cached = await loadCachedDek(userId).catch(() => null);
  if (cached) { currentDek = cached; return; }

  const row = await fetchEncryptionRow(userId);
  if (!row) {
    state.encryptionSetupInProgress = true;
    render();
    try {
      await setupEncryption(userId, password);
    } finally {
      state.encryptionSetupInProgress = false;
    }
    return;
  }
  currentDek = await unwrapDekWithPassword(row, password);
  await cacheDek(userId, currentDek);
}

// Für den "Recovery-Key neu erzeugen"-Menüpunkt: nutzt den bereits im Speicher
// gehaltenen DEK direkt (kein Passwort nötig), macht den bisherigen Code ungültig.
async function regenerateRecoveryKey() {
  if (!currentDek || !state.session) return;
  const recoveryBytes = generateRecoveryKeyBytes();
  const recoveryKey = await importRecoveryKeyAsCryptoKey(recoveryBytes);
  const { iv: recoveryWrapIv, wrapped: wrappedDekRecovery } = await wrapDek(currentDek, recoveryKey);
  const { error } = await supabase.from('user_encryption')
    .update({ recovery_wrap_iv: recoveryWrapIv, wrapped_dek_recovery: wrappedDekRecovery })
    .eq('user_id', state.session.user.id);
  if (error) {
    state.notice = { type: 'error', text: 'Neuer Recovery-Key konnte nicht gespeichert werden: ' + error.message };
    render();
    return;
  }
  state.menuOpen = false;
  state.recoveryKeyToShow = { hex: bufToHex(recoveryBytes), confirmed: false };
  render();
}

// --- Felder-Verwaltung -----------------------------------------------------
function defaultHabitForm() {
  return {
    defId: null, locked: false, kind: 'scale',
    name: '', mode: 'numeric', min: 1, max: 5, steps: 3, labels: ['', '', ''], good: 'high',
    goalPercent: 100,
    unit: '', reminderEnabled: false, reminderHour: state.userSettings.defaultReminderHour,
  };
}

function habitToForm(h) {
  const labeled = !!h.labels;
  const min = h.min ?? 1;
  const max = h.max ?? 5;
  return {
    defId: h.defId,
    locked: habitHasData(h.id),
    kind: h.kind,
    name: h.name,
    mode: labeled ? 'labels' : 'numeric',
    min,
    max,
    steps: labeled ? h.labels.length : (max - min + 1),
    labels: labeled ? [...h.labels] : Array.from({ length: max - min + 1 }, () => ''),
    good: h.good || 'high',
    goalPercent: Math.round((h.goalThreshold ?? 1) * 100),
    unit: h.unit || '',
    reminderEnabled: h.reminderHour !== null && h.reminderHour !== undefined,
    reminderHour: h.reminderHour ?? state.userSettings.defaultReminderHour,
  };
}

function formatScale(h) {
  if (h.kind === 'number') return h.unit ? `Zahlenwert (${h.unit})` : 'Zahlenwert';
  const scale = h.labels ? h.labels.join(' / ') : `${h.min} – ${h.max}`;
  const goalPercent = Math.round((h.goalThreshold ?? 1) * 100);
  return goalPercent < 100 ? `${scale} · Ziel ${goalPercent}%` : scale;
}

// Liest die gerade sichtbaren Formularfelder (Name + je nach Modus Min/Max oder
// Bezeichnungen) ins State-Objekt, bevor ein Struktur-Wechsel (Modus/Stufenzahl) das
// Formular neu aufbaut — sonst gingen bereits eingegebene Werte beim Re-Render verloren.
function syncHabitFormFromDom() {
  const f = state.habitForm;
  if (!f) return;
  const nameEl = document.getElementById('habit-form-name');
  if (nameEl) f.name = nameEl.value;
  if (f.kind === 'scale') {
    if (f.mode === 'numeric') {
      const minEl = document.getElementById('habit-form-min');
      const maxEl = document.getElementById('habit-form-max');
      if (minEl) f.min = Number(minEl.value);
      if (maxEl) f.max = Number(maxEl.value);
    } else {
      document.querySelectorAll('[data-label-index]').forEach((el) => {
        f.labels[Number(el.dataset.labelIndex)] = el.value;
      });
    }
    const goalEl = document.getElementById('habit-form-goal');
    if (goalEl) f.goalPercent = Number(goalEl.value);
  } else {
    const unitEl = document.getElementById('habit-form-unit');
    if (unitEl) f.unit = unitEl.value;
  }
  const reminderEnabledEl = document.getElementById('habit-form-reminder-enabled');
  if (reminderEnabledEl) f.reminderEnabled = reminderEnabledEl.checked;
  const reminderHourEl = document.getElementById('habit-form-reminder-hour');
  if (reminderHourEl) f.reminderHour = Number(reminderHourEl.value);
}

async function handleHabitSave() {
  const f = state.habitForm;
  const name = (document.getElementById('habit-form-name')?.value || '').trim();
  if (!name) {
    state.notice = { type: 'error', text: 'Bitte einen Namen eingeben.' };
    render();
    return;
  }

  const reminderEnabled = document.getElementById('habit-form-reminder-enabled')?.checked ?? f.reminderEnabled;
  const reminderHourEl = document.getElementById('habit-form-reminder-hour');
  const reminderHour = reminderEnabled ? Number(reminderHourEl ? reminderHourEl.value : f.reminderHour) : null;

  const goalEl = document.getElementById('habit-form-goal');
  const goalPercent = goalEl ? Number(goalEl.value) : f.goalPercent;
  const goalThreshold = f.kind === 'scale' && Number.isFinite(goalPercent) && goalPercent > 0 && goalPercent < 100
    ? goalPercent / 100
    : null;

  let fields; // { kind, min, max, labels, good, unit, goal_threshold }
  if (f.kind === 'number') {
    const unit = (document.getElementById('habit-form-unit')?.value || '').trim();
    fields = { kind: 'number', min: null, max: null, labels: null, good: null, unit: unit || null, goal_threshold: null };
  } else if (f.locked) {
    const original = state.habits.find((h) => h.defId === f.defId);
    fields = { kind: 'scale', min: original.min, max: original.max, labels: original.labels, good: f.good, unit: null, goal_threshold: goalThreshold };
  } else if (f.mode === 'numeric') {
    const min = Number(document.getElementById('habit-form-min').value);
    const max = Number(document.getElementById('habit-form-max').value);
    if (!Number.isFinite(min) || !Number.isFinite(max) || max <= min) {
      state.notice = { type: 'error', text: '„Bis" muss größer als „Von" sein.' };
      render();
      return;
    }
    if (max - min + 1 > 12) {
      state.notice = { type: 'error', text: 'Bitte maximal 12 Stufen.' };
      render();
      return;
    }
    fields = { kind: 'scale', min, max, labels: null, good: f.good, unit: null, goal_threshold: goalThreshold };
  } else {
    const labelEls = [...document.querySelectorAll('[data-label-index]')]
      .sort((a, b) => Number(a.dataset.labelIndex) - Number(b.dataset.labelIndex));
    const labels = labelEls.map((el) => el.value.trim());
    if (labels.some((l) => !l)) {
      state.notice = { type: 'error', text: 'Bitte alle Bezeichnungen ausfüllen.' };
      render();
      return;
    }
    fields = { kind: 'scale', min: 0, max: labels.length - 1, labels, good: f.good, unit: null, goal_threshold: goalThreshold };
  }

  if (f.defId) {
    const patch = f.locked
      ? { name, ...(f.kind === 'scale' ? { good: f.good, goal_threshold: goalThreshold } : { unit: fields.unit }), reminder_hour: reminderHour }
      : { name, ...fields, reminder_hour: reminderHour };
    const { data, error } = await supabase.from('habit_definitions').update(patch).eq('id', f.defId).select().single();
    if (error) {
      state.notice = { type: 'error', text: 'Speichern fehlgeschlagen: ' + error.message };
      render();
      return;
    }
    const idx = state.habits.findIndex((h) => h.defId === f.defId);
    state.habits[idx] = habitFromRow(data);
  } else {
    const slug = uniqueSlug(slugify(name));
    const sortOrder = state.habits.length ? Math.max(...state.habits.map((h) => h.sortOrder)) + 1 : 1;
    const { data, error } = await supabase.from('habit_definitions')
      .insert({ user_id: state.session.user.id, slug, name, ...fields, reminder_hour: reminderHour, sort_order: sortOrder })
      .select().single();
    if (error) {
      state.notice = { type: 'error', text: 'Anlegen fehlgeschlagen: ' + error.message };
      render();
      return;
    }
    state.habits = [...state.habits, habitFromRow(data)];
  }

  state.habitForm = null;
  render();
}

async function handleHabitArchive(defId, archive) {
  const { error } = await supabase.from('habit_definitions')
    .update({ archived_at: archive ? new Date().toISOString() : null })
    .eq('id', defId);
  if (error) {
    state.notice = { type: 'error', text: 'Aktion fehlgeschlagen: ' + error.message };
    render();
    return;
  }
  const idx = state.habits.findIndex((h) => h.defId === defId);
  if (idx !== -1) state.habits[idx] = { ...state.habits[idx], archivedAt: archive ? new Date().toISOString() : null };
  render();
}

async function handleHabitDelete(defId) {
  const { error } = await supabase.from('habit_definitions').delete().eq('id', defId);
  if (error) {
    state.notice = { type: 'error', text: 'Löschen fehlgeschlagen: ' + error.message };
    render();
    return;
  }
  state.habits = state.habits.filter((h) => h.defId !== defId);
  render();
}

async function saveDay(dateKey, dayData) {
  const encrypted = await encryptData(currentDek, dayData);
  const { error } = await supabase
    .from('habit_entries')
    .upsert(
      { user_id: state.session.user.id, entry_date: dateKey, data: encrypted, filled_slugs: Object.keys(dayData) },
      { onConflict: 'user_id,entry_date' }
    );
  if (error) {
    state.notice = { type: 'error', text: 'Speichern fehlgeschlagen: ' + error.message };
    render();
  }
}

function handleSelect(dateKey, habitId, value) {
  const day = { ...(state.entries[dateKey] || {}) };
  if (day[habitId] === value) delete day[habitId];
  else day[habitId] = value;
  state.entries = { ...state.entries, [dateKey]: day };
  render();
  saveDay(dateKey, day);
}

function handleReset(dateKey) {
  state.entries = { ...state.entries, [dateKey]: {} };
  render();
  saveDay(dateKey, {});
}

function handleSaveNumber(dateKey, habitId, rawValue) {
  const day = { ...(state.entries[dateKey] || {}) };
  const trimmed = String(rawValue).trim().replace(',', '.');
  if (trimmed === '') {
    delete day[habitId];
  } else {
    const num = parseFloat(trimmed);
    if (Number.isNaN(num)) {
      state.notice = { type: 'error', text: 'Das ist keine gültige Zahl.' };
      render();
      return;
    }
    day[habitId] = num;
  }
  state.entries = { ...state.entries, [dateKey]: day };
  render();
  saveDay(dateKey, day);
}

function findLastValue(habitId, beforeOrOnDateKey) {
  const keys = Object.keys(state.entries)
    .filter((k) => k <= beforeOrOnDateKey && state.entries[k]?.[habitId] !== undefined)
    .sort();
  if (!keys.length) return null;
  const lastKey = keys[keys.length - 1];
  return { dateKey: lastKey, value: state.entries[lastKey][habitId] };
}

// --- Push-Benachrichtigungen ------------------------------------------
async function checkPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    state.pushStatus = 'unsupported';
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('./sw.js');
    const sub = await reg.pushManager.getSubscription();
    state.pushStatus = sub ? 'on' : 'off';
  } catch {
    state.pushStatus = 'unsupported';
  }
}

async function enablePush() {
  state.pushStatus = 'busy';
  render();
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      state.pushStatus = 'off';
      state.notice = { type: 'error', text: 'Ohne Benachrichtigungs-Erlaubnis im Browser geht das leider nicht.' };
      render();
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const json = sub.toJSON();
    const { error } = await supabase.from('push_subscriptions').upsert(
      {
        user_id: state.session.user.id,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth_key: json.keys.auth,
      },
      { onConflict: 'endpoint' }
    );
    if (error) throw error;
    state.pushStatus = 'on';
    state.notice = { type: 'ok', text: 'Erinnerungen sind aktiv.' };
  } catch (err) {
    state.pushStatus = 'off';
    state.notice = { type: 'error', text: 'Aktivieren fehlgeschlagen: ' + (err.message || err) };
  }
  render();
}

async function disablePush() {
  state.pushStatus = 'busy';
  render();
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await supabase.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
      await sub.unsubscribe();
    }
    state.pushStatus = 'off';
  } catch (err) {
    state.notice = { type: 'error', text: 'Deaktivieren fehlgeschlagen: ' + (err.message || err) };
  }
  render();
}

// --- Datenexport (Auskunftsrecht/Datenportabilität) -------------------------
// Exportiert die eigenen Rohdaten (nicht das App-interne, transformierte Modell) direkt
// aus dem Browser — RLS scoped die Abfragen automatisch auf den eigenen user_id, kein
// Server-Roundtrip über eine eigene Function nötig.
async function handleExportData() {
  state.menuOpen = false;
  const [defsRes, entriesRes, settingsRes, subsRes] = await Promise.all([
    supabase.from('habit_definitions').select('*'),
    supabase.from('habit_entries').select('*'),
    supabase.from('user_settings').select('*'),
    supabase.from('push_subscriptions').select('*'),
  ]);
  const err = defsRes.error || entriesRes.error || settingsRes.error || subsRes.error;
  if (err) {
    state.notice = { type: 'error', text: 'Export fehlgeschlagen: ' + err.message };
    render();
    return;
  }
  // habit_entries.data liegt in der DB nur noch als Chiffretext vor - für einen
  // nutzbaren Export (Art. 15/20 DSGVO: die eigenen, lesbaren Daten) hier mit dem
  // bereits im Speicher gehaltenen DEK entschlüsseln.
  const decryptedEntries = await Promise.all(
    entriesRes.data.map(async (row) => {
      try {
        return { ...row, data: row.data ? await decryptData(currentDek, row.data) : {} };
      } catch {
        return { ...row, data: null, decrypt_error: true };
      }
    })
  );

  const exportObj = {
    exported_at: new Date().toISOString(),
    habit_definitions: defsRes.data,
    habit_entries: decryptedEntries,
    user_settings: settingsRes.data,
    push_subscriptions: subsRes.data,
  };
  const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `logbuch-export-${formatKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.notice = { type: 'ok', text: 'Export heruntergeladen.' };
  render();
}

// --- Konto löschen (Recht auf Löschung) -------------------------------------
async function handleDeleteAccount() {
  const input = (document.getElementById('delete-confirm-input')?.value || '').trim();
  if (input !== 'LÖSCHEN') {
    state.notice = { type: 'error', text: 'Bitte tippe genau „LÖSCHEN" zur Bestätigung.' };
    render();
    return;
  }
  state.deleteConfirm.busy = true;
  render();

  const userId = state.session?.user?.id;
  const { data, error } = await supabase.functions.invoke('delete-account');
  if (error || data?.error) {
    state.deleteConfirm.busy = false;
    state.notice = { type: 'error', text: 'Löschen fehlgeschlagen: ' + (error?.message || data?.error) };
    render();
    return;
  }

  // Best effort: lokale Push-Subscription und gecachten Verschlüsselungs-Schlüssel im
  // Browser aufräumen (die DB-Zeilen sind durch die Kontolöschung ohnehin schon weg).
  // Darf das eigentliche Löschen nicht blockieren.
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  } catch { /* ignorieren */ }
  if (userId) await clearCachedDek(userId);
  currentDek = null;

  state.deleteConfirm = null;
  await supabase.auth.signOut();
}

// --- Anti-Bot-Schutz bei der Registrierung (statt Turnstile) ----------------
// Sichtbares Drittanbieter-Captcha (egal ob Turnstile/hCaptcha/reCAPTCHA) wird von
// Adblockern/Tracking-Schutz auf vielen Geräten blockiert und verhindert dann echte
// Registrierungen — struktureller Nachteil der ganzen Kategorie, nicht Turnstile-
// spezifisch. Stattdessen zwei simple, dependency-freie Filter gegen die typische
// unsophistizierte Bot-Masse: ein für Menschen unsichtbares Honeypot-Feld (Bots füllen
// Formularfelder oft blind aus) und eine Mindest-Ausfüllzeit (Bots senden praktisch
// sofort ab). Kein Ersatz für ein echtes Captcha gegen gezielte Angriffe, aber in
// Kombination mit der ohnehin verpflichtenden E-Mail-Bestätigung und Supabase's
// eingebautem Rate-Limiting pro IP für den aktuellen Rahmen ausreichend — und vor
// allem: reibungslos für echte Nutzer, unabhängig von Adblocker/Netzwerk.
const SIGNUP_MIN_FILL_MS = 1500;
let signupFormShownAt = null;

// --- Rendering: Auth -------------------------------------------------------
function renderAuth() {
  const isSignup = state.authMode === 'signup';
  const isForgot = state.authMode === 'forgot';
  const title = isForgot ? 'Passwort zurücksetzen' : isSignup ? 'Neuen Account anlegen' : 'Anmelden';

  app.innerHTML = `
    <div class="auth-box">
      <h1>Logbuch</h1>
      <p class="sub">${title}</p>
      ${state.authError ? `<div class="notice">${esc(state.authError)}</div>` : ''}
      ${state.notice ? `<div class="notice${state.notice.type === 'ok' ? ' notice--ok' : ''}">${esc(state.notice.text)}</div>` : ''}
      ${isForgot ? `<p class="habit-form-lock-note">Zum eigentlichen Zurücksetzen brauchst du im nächsten Schritt deinen Recovery-Key (den du bei der Einrichtung einmalig angezeigt bekommen hast), um deine bisherigen Einträge zu behalten.</p>` : ''}
      <form id="auth-form">
        <div class="auth-field">
          <label for="email">E-Mail</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        ${!isForgot ? `
          <div class="auth-field">
            <label for="password">Passwort</label>
            <input type="password" id="password" required autocomplete="${isSignup ? 'new-password' : 'current-password'}" minlength="6" />
          </div>
        ` : ''}
        ${isSignup ? `
          <div class="auth-field honeypot-field" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
          </div>
        ` : ''}
        <button type="submit" class="auth-submit">${isForgot ? 'Link zum Zurücksetzen senden' : isSignup ? 'Account erstellen' : 'Anmelden'}</button>
      </form>
      ${!isForgot ? `
        <button type="button" class="auth-toggle" data-action="toggle-auth-mode">
          ${isSignup ? 'Schon einen Account? Anmelden' : 'Noch keinen Account? Registrieren'}
        </button>
      ` : ''}
      ${!isSignup ? `
        <button type="button" class="auth-toggle" data-action="${isForgot ? 'cancel-forgot' : 'start-forgot'}">
          ${isForgot ? 'Zurück zur Anmeldung' : 'Passwort vergessen?'}
        </button>
      ` : ''}
    </div>
  `;

  if (isSignup) signupFormShownAt = Date.now();

  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    state.authError = null;
    state.notice = null;
    if (isForgot) {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname,
      });
      if (error) { state.authError = error.message; render(); return; }
      state.notice = { type: 'ok', text: 'Falls diese E-Mail bei uns registriert ist, haben wir einen Link zum Zurücksetzen geschickt.' };
      render();
      return;
    }
    const password = document.getElementById('password').value;
    // Muss VOR dem signUp/signInWithPassword-Aufruf gesetzt werden, nicht erst danach:
    // onAuthStateChange kann schon in der Lücke dazwischen feuern (siehe Kommentar bei
    // authFlowInFlight weiter unten im Skript).
    authFlowInFlight = true;
    try {
      if (isSignup) {
        const honeypotFilled = document.getElementById('website')?.value;
        const filledTooFast = signupFormShownAt !== null && Date.now() - signupFormShownAt < SIGNUP_MIN_FILL_MS;
        if (honeypotFilled || filledTooFast) {
          // Stillschweigend ablehnen statt konkret zu sagen warum — sonst lässt sich
          // der Filter durch einen Bot leicht anpassen ("Website"-Feld leer lassen,
          // langsamer abschicken).
          state.authError = 'Registrierung fehlgeschlagen. Bitte versuche es erneut.';
          render();
          return;
        }
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) { state.authError = error.message; render(); return; }
        if (!data.session) {
          state.notice = { type: 'ok', text: 'Fast fertig: Bestätige deine E-Mail über den Link, den wir dir geschickt haben, und melde dich dann an.' };
          state.authMode = 'signin';
          render();
          return;
        }
        // E-Mail-Bestätigung war nicht nötig (sofortige Session) - Verschlüsselung kann
        // gleich eingerichtet werden.
        await completeAuthFlow(data.user.id, password);
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) { state.authError = error.message; render(); return; }
        await completeAuthFlow(data.user.id, password);
      }
    } finally {
      authFlowInFlight = false;
    }
  });
}

function renderPasswordRecovery() {
  const fallback = state.recoveryFallbackConfirm;
  app.innerHTML = `
    <div class="auth-box">
      <h1>Logbuch</h1>
      <p class="sub">Neues Passwort setzen</p>
      ${state.authError ? `<div class="notice">${esc(state.authError)}</div>` : ''}
      <form id="recovery-form">
        <div class="auth-field">
          <label for="new-password">Neues Passwort</label>
          <input type="password" id="new-password" required autocomplete="new-password" minlength="6" ${state.recoveryBusy ? 'disabled' : ''} />
        </div>
        ${!fallback ? `
          <div class="auth-field">
            <label for="recovery-key-input">Recovery-Key</label>
            <input type="text" id="recovery-key-input" placeholder="von der einmaligen Anzeige bei der Einrichtung" autocomplete="off" ${state.recoveryBusy ? 'disabled' : ''} />
          </div>
          <button type="submit" class="auth-submit" ${state.recoveryBusy ? 'disabled' : ''}>${state.recoveryBusy ? 'Wird gespeichert …' : 'Passwort speichern'}</button>
          <button type="button" class="auth-toggle" data-action="toggle-recovery-fallback">Recovery-Key auch verloren?</button>
        ` : `
          <div class="notice">Ohne Recovery-Key können deine bisherigen verschlüsselten Einträge nicht mehr entschlüsselt werden — sie sind dann unwiederbringlich verloren. Das betrifft nur die alten Einträge, dein Konto selbst bleibt nutzbar.</div>
          <button type="submit" class="auth-submit" ${state.recoveryBusy ? 'disabled' : ''}>${state.recoveryBusy ? 'Wird gespeichert …' : 'Verstanden, Passwort trotzdem setzen (alte Daten verloren)'}</button>
          <button type="button" class="auth-toggle" data-action="toggle-recovery-fallback">Doch abbrechen, ich habe den Code noch</button>
        `}
      </form>
    </div>
  `;

  document.getElementById('recovery-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('new-password').value;
    state.authError = null;
    state.recoveryBusy = true;
    authFlowInFlight = true; // siehe Kommentar bei der Deklaration weiter unten im Skript
    render();
    try {
      const userId = state.session.user.id;
      if (fallback) {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        await setupEncryption(userId, password);
      } else {
        const recoveryKeyHex = document.getElementById('recovery-key-input').value;
        let dek;
        try {
          const row = await fetchEncryptionRow(userId);
          if (!row) throw new Error('Keine Verschlüsselungs-Konfiguration gefunden.');
          dek = await unwrapDekWithRecoveryKey(row, recoveryKeyHex);
        } catch {
          throw new Error('Recovery-Key ist falsch oder unvollständig. Nichts wurde verändert.');
        }
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const kek = await deriveKek(password, salt, PBKDF2_ITERATIONS);
        const { iv: wrapIv, wrapped: wrappedDek } = await wrapDek(dek, kek);
        const { error: updErr } = await supabase.from('user_encryption')
          .update({ salt: bufToBase64(salt), kdf_iterations: PBKDF2_ITERATIONS, wrap_iv: wrapIv, wrapped_dek: wrappedDek })
          .eq('user_id', userId);
        if (updErr) throw updErr;
        currentDek = dek;
        await cacheDek(userId, dek);
      }
      state.recoveryBusy = false;
      state.passwordRecovery = false;
      state.recoveryFallbackConfirm = false;
      state.notice = { type: 'ok', text: 'Passwort gespeichert.' };
      state.loading = true;
      render();
      await Promise.all([loadEntries(), loadHabits(), loadUserSettings()]);
      state.loading = false;
      render();
    } catch (err) {
      state.recoveryBusy = false;
      state.authError = err.message || String(err);
      render();
    } finally {
      authFlowInFlight = false;
    }
  });
}

// --- Rendering: Habit-Row ---------------------------------------------
function renderHabitOptions(habit, value) {
  const options = Array.from({ length: habit.max - habit.min + 1 }, (_, i) => habit.min + i)
    .map((n, i) => [n, habit.labels ? habit.labels[i] : String(n)]);

  return options.map(([v, label]) => {
    const selected = value === v;
    const score = normalize(habit, v);
    const style = selected ? `background:${scoreColor(score)};border-color:${scoreColor(score)};` : '';
    const isText = label.length > 1;
    return `<button type="button" class="opt-btn${isText ? ' opt-btn--text' : ''}${selected ? ' opt-btn--selected' : ''}" style="${style}"
      data-action="select" data-habit="${habit.id}" data-value='${JSON.stringify(v)}' aria-pressed="${selected}">${esc(label)}</button>`;
  }).join('');
}

function renderWeek() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(state.weekAnchor, i));
  // Archivierte Felder bleiben sichtbar, solange sie in diesem Zeitraum Daten haben –
  // sonst wuerde die Historie beim Archivieren aus der Auswertung verschwinden.
  const visibleHabits = state.habits.filter(
    (h) => !h.archivedAt || days.some((d) => state.entries[formatKey(d)]?.[h.id] !== undefined)
  );
  const rows = visibleHabits.filter((h) => h.kind === 'scale').map((h) => {
    const scores = days.map((d) => normalize(h, state.entries[formatKey(d)]?.[h.id]));
    const valid = scores.filter((s) => s !== null);
    const avg = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
    return `
      <div class="grid-row">
        <div class="grid-label">${esc(h.name)}${h.archivedAt ? ' <span class="manage-meta">(archiviert)</span>' : ''}</div>
        ${scores.map((s, i) => `<div class="grid-cell" data-action="open-day" data-date="${formatKey(days[i])}" style="background:${scoreColor(applyGoal(h, s))}"></div>`).join('')}
        <div class="grid-cell grid-cell--avg" style="background:${scoreColor(applyGoal(h, avg))}">${avg !== null ? Math.round(avg * 100) + '%' : '–'}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="day-nav">
      <button type="button" class="nav-btn" data-action="nav-week" data-dir="-1" aria-label="Vorherige Woche">‹</button>
      <div class="day-label"><span class="day-date">${days[0].getDate()}. ${MONTHS[days[0].getMonth()]} – ${days[6].getDate()}. ${MONTHS[days[6].getMonth()]}</span></div>
      <button type="button" class="nav-btn" data-action="nav-week" data-dir="1" aria-label="Nächste Woche">›</button>
    </div>
    <div class="grid-scroll">
      <div class="grid-row grid-row--header">
        <div class="grid-label"></div>
        ${days.map((d) => `<div class="grid-col-header" data-action="open-day" data-date="${formatKey(d)}"><span>${WEEKDAYS[(d.getDay() + 6) % 7]}</span><span class="grid-col-date">${d.getDate()}</span></div>`).join('')}
        <div class="grid-col-header grid-col-header--avg">Ø</div>
      </div>
      ${rows}
    </div>
    ${renderNumberCharts(visibleHabits, days.map(formatKey))}
  `;
}

// --- Rendering: Month ------------------------------------------------------
function renderMonth() {
  const year = state.monthAnchor.getFullYear();
  const month = state.monthAnchor.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

  const cellKeys = cells.filter(Boolean).map(formatKey);
  // Archivierte Felder bleiben sichtbar, solange sie in diesem Monat Daten haben.
  const visibleHabits = state.habits.filter(
    (h) => !h.archivedAt || cellKeys.some((k) => state.entries[k]?.[h.id] !== undefined)
  );
  const monthStats = computeHabitStats(visibleHabits.filter((h) => h.kind === 'scale'), cellKeys);

  return `
    <div class="day-nav">
      <button type="button" class="nav-btn" data-action="nav-month" data-dir="-1" aria-label="Vorheriger Monat">‹</button>
      <div class="day-label"><span class="day-date">${MONTHS[month]} ${year}</span></div>
      <button type="button" class="nav-btn" data-action="nav-month" data-dir="1" aria-label="Nächster Monat">›</button>
    </div>
    <div class="month-grid">
      ${WEEKDAYS.map((w) => `<div class="month-weekday">${w}</div>`).join('')}
      ${cells.map((d) => {
        if (!d) return `<div class="month-cell month-cell--empty"></div>`;
        const s = dayOverallScore(d);
        return `<div class="month-cell" data-action="open-day" data-date="${formatKey(d)}" style="background:${scoreColor(s)}"><span class="month-cell-num">${d.getDate()}</span></div>`;
      }).join('')}
    </div>
    <div class="month-stats">${renderStatsRows(monthStats)}</div>
    ${renderNumberCharts(visibleHabits, cellKeys)}
  `;
}

// --- Rendering: Year ---------------------------------------------------------
function renderYear() {
  const year = state.yearAnchor;
  const monthsGrid = MONTHS.map((name, mIdx) => {
    const daysInMonth = new Date(year, mIdx + 1, 0).getDate();
    const cells = Array.from({ length: daysInMonth }, (_, i) => new Date(year, mIdx, i + 1));
    return `
      <div class="year-month">
        <div class="year-month-label">${name.slice(0, 3)}</div>
        <div class="year-month-grid">
          ${cells.map((d) => `<div class="year-day-cell" data-action="open-day" data-date="${formatKey(d)}" style="background:${scoreColor(dayOverallScore(d))}"></div>`).join('')}
        </div>
      </div>
    `;
  }).join('');

  const yearKeys = Object.keys(state.entries).filter((k) => k.startsWith(`${year}-`)).sort();
  // Archivierte Felder bleiben sichtbar, solange sie in diesem Jahr Daten haben.
  const visibleHabits = state.habits.filter(
    (h) => !h.archivedAt || yearKeys.some((k) => state.entries[k]?.[h.id] !== undefined)
  );
  const yearStats = computeHabitStats(visibleHabits.filter((h) => h.kind === 'scale'), yearKeys);

  return `
    <div class="day-nav">
      <button type="button" class="nav-btn" data-action="nav-year" data-dir="-1" aria-label="Vorheriges Jahr">‹</button>
      <div class="day-label"><span class="day-date">${year}</span></div>
      <button type="button" class="nav-btn" data-action="nav-year" data-dir="1" aria-label="Nächstes Jahr">›</button>
    </div>
    <div class="year-grid">${monthsGrid}</div>
    <div class="month-stats">${renderStatsRows(yearStats)}</div>
    ${renderNumberCharts(visibleHabits, yearKeys)}
  `;
}

// --- Rendering: Gesamt (alle Einträge seit Beginn) ---------------------------
function renderGlobal() {
  const dateKeys = Object.keys(state.entries).sort();
  const stats = computeHabitStats(state.habits.filter((h) => h.kind === 'scale'), dateKeys);
  const rangeNote = dateKeys.length
    ? `Seit ${dateKeys[0].split('-').reverse().join('.')} · ${dateKeys.length} Tage mit Eintrag`
    : 'Noch keine Einträge.';

  return `
    <div class="day-nav">
      <div class="day-label"><span class="day-date">Gesamt</span></div>
    </div>
    <p class="manage-meta" style="margin: -8px 0 14px;">${esc(rangeNote)}</p>
    <div class="month-stats">${renderStatsRows(stats)}</div>
    ${renderNumberCharts(state.habits, dateKeys)}
  `;
}

function renderStatsRows(stats) {
  return stats.map(({ habit, avg, count }) => `
    <div class="month-stat-row">
      <span class="habit-name">${esc(habit.name)}${habit.archivedAt ? ' <span class="manage-meta">(archiviert)</span>' : ''}</span>
      <span class="month-stat-value" style="color:${avg === null ? 'var(--sand)' : scoreColor(applyGoal(habit, avg))}">${avg !== null ? Math.round(avg * 100) + '%' : '–'} <span class="month-stat-count">(${count}×)</span></span>
    </div>
  `).join('');
}

// Handgezeichneter Inline-SVG-Linienverlauf für ein Zahlenwert-Feld über eine Menge von
// Datums-Keys — bewusst ohne Chart-Library, passend zum Build-Step-freien Ansatz.
function round1(n) { return Math.round(n * 10) / 10; }

function renderNumberChart(habit, dateKeys) {
  const stats = numberFieldStats(habit.id, dateKeys);
  const unitSuffix = habit.unit ? ` ${esc(habit.unit)}` : '';
  const head = `
    <div class="number-chart-head">
      <span class="habit-name">${esc(habit.name)}${habit.archivedAt ? ' <span class="manage-meta">(archiviert)</span>' : ''}</span>
      ${stats ? `<span class="number-chart-meta">${stats.last}${unitSuffix} zuletzt · Ø ${round1(stats.avg)}${unitSuffix} · ${stats.count}×</span>` : ''}
    </div>
  `;
  if (!stats || stats.series.length < 2) {
    return `<div class="number-chart-box">${head}<p class="manage-meta">${stats ? 'Noch zu wenige Werte für einen Verlauf.' : 'Noch keine Werte.'}</p></div>`;
  }
  const w = 280, h = 56, pad = 4;
  const n = stats.series.length;
  const range = stats.max - stats.min || 1;
  const points = stats.series.map((p, i) => {
    const x = pad + (i / (n - 1)) * (w - 2 * pad);
    const y = h - pad - ((p.value - stats.min) / range) * (h - 2 * pad);
    return [x, y];
  });
  const pointsAttr = points.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const dots = points.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" style="fill:var(--ink)" />`).join('');
  return `
    <div class="number-chart-box">
      ${head}
      <svg viewBox="0 0 ${w} ${h}" class="number-chart-svg" preserveAspectRatio="none">
        <polyline points="${pointsAttr}" fill="none" style="stroke:var(--moss);stroke-width:1.5" />
        ${dots}
      </svg>
    </div>
  `;
}

function renderNumberCharts(visibleHabits, dateKeys) {
  const numberHabits = visibleHabits.filter(isNumberKind);
  if (!numberHabits.length) return '';
  return `<div class="month-stats">${numberHabits.map((h) => renderNumberChart(h, dateKeys)).join('')}</div>`;
}

function render() {
  if (state.passwordRecovery) { renderPasswordRecovery(); return; }
  if (!state.session) { renderAuth(); return; }
  if (state.recoveryKeyToShow) { renderRecoveryKeyDisplay(); return; }
  if (state.encryptionSetupInProgress) { app.innerHTML = `<div class="loading">Deine Daten werden verschlüsselt …</div>`; return; }
  if (!currentDek) { renderUnlockPrompt(); return; }
  renderApp();
}

// --- Event-Delegation ----------------------------------------------------
app.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'toggle-auth-mode') {
    state.authMode = state.authMode === 'signup' ? 'signin' : 'signup';
    state.authError = null;
    render();
  } else if (action === 'start-forgot') {
    state.authMode = 'forgot';
    state.authError = null;
    state.notice = null;
    render();
  } else if (action === 'cancel-forgot') {
    state.authMode = 'signin';
    state.authError = null;
    state.notice = null;
    render();
  } else if (action === 'toggle-recovery-fallback') {
    state.recoveryFallbackConfirm = !state.recoveryFallbackConfirm;
    state.authError = null;
    render();
  } else if (action === 'copy-recovery-key') {
    try {
      await navigator.clipboard.writeText(formatRecoveryKey(state.recoveryKeyToShow.hex));
      state.notice = { type: 'ok', text: 'In die Zwischenablage kopiert.' };
    } catch {
      state.notice = { type: 'error', text: 'Kopieren nicht möglich - bitte den Code manuell abschreiben.' };
    }
    render();
  } else if (action === 'download-recovery-key') {
    const blob = new Blob(
      [`Logbuch Recovery-Key\n${formatRecoveryKey(state.recoveryKeyToShow.hex)}\n\nSicher aufbewahren - ohne diesen Code UND dein Passwort sind deine Daten unwiederbringlich verloren.\n`],
      { type: 'text/plain' }
    );
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'logbuch-recovery-key.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    state.notice = { type: 'ok', text: 'Datei wird heruntergeladen.' };
    render();
  } else if (action === 'confirm-recovery-key') {
    if (!document.getElementById('recovery-key-confirm')?.checked) return; // Button ist sonst disabled
    state.recoveryKeyToShow = null;
    state.notice = null;
    render();
  } else if (action === 'regenerate-recovery-key') {
    await regenerateRecoveryKey();
  } else if (action === 'logout') {
    currentDek = null;
    await supabase.auth.signOut();
  } else if (action === 'toggle-menu') {
    state.menuOpen = !state.menuOpen;
    render();
  } else if (action === 'open-manage') {
    state.view = 'manage';
    state.menuOpen = false;
    render();
  } else if (action === 'export-data') {
    await handleExportData();
  } else if (action === 'open-delete-confirm') {
    state.deleteConfirm = { busy: false };
    state.menuOpen = false;
    render();
  } else if (action === 'delete-confirm-cancel') {
    state.deleteConfirm = null;
    render();
  } else if (action === 'delete-confirm-submit') {
    await handleDeleteAccount();
  } else if (action === 'set-view') {
    state.view = el.dataset.view;
    render();
  } else if (action === 'nav-day') {
    state.currentDate = addDays(state.currentDate, Number(el.dataset.dir));
    render();
  } else if (action === 'jump-today') {
    state.currentDate = startOfDay(new Date());
    render();
  } else if (action === 'nav-week') {
    state.weekAnchor = addDays(state.weekAnchor, Number(el.dataset.dir) * 7);
    render();
  } else if (action === 'nav-month') {
    const d = new Date(state.monthAnchor);
    d.setMonth(d.getMonth() + Number(el.dataset.dir));
    state.monthAnchor = d;
    render();
  } else if (action === 'nav-year') {
    state.yearAnchor += Number(el.dataset.dir);
    render();
  } else if (action === 'open-day') {
    state.currentDate = parseDateKey(el.dataset.date);
    state.view = 'today';
    render();
  } else if (action === 'select') {
    const dateKey = formatKey(state.currentDate);
    const value = JSON.parse(el.dataset.value);
    handleSelect(dateKey, el.dataset.habit, value);
  } else if (action === 'reset-day') {
    handleReset(formatKey(state.currentDate));
  } else if (action === 'enable-push') {
    enablePush();
  } else if (action === 'disable-push') {
    disablePush();
  } else if (action === 'save-number') {
    const input = document.getElementById('number-input-' + el.dataset.habit);
    handleSaveNumber(formatKey(state.currentDate), el.dataset.habit, input.value);
  } else if (action === 'habit-new') {
    state.habitForm = defaultHabitForm();
    render();
  } else if (action === 'habit-edit') {
    const h = state.habits.find((x) => x.defId === el.dataset.id);
    if (h) { state.habitForm = habitToForm(h); render(); }
  } else if (action === 'habit-cancel') {
    state.habitForm = null;
    render();
  } else if (action === 'habit-kind') {
    syncHabitFormFromDom();
    state.habitForm.kind = el.dataset.kind;
    render();
  } else if (action === 'habit-mode') {
    syncHabitFormFromDom();
    state.habitForm.mode = el.dataset.mode;
    render();
  } else if (action === 'habit-good') {
    syncHabitFormFromDom();
    state.habitForm.good = el.dataset.good;
    render();
  } else if (action === 'habit-save') {
    await handleHabitSave();
  } else if (action === 'habit-archive') {
    await handleHabitArchive(el.dataset.id, true);
  } else if (action === 'habit-reactivate') {
    await handleHabitArchive(el.dataset.id, false);
  } else if (action === 'habit-delete') {
    await handleHabitDelete(el.dataset.id);
  }
});

app.addEventListener('change', (e) => {
  const stepsEl = e.target.closest('[data-action="habit-steps"]');
  if (stepsEl && state.habitForm) {
    syncHabitFormFromDom();
    let n = Math.round(Number(stepsEl.value));
    if (!Number.isFinite(n)) n = state.habitForm.steps;
    n = Math.max(2, Math.min(8, n));
    state.habitForm.steps = n;
    const labels = state.habitForm.labels;
    state.habitForm.labels = Array.from({ length: n }, (_, i) => labels[i] || '');
    render();
    return;
  }
  const reminderToggle = e.target.closest('[data-action="habit-reminder-toggle"]');
  if (reminderToggle && state.habitForm) {
    syncHabitFormFromDom();
    state.habitForm.reminderEnabled = reminderToggle.checked;
    render();
    return;
  }
  const defaultHourEl = e.target.closest('[data-action="menu-default-hour"]');
  if (defaultHourEl) {
    saveDefaultReminderHour(Number(defaultHourEl.value));
  }
});

// Menü schließen, wenn außerhalb davon geklickt wird.
document.addEventListener('click', (e) => {
  if (!state.menuOpen) return;
  if (e.target.closest('.menu-panel, .menu-btn')) return;
  state.menuOpen = false;
  render();
});

app.addEventListener('keydown', (e) => {
  if (e.target && e.target.classList?.contains('number-input') && e.key === 'Enter') {
    e.preventDefault();
    handleSaveNumber(formatKey(state.currentDate), e.target.dataset.habit, e.target.value);
  }
});

// --- Swipe-Navigation (Heute/Woche/Monat/Jahr: vorheriger/nächster Zeitraum) --------
let touchStartX = null;
let touchStartY = null;
const SWIPE_THRESHOLD = 50;
const SWIPEABLE_VIEWS = ['today', 'week', 'month', 'year'];

app.addEventListener('touchstart', (e) => {
  // Ein Wisch, der innerhalb einer eigenen horizontal scrollbaren Zeile beginnt (z.B. die
  // Feld-Buttons, wenn deren Bezeichnungen den Platz sprengen), soll dort scrollen statt
  // die Ansicht zu wechseln.
  if (!SWIPEABLE_VIEWS.includes(state.view) || e.touches.length !== 1 || e.target.closest('.habit-options, .tabs')) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

app.addEventListener('touchend', (e) => {
  if (touchStartX === null || !SWIPEABLE_VIEWS.includes(state.view)) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  touchStartY = null;
  if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const dir = dx < 0 ? 1 : -1;

  if (state.view === 'today') {
    const isToday = formatKey(state.currentDate) === formatKey(new Date());
    if (dir === 1 && isToday) return; // nicht in die Zukunft
    state.currentDate = addDays(state.currentDate, dir);
  } else if (state.view === 'week') {
    state.weekAnchor = addDays(state.weekAnchor, dir * 7);
  } else if (state.view === 'month') {
    const d = new Date(state.monthAnchor);
    d.setMonth(d.getMonth() + dir);
    state.monthAnchor = d;
  } else if (state.view === 'year') {
    state.yearAnchor += dir;
  }
  render();
}, { passive: true });

// --- Felder-Reihenfolge per Drag (Tab "Felder") ---------------------------
// Während des Ziehens wird NIE render() aufgerufen (das würde den gesamten #app-Inhalt
// ersetzen und damit die Pointer-Capture/laufende Geste kaputtmachen) — stattdessen nur
// direkte Style-Änderungen an den vorhandenen Zeilen. Erst beim Loslassen wird die neue
// Reihenfolge in state.habits übernommen, gespeichert und einmal sauber neu gerendert.
let dragState = null;

app.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('[data-action="drag-handle"]');
  if (!handle) return;
  const row = handle.closest('.manage-row');
  const rows = [...row.parentElement.children];
  const fromIndex = rows.indexOf(row);
  const first = rows[0].getBoundingClientRect();
  const last = rows[rows.length - 1].getBoundingClientRect();
  const rowHeight = rows.length > 1 ? (last.top - first.top) / (rows.length - 1) : first.height;

  dragState = { pointerId: e.pointerId, row, rows, fromIndex, toIndex: fromIndex, startY: e.clientY, rowHeight };
  row.setPointerCapture(e.pointerId);
  row.classList.add('manage-row--dragging');
  e.preventDefault();
});

app.addEventListener('pointermove', (e) => {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  const deltaY = e.clientY - dragState.startY;
  dragState.row.style.transform = `translateY(${deltaY}px)`;

  let toIndex = dragState.fromIndex + Math.round(deltaY / dragState.rowHeight);
  toIndex = Math.max(0, Math.min(dragState.rows.length - 1, toIndex));
  if (toIndex === dragState.toIndex) return;
  dragState.toIndex = toIndex;
  dragState.rows.forEach((r, i) => {
    if (r === dragState.row) return;
    let shift = 0;
    if (toIndex > dragState.fromIndex && i > dragState.fromIndex && i <= toIndex) shift = -dragState.rowHeight;
    else if (toIndex < dragState.fromIndex && i < dragState.fromIndex && i >= toIndex) shift = dragState.rowHeight;
    r.style.transition = 'transform 150ms ease';
    r.style.transform = shift ? `translateY(${shift}px)` : '';
  });
});

app.addEventListener('pointerup', async (e) => {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  const { row, rows, fromIndex, toIndex } = dragState;
  row.releasePointerCapture(e.pointerId);
  row.classList.remove('manage-row--dragging');
  rows.forEach((r) => { r.style.transform = ''; r.style.transition = ''; });
  dragState = null;
  if (toIndex === fromIndex) return;

  const reordered = [...rows];
  const [movedEl] = reordered.splice(fromIndex, 1);
  reordered.splice(toIndex, 0, movedEl);
  const newIds = reordered.map((r) => r.dataset.defId);

  const activeInOrder = newIds.map((id, i) => ({ ...state.habits.find((h) => h.defId === id), sortOrder: i + 1 }));
  const others = state.habits.filter((h) => !newIds.includes(h.defId));
  state.habits = [...activeInOrder, ...others];
  render();

  const results = await Promise.all(
    activeInOrder.map((h) => supabase.from('habit_definitions').update({ sort_order: h.sortOrder }).eq('id', h.defId))
  );
  const failed = results.find((r) => r.error);
  if (failed) {
    state.notice = { type: 'error', text: 'Reihenfolge konnte nicht gespeichert werden: ' + failed.error.message };
    render();
  }
});

// --- Auth-Status & Start ---------------------------------------------------
// authFlowInFlight: von den Login/Signup-Submit-Handlern VOR dem signUp/
// signInWithPassword-Aufruf gesetzt (nicht erst danach — onAuthStateChange kann schon
// in der Lücke dazwischen feuern) und erst nach completeAuthFlow() wieder gelöscht.
// Solange gesetzt, überlässt onAuthStateChange dem Submit-Handler komplett das
// Entsperren + Laden (dort ist das Passwort im Klartext verfügbar) — sonst würde
// onAuthStateChange parallel einen zweiten, redundanten Cache-Entsperr-Versuch
// starten und dabei ggf. kurz den Passwort-Abfrage-Screen aufblitzen lassen, obwohl
// das Passwort gerade eben schon eingegeben wurde.
let authFlowInFlight = false;

async function completeAuthFlow(userId, password) {
  await unlockEncryption(userId, password);
  state.loading = true;
  render();
  await Promise.all([loadEntries(), loadHabits(), loadUserSettings()]);
  state.loading = false;
  checkPushStatus().then(render);
  render();
}

supabase.auth.onAuthStateChange(async (event, session) => {
  state.session = session;
  state.authError = null;
  if (event === 'PASSWORD_RECOVERY') {
    state.passwordRecovery = true;
    render();
    return;
  }
  if (authFlowInFlight) { render(); return; }
  if (session) {
    if (currentDek) { render(); return; }
    // Kein Passwort verfügbar (Session-Wiederherstellung, z.B. Browser-Reload) - nur
    // der lokale Cache kann hier helfen, sonst muss renderUnlockPrompt() greifen.
    state.loading = true;
    render();
    const cached = await loadCachedDek(session.user.id).catch(() => null);
    if (cached) {
      currentDek = cached;
      await Promise.all([loadEntries(), loadHabits(), loadUserSettings()]);
      checkPushStatus().then(render);
    }
    state.loading = false;
  } else {
    state.entries = {};
    state.habits = [];
    currentDek = null;
  }
  render();
});

const { data: { session } } = await supabase.auth.getSession();
state.session = session;
state.loading = false;
render();
</script>
